# After every save in the website editor: event codes in date order (earliest = gvl-1), and every flyer upload
# (any type, HEIC and PDF too) becomes current/flyers/<code>.webp, renamed when its code changes. See tidy_site.py.
name: Tidy events
on:
  push:
    branches: [main]
    paths: ["current/**"]
permissions:
  contents: write
concurrency: { group: tidy, cancel-in-progress: false }
jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet pillow pillow-heif pypdfium2
      - run: python tidy_site.py
      - name: Save
        run: |
          git add -A current
          git diff --cached --quiet && exit 0
          git -c user.name="Lab events tidy" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Tidy: event codes and flyers"
          git push -q
