  - name: "lab-themes"
    label: "Labs · Themes"
    description: "Page colors for the lab instructions, like the event Backgrounds. Every color is checked for contrast when the pages build."
    type: "file"
    path: "labs/themes.json"
    format: "json"
    fields:
      - name: "themes"
        label: "Themes"
        type: "object"
        fields:
          - name: "ung"
            label: "UNG (as approved)"
            type: "object"
            fields:
              - name: "label"
