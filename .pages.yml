# Pages CMS editor config. Generated by labs/class-pages/src/make_pages_cms.py — edit that, not this.
media:
  - name: "files"
    label: "Flyers, prize photos and music"
    input: "current"
    output: ""
    extensions:
      - "jpg"
      - "jpeg"
      - "png"
      - "webp"
      - "gif"
      - "avif"
      - "pdf"
      - "mp3"
    rename: "safe"
content:
  - name: "events"
    label: "Events"
    type: "file"
    path: "current/events.json"
    format: "json"
    fields:
      - name: "events"
        label: "Events"
        type: "object"
        description: "Newest at the bottom. Click an event to open it."
        list:
          collapsible:
            collapsed: true
            summary: "{fields.date} · {fields.title}"
        fields:
          - name: "title"
            label: "Event name"
            type: "string"
            required: true
            options:
              maxlength: 80
          - name: "status"
            label: "Show it to students?"
            type: "select"
            description: "Drafts stay hidden. Past events drop off the site by themselves."
            required: true
            default: "published"
            options:
              values:
                - name: "published"
                  label: "Yes, show it"
                - name: "draft"
                  label: "Not yet (draft)"
          - name: "campus"
            label: "Campus"
            type: "select"
            required: true
            options:
              values:
                - name: "gvl"
                  label: "Gainesville"
                - name: "dah"
                  label: "Dahlonega"
                - name: "ocn"
                  label: "Oconee"
                - name: "cmg"
                  label: "Cumming"
          - name: "date"
            label: "Date"
            type: "date"
            options:
              format: "yyyy-MM-dd"
            required: true
          - name: "start"
            label: "Starts"
