# Pages CMS editor config. Generated by labs/class-pages/src/make_pages_cms.py — edit that, not this.
media:
  - name: "files"
    label: "Flyers, prize photos and music"
    input: "current"
    output: ""
    extensions:
      - "avif"
      - "bmp"
      - "gif"
      - "heic"
      - "heif"
      - "jpeg"
      - "jpg"
      - "mp3"
      - "pdf"
      - "png"
      - "tif"
      - "tiff"
      - "webp"
    rename: "safe"
content:
  - name: "events"
    label: "Events"
    description: "Pick what each event uses. Make new flyers, forms, tasks and competitions in their own tabs first."
    type: "file"
    path: "current/events.json"
    format: "json"
    fields:
      - name: "events"
        label: "Events"
        type: "object"
        description: "Click an event to open it. The code is set for you."
        list:
          collapsible:
            collapsed: true
            summary: "{fields.key} · {fields.date} · {fields.title}"
        fields:
          - name: "title"
            label: "Event name"
            type: "string"
            required: true
            options:
              maxlength: 80
          - name: "status"
            label: "Show it to students?"
            type: "select"
            description: "Drafts stay hidden. Past events drop off the site by themselves."
            required: true
            default: "published"
            options:
              values:
                - name: "published"
                  label: "Yes, show it"
                - name: "draft"
                  label: "Not yet (draft)"
          - name: "campus"
            label: "Campus"
            type: "select"
            required: true
            options:
              values:
                - name: "gvl"
                  label: "Gainesville"
                - name: "dah"
                  label: "Dahlonega"
                - name: "ocn"
                  label: "Oconee"
                - name: "cmg"
                  label: "Cumming"
          - name: "date"
            label: "Date"
            type: "date"
            options:
              format: "yyyy-MM-dd"
            required: true
          - name: "start"
            label: "Starts"
            type: "select"
