<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lab Events Console</title>
<!-- Visual console for the events site (2026-11-07). Holds NO data: everything is read from the GitHub repo when the page
     opens, and Save writes one commit back through GitHub's API with a token kept only in this browser (CLAUDE.md rule 11).
     Same files and rules as the Pages CMS editor: current/events.json + current/library/<tab>/*.json
     (see language-lab-events/event_library.py). Event codes and flyer names are tidied in the same commit (tidy_site.py rules). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
/* Canonical tokens (design-system skill, student theme), same as admin/index.html. Dark mode re-maps them. */
:root {
  --navy: #1A3A6B; --navy-dark: #132C52; --gold: #B08D3F; --offwhite: #F7F7F5; --white: #FFFFFF; --ink: #1F2937; --muted: #5A6472;
  --bg: var(--offwhite); --surface: var(--white); --text: var(--ink); --sub: var(--muted); --line: #DCDDD8;
  --accent: var(--navy); --accent-ink: var(--white); --rail: var(--white); --chip: #EEF0F3;
  --ok: #1E6B45; --ok-bg: #E3F1E8; --warn: #8A4B08; --warn-bg: #FBEEDB; --bad: #A12A2A; --bad-bg: #F9E3E3; --shadow: 0 1px 2px rgba(20,30,50,.06), 0 8px 24px rgba(20,30,50,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-mode="light"]) {
  --bg: #0E1F3A; --surface: var(--navy-dark); --text: var(--offwhite); --sub: #C9CFD8; --line: #2B4670;
  --accent: var(--offwhite); --accent-ink: var(--navy-dark); --rail: #102443; --chip: #1C3864;
  --ok: #8FD9AE; --ok-bg: #173F33; --warn: #F2C47E; --warn-bg: #4A3415; --bad: #F4A3A3; --bad-bg: #4A1E26; --shadow: none; color-scheme: dark; } }
:root[data-mode="dark"] {
  --bg: #0E1F3A; --surface: var(--navy-dark); --text: var(--offwhite); --sub: #C9CFD8; --line: #2B4670;
  --accent: var(--offwhite); --accent-ink: var(--navy-dark); --rail: #102443; --chip: #1C3864;
  --ok: #8FD9AE; --ok-bg: #173F33; --warn: #F2C47E; --warn-bg: #4A3415; --bad: #F4A3A3; --bad-bg: #4A1E26; --shadow: none; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 400 16px/1.5 "DM Sans", sans-serif; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
h1[tabindex="-1"]:focus { outline: none; }
.skip { position: absolute; left: 12px; top: -48px; background: var(--surface); padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; z-index: 20; }
.skip:focus { top: 12px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.shell { display: grid; grid-template-columns: 264px 1fr; min-height: 100vh; }
.rail { background: var(--rail); border-right: 1px solid var(--line); padding: 22px 14px; display: flex; flex-direction: column; gap: 20px; position: sticky; top: 0; height: 100vh; overflow: auto; }
.brand { padding: 0 8px; }
.brand small { display: block; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--sub); }
.brand b { font: 700 23px/1.2 "Source Serif 4", serif; }
nav h2 { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--sub); margin: 0 8px 6px; }
nav ul { list-style: none; margin: 0 0 14px; padding: 0; }
nav button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px; border: 0; background: none; border-radius: 8px; font-weight: 500; cursor: pointer; text-align: left; }
nav button:hover { background: var(--chip); }
nav button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
nav .n { margin-left: auto; font-size: 13px; color: var(--sub); }
nav button[aria-current="page"] .n { color: inherit; opacity: .8; }
.rail-foot { margin-top: auto; display: grid; gap: 8px; padding: 0 8px; }
.conn { font-size: 14px; color: var(--sub); display: flex; gap: 8px; align-items: center; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); flex: none; }
.dot.on { background: var(--ok); }

main { padding: 28px clamp(16px, 3.5vw, 48px) 64px; min-width: 0; }
.head { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; margin-bottom: 20px; }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--sub); margin: 0 0 4px; }
h1 { font: 700 clamp(26px, 3vw, 34px)/1.15 "Source Serif 4", serif; margin: 0; }
.lede { color: var(--sub); margin: 6px 0 0; max-width: 64ch; }
h2.sec { font: 700 20px/1.3 "Source Serif 4", serif; margin: 28px 0 12px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 9px 16px; border-radius: 10px; font-weight: 600; text-decoration: none; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.btn:hover { background: var(--chip); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.12); background: var(--accent); }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.sm { min-height: 34px; padding: 5px 12px; font-size: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
.stat b { display: block; font: 700 32px/1 "Source Serif 4", serif; margin-bottom: 6px; }
.stat span { color: var(--sub); font-size: 15px; }

.issues { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.issues li { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--chip); color: var(--text); white-space: nowrap; }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.bad { background: var(--bad-bg); color: var(--bad); }
.empty { color: var(--sub); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 18px; }

/* events */
.evlist { display: grid; gap: 12px; }
.ev { display: grid; grid-template-columns: 76px 92px 1fr auto; gap: 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px 12px 12px; box-shadow: var(--shadow); text-align: left; width: 100%; cursor: pointer; }
.ev:hover { border-color: var(--sub); }
.ev.past { opacity: .62; }
.date { text-align: center; border-radius: 10px; background: var(--chip); padding: 8px 4px; }
.date small { display: block; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--sub); }
.date b { display: block; font: 700 28px/1 "Source Serif 4", serif; }
.thumb { width: 92px; height: 92px; border-radius: 8px; background: var(--chip) center/cover no-repeat; display: grid; place-items: center; color: var(--sub); font-size: 12px; text-align: center; overflow: hidden; }
.ev h3 { font: 600 18px/1.3 "Source Serif 4", serif; margin: 0 0 4px; }
.ev .meta { color: var(--sub); font-size: 14px; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.code { font: 600 13px ui-monospace, Menlo, Consolas, monospace; background: var(--chip); padding: 2px 7px; border-radius: 6px; }

/* library */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.item .pic { aspect-ratio: 4 / 5; background: var(--chip) center/contain no-repeat; border-bottom: 1px solid var(--line); }
.item .body { padding: 14px 16px; display: grid; gap: 6px; flex: 1; align-content: start; }
.item h3 { font: 600 17px/1.3 "Source Serif 4", serif; margin: 0; }
.item p { margin: 0; color: var(--sub); font-size: 14px; overflow-wrap: anywhere;  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.item .foot { padding: 10px 16px 14px; display: flex; gap: 8px; flex-wrap: wrap; }

/* editor panel */
dialog { border: 0; padding: 0; margin: 0 0 0 auto; height: 100vh; max-height: 100vh; width: min(640px, 100vw); background: var(--bg); color: var(--text); box-shadow: -12px 0 40px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(10,20,40,.45); }
.pane { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }
.pane header { padding: 18px 22px; border-bottom: 1px solid var(--line); background: var(--surface); display: flex; gap: 12px; align-items: start; justify-content: space-between; }
.pane header h2 { font: 700 22px/1.25 "Source Serif 4", serif; margin: 0; }
.pane .scroll { overflow: auto; padding: 18px 22px 28px; }
.pane footer { padding: 14px 22px; border-top: 1px solid var(--line); background: var(--surface); display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
.x { border: 0; background: none; font-size: 22px; line-height: 1; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
.x:hover { background: var(--chip); }
fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 16px; margin: 0 0 14px; background: var(--surface); }
legend { font-weight: 700; padding: 0 6px; }
.f { display: grid; gap: 4px; margin-bottom: 12px; }
.f:last-child { margin-bottom: 0; }
.f label { font-weight: 600; font-size: 15px; }
.f .hint { color: var(--sub); font-size: 13px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.three { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 12px; }
input[type=text], input[type=url], input[type=date], input[type=password], select, textarea { width: 100%; min-height: 42px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); }
textarea { min-height: 84px; resize: vertical; }
input[readonly] { background: var(--chip); }
.switch { display: flex; align-items: center; gap: 12px; font-weight: 600; cursor: pointer; margin-bottom: 12px; }
.switch input { appearance: none; width: 46px; height: 26px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; flex: none; margin: 0; transition: background .15s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--white); transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.switch input:checked { background: var(--ok); }
.switch input:checked::after { transform: translateX(20px); }
.off .dep select, .off .dep input { border-style: dashed; }
.preview { display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: center; margin-bottom: 14px; }
.preview .thumb { width: 120px; height: 150px; background-size: contain; }
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 16px; text-align: center; color: var(--sub); }
.drop.over { border-color: var(--gold); background: var(--chip); }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 10px; font-weight: 600; z-index: 30; max-width: calc(100vw - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.toast[hidden] { display: none; }
.loading { color: var(--sub); padding: 40px 0; }
.howto { counter-reset: s; list-style: none; padding: 0; display: grid; gap: 10px; max-width: 70ch; }
.howto li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.howto li::before { content: counter(s); display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--gold); font-weight: 600; font-size: 14px; }
code { font: 500 14px ui-monospace, Menlo, Consolas, monospace; background: var(--chip); border-radius: 4px; padding: 1px 6px; }

@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .rail { position: sticky; top: 0; z-index: 5; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 10px 16px 8px; gap: 8px; display: grid; grid-template-columns: 1fr auto; align-items: center; }
  .brand b { font-size: 19px; }
  .rail-foot { margin: 0; grid-column: 2; grid-row: 1; }
  .rail-foot .conn, .rail-foot #modeBtn { display: none; }
  nav { grid-column: 1 / -1; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 4px; }
  nav h2 { display: none; } nav ul { display: contents; }
  nav button { white-space: nowrap; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 15px; width: auto; }
  .ev { grid-template-columns: 64px 1fr; } .ev .thumb { display: none; } .ev > :last-child { grid-column: 1 / -1; }
  .two, .three { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) { .view { animation: in .18s ease-out; } @keyframes in { from { opacity: 0; transform: translateY(4px); } } }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="shell">
  <header class="rail">
    <div class="brand"><small>Language Lab</small><b>Events console</b></div>
    <nav aria-label="Console sections" id="nav"></nav>
    <div class="rail-foot">
      <div class="conn" id="conn"><span class="dot" aria-hidden="true"></span><span>Viewing only</span></div>
      <button class="btn sm" type="button" id="modeBtn">Dark mode</button>
      <a class="btn sm" href="./">Help page</a>
    </div>
  </header>
  <main id="main" tabindex="-1"><p class="loading">Loading the events…</p></main>
</div>
<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<p class="toast" id="toast" role="status" aria-live="polite" hidden></p>

<script>
'use strict';
/* ---------- where the data lives (nothing is stored in this file) ---------- */
const OWNER = 'junnynoh-tech', REPO = 'language-lab-events', BRANCH = 'main';
const REQ_REPO = 'lab-event-requests'; // PRIVATE: requests from organizations (names, emails). Read only with the key.
const API = `https://api.github.com/repos/${OWNER}/${REPO}`, apiOf = repo => `https://api.github.com/repos/${OWNER}/${repo}`;
const CMS = `https://app.pagescms.org/${OWNER}/${REPO}/${BRANCH}`;
const SITE = `https://${OWNER}.github.io/${REPO}/`;
const TOKEN_KEY = 'labConsoleToken';
const EC_NOTE = 'Extra credit is up to each instructor. Ask yours whether this event counts in your course.';
const KINDS = {
  flyers: { label: 'Flyers', one: 'flyer', primary: 'title', blurb: 'Upload once; an event picks it. Each becomes a web image named after its event code.' },
  forms: { label: 'Sign-up forms', one: 'form', primary: 'title', blurb: 'Links to sign-up or entry forms. Each event sets its own deadline.' },
  'extra-credit': { label: 'Extra credit', one: 'extra-credit note', primary: 'title', blurb: 'What students are told about extra credit.' },
  assignments: { label: 'Assignments', one: 'assignment', primary: 'name', blurb: 'Mini-projects and assignments. Reuse one across events; each event sets its own due date.' },
  competitions: { label: 'Competitions', one: 'competition', primary: 'title', blurb: 'How it works, prizes, rules and judging.' },
  music: { label: 'Music', one: 'track', primary: 'title', blurb: 'Free-to-use tracks (Public domain or Creative Commons) for the carousel turntable.' },
};
/* which event field points at each tab (used for "Used by" and safe deletes) */
const USES = { flyers: e => [e.flyer_pick], music: e => e.music_pick || [], forms: e => [e.signup?.form], 'extra-credit': e => [e.credit?.option],
  assignments: e => [e.assignment?.pick], competitions: e => [e.competition?.pick] };
const LANGS = [['es', 'Spanish'], ['fr', 'French'], ['de', 'German'], ['it', 'Italian'], ['pt', 'Portuguese'], ['zh', 'Chinese'], ['ja', 'Japanese'], ['ko', 'Korean'], ['ar', 'Arabic'], ['ru', 'Russian']];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const slug = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const clean = s => typeof s === 'string' ? s.trim().replace(/^.*?\/?current\//, '').replace(/^\/+/, '') : '';
const fname = n => { n = String(n || '').trim().split('/').pop(); return n && !/\.json$/i.test(n) ? n + '.json' : n; };
const at = (d, t) => new Date(`${d}T${t || '00:00'}`);
const fmtTime = t => { if (!t) return ''; const [h, m] = t.split(':').map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`; };
const TIMES = (() => { const o = []; for (let h = 7; h < 22; h++) for (const m of [0, 15, 30, 45]) o.push(`${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`); return o; })();
const today = new Date(); today.setHours(0, 0, 0, 0);

/* ---------- state ---------- */
let S = { head: '', tree: {}, events: null, lib: {}, themes: {}, rubrics: [], view: 'overview' };
let token = ''; try { token = localStorage.getItem(TOKEN_KEY) || ''; } catch (e) {}

function toast(msg, ms = 3200) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, ms); }
function setMode(m) { document.documentElement.dataset.mode = m; $('modeBtn').textContent = m === 'dark' ? 'Light mode' : 'Dark mode'; try { localStorage.setItem('labConsoleMode', m); } catch (e) {} }
(() => { let m = null; try { m = localStorage.getItem('labConsoleMode'); } catch (e) {} setMode(m || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')); })();
$('modeBtn').onclick = () => setMode(document.documentElement.dataset.mode === 'dark' ? 'light' : 'dark');

/* ---------- GitHub ---------- */
async function gh(path, opt = {}, repo = REPO) {
  const r = await fetch(apiOf(repo) + path, { ...opt, headers: { Accept: 'application/vnd.github+json', ...(token ? { Authorization: `Bearer ${token}` } : {}), ...(opt.body ? { 'Content-Type': 'application/json' } : {}) } });
  if (!r.ok) { const j = await r.json().catch(() => ({})); const err = new Error(j.message || r.statusText); err.status = r.status; throw err; }
  return r.status === 204 ? null : r.json();
}
const raw = p => `https://raw.githubusercontent.com/${OWNER}/${REPO}/${S.head}/${p.split('/').map(encodeURIComponent).join('/')}`;
const getJSON = p => fetch(raw(p)).then(r => r.ok ? r.json() : null).catch(() => null);
const b64 = str => btoa(unescape(encodeURIComponent(str)));
const bufB64 = buf => { let s = ''; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
const dump = o => JSON.stringify(o, null, 2) + '\n';

async function load() {
  $('main').innerHTML = '<p class="loading">Loading the events…</p>';
  try {
    const c = await gh(`/commits/${BRANCH}`); S.head = c.sha;
    const t = await gh(`/git/trees/${S.head}?recursive=1`);
    S.tree = Object.fromEntries(t.tree.filter(x => x.type === 'blob').map(x => [x.path, x.sha]));
  } catch (e) {
    $('main').innerHTML = `<div class="empty" role="alert"><b>GitHub didn't answer.</b> ${esc(e.status === 403 ? 'Too many looks without a key for now: connect your key (Settings) or try again in an hour.' : e.message)}</div>`; return;
  }
  const libPaths = Object.keys(S.tree).filter(p => /^current\/library\/[^/]+\/[^/]+\.json$/.test(p));
  const [events, themes, ...items] = await Promise.all([getJSON('current/events.json'), getJSON('current/themes.json'), ...libPaths.map(getJSON)]);
  S.events = events; S.themes = themes?.themes || {};
  S.lib = Object.fromEntries(Object.keys(KINDS).map(k => [k, {}]));
  libPaths.forEach((p, i) => { const [, , kind, name] = p.split('/'); if (S.lib[kind] && items[i]) S.lib[kind][name] = items[i]; });
  const rub = Object.keys(S.tree).filter(p => /^current\/rubrics\/[^/]+\.json$/.test(p));
  S.rubrics = await Promise.all(rub.map(async p => ({ value: p.replace('current/', ''), label: (await getJSON(p))?.title || p.split('/').pop() })));
  if (!S.events) { $('main').innerHTML = '<div class="empty" role="alert">events.json could not be read.</div>'; return; }
  codes(S.events);
  await loadRequests();
  connUI(); nav(); show(S.view, false);
}

/* one commit for every file a Save touches. files: { path: {text}|{b64}|{sha}|null } */
async function commit(files, message, repo = REPO) {
  if (!token) { openSettings(); throw new Error('Connect your GitHub key first.'); }
  const G = (p, o) => gh(p, o, repo), pub = repo === REPO;
  const ref = await G(`/git/ref/heads/${BRANCH}`), head = ref.object.sha;
  if (pub && head !== S.head) { // someone saved since this page loaded: stop if they touched the same files
    const cmp = await G(`/compare/${S.head}...${head}`);
    const clash = (cmp.files || []).map(f => f.filename).filter(f => f in files);
    if (clash.length) throw new Error(`Someone else just changed ${clash.join(', ')}. Press Reload, then make your change again.`);
  }
  const base = (await G(`/git/commits/${head}`)).tree.sha;
  const tree = [];
  for (const [path, v] of Object.entries(files)) {
    if (v === null) { if (!pub || S.tree[path]) tree.push({ path, mode: '100644', type: 'blob', sha: null }); continue; }
    const sha = v.sha || (await G('/git/blobs', { method: 'POST', body: JSON.stringify(v.b64 ? { content: v.b64, encoding: 'base64' } : { content: b64(v.text), encoding: 'base64' }) })).sha;
    tree.push({ path, mode: '100644', type: 'blob', sha });
  }
  const nt = await G('/git/trees', { method: 'POST', body: JSON.stringify({ base_tree: base, tree }) });
  const nc = await G('/git/commits', { method: 'POST', body: JSON.stringify({ message, tree: nt.sha, parents: [head] }) });
  await G(`/git/refs/heads/${BRANCH}`, { method: 'PATCH', body: JSON.stringify({ sha: nc.sha }) });
  if (!pub) return;
  S.head = nc.sha;
  for (const [path, v] of Object.entries(files)) { if (v === null) delete S.tree[path]; else S.tree[path] = v.sha || 'new'; }
}

/* ---------- the same rules as event_library.py / tidy_site.py ---------- */
function codes(doc) {
  const n = {}, k = e => [e.date || '', e.start || '', e.title || ''];
  [...(doc.events || [])].sort((a, b) => { const x = k(a), y = k(b); for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] < y[i] ? -1 : 1; return 0; })
    .forEach(e => { const c = e.campus || 'gvl'; n[c] = (n[c] || 0) + 1; e.key = `${c}-${n[c]}`; });
  (doc.events || []).forEach(e => { if (!e.id) e.id = [e.date, slug(e.title)].filter(Boolean).join('-'); });
}
/* events.json + every flyer rename the new codes need, as commit files. Flyer files are moved (same content) to flyers/<code>.<ext>. */
function eventFiles(doc) {
  codes(doc); doc.library = 1;
  const files = { 'current/events.json': { text: dump(doc) } }, taken = new Set(), moves = [];
  [...doc.events].sort((a, b) => a.key < b.key ? -1 : 1).forEach(e => {
    const pick = fname(e.flyer_pick); if (!pick || taken.has(pick)) return; taken.add(pick);
    const fl = S.lib.flyers[pick]; if (!fl?.image) return;
    const from = 'current/' + clean(fl.image), ext = (from.match(/\.[a-z0-9]+$/i) || ['.webp'])[0].toLowerCase(), to = `current/flyers/${e.key}${ext}`;
    if (from === to || !S.tree[from] || S.tree[from] === 'new') return;
    moves.push({ from, to, sha: S.tree[from], pick, fl });
  });
  const targets = new Set(moves.map(m => m.to));
  /* a flyer no event picks any more, sitting where a moved one will land: step it aside under its own name */
  Object.entries(S.lib.flyers).forEach(([n, fl]) => {
    const p = 'current/' + clean(fl.image); if (taken.has(n) || !targets.has(p) || !S.tree[p]) return;
    let to = `current/flyers/${slug(fl.title || n.replace(/\.json$/, '')) || 'flyer'}${(p.match(/\.[a-z0-9]+$/i) || ['.webp'])[0]}`, i = 2;
    while (S.tree[to] || targets.has(to)) to = to.replace(/(-\d+)?(\.[a-z0-9]+)$/i, `-${i++}$2`);
    moves.push({ from: p, to, sha: S.tree[p], pick: n, fl }); targets.add(to);
  });
  moves.forEach(m => { files[m.to] = { sha: m.sha }; if (!targets.has(m.from)) files[m.from] = null;
    m.fl.image = m.to.replace('current/', ''); files[`current/library/flyers/${m.pick}`] = { text: dump(m.fl) }; });
  return files;
}
const usedBy = (kind, name) => (S.events.events || []).filter(e => USES[kind](e).map(fname).includes(name));
const item = (kind, name) => S.lib[kind]?.[fname(name)] || null;
const on = o => o?.on === true;

function issues() {
  const out = [], upcoming = (S.events.events || []).filter(e => at(e.date) >= today);
  upcoming.forEach(e => {
    const L = `${e.key} · ${e.title}`;
    if (!e.flyer_pick) out.push(['warn', L, 'No flyer picked', e]);
    else if (!item('flyers', e.flyer_pick)) out.push(['bad', L, 'Its flyer was deleted', e]);
    if (on(e.signup) && !item('forms', e.signup.form)) out.push(['bad', L, 'Sign-up is on but no form is picked', e]);
    if (on(e.signup) && e.signup.deadline && e.signup.deadline > e.date) out.push(['warn', L, 'Sign-up deadline is after the event', e]);
    if (on(e.assignment) && !item('assignments', e.assignment.pick)) out.push(['bad', L, 'Assignment is on but none is picked', e]);
    if (on(e.competition) && !item('competitions', e.competition.pick)) out.push(['bad', L, 'Competition is on but none is picked', e]);
    if (!e.summary) out.push(['warn', L, 'No short description', e]);
  });
  Object.entries(S.lib.flyers).forEach(([n, f]) => { if (!f.alt) out.push(['warn', `Flyer · ${f.title || n}`, 'No description for screen readers', null, ['flyers', n]]);
    if (f.image && !/\.webp$/i.test(f.image)) out.push(['warn', `Flyer · ${f.title || n}`, 'Not converted to a web image yet (happens at the next tidy)', null, ['flyers', n]]); });
  return out;
}

/* any picture or PDF -> WebP (max 1600 px wide) in the browser; null if this browser can't read it (e.g. HEIC outside Safari) */
async function toWebp(file) {
  const MAXW = 1600;
  let src;
  try {
    if (/pdf/i.test(file.type) || /\.pdf$/i.test(file.name)) {
      const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
      if (!window.pdfjsLib) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = PDFJS + 'pdf.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
      pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
      const page = await (await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise).getPage(1);
      const vp = page.getViewport({ scale: MAXW / page.getViewport({ scale: 1 }).width });
      src = document.createElement('canvas'); src.width = vp.width; src.height = vp.height;
      await page.render({ canvasContext: src.getContext('2d'), viewport: vp }).promise;
    } else src = await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch (e) { return null; }
  const w = Math.min(MAXW, src.width), h = Math.round(src.height * w / src.width);
  const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(src, 0, 0, w, h);
  const blob = await new Promise(r => c.toBlob(r, 'image/webp', 0.88));
  return blob && blob.type === 'image/webp' ? blob : null;
}

    <fieldset><legend>Flyer</legend>${r.flyer ? `<div class="preview"><span class="thumb" style="${isImg ? `background-image:url('${fly}')` : ''}">${isImg ? '' : 'PDF / photo'}</span><p class="hint" style="margin:0">“${esc(d.flyer.alt)}”</p></div>` : '<p class="hint" style="margin:0">They will email the flyer. Add it later in Flyers.</p>'}</fieldset>
    <fieldset><legend>Background</legend>${fld('r-theme', 'Background', sel('r-theme', S.themes[th] ? th : '', Object.entries(S.themes).map(([k, v]) => [k, v.label || k]), 'Plain (no background)'), th ? 'Their pick is selected.' : '')}
      ${d.background?.idea ? `<p class="hint" style="margin:0"><b>Their idea:</b> ${esc(d.background.idea)}</p>` : ''}</fieldset>
    <fieldset><legend>Music</legend>
      ${m.kind === 'commons' ? `<label class="switch"><input type="checkbox" role="switch" id="r-addtrack" checked>Add their track: ${esc(m.title)}</label><p class="hint" style="margin:0 0 8px">${esc(m.artist)} · ${esc(m.license)} · <a href="${esc(m.source)}" target="_blank" rel="noopener">Commons page ↗</a> (checked as free to use when they sent it)</p><audio controls preload="none" src="${esc(m.mp3)}" style="width:100%"></audio>`
        : m.kind === 'none' && m.idea ? `<p class="hint" style="margin:0 0 8px"><b>Their wish:</b> ${esc(m.idea)}</p>` : ''}
      ${fld('r-music', m.kind === 'commons' ? 'Or use one of ours instead' : 'Track', sel('r-music', m.kind === 'library' ? fname(m.pick) : '', libOpts('music'), m.kind === 'commons' ? 'Their track (above)' : 'No music'))}</fieldset>
    ${d.signup?.needed ? `<fieldset><legend>Sign-up</legend><p style="margin:0"><a href="${esc(d.signup.url)}" target="_blank" rel="noopener">${esc(d.signup.url)}</a>${d.signup.deadline ? ` · by ${esc(d.signup.deadline)} ${esc(fmtTime(d.signup.deadline_time))}` : ''}</p></fieldset>` : ''}
    ${d.extras?.competition || d.extras?.notes ? `<fieldset><legend>Extras</legend>${d.extras.competition ? `<p style="margin:0 0 8px"><b>Competition:</b> ${esc(d.extras.competition)}</p>` : ''}${d.extras.notes ? `<p style="margin:0"><b>Notes:</b> ${esc(d.extras.notes)}</p>` : ''}<p class="hint" style="margin:8px 0 0">Set up a competition in Competitions, then switch it on in the event.</p></fieldset>` : ''}
    <fieldset><legend>Your decision</legend>${fld('r-status', 'When approved', sel('r-status', 'published', [['published', 'Show it to students now'], ['draft', 'Add it as a draft']]))}
      ${fld('r-note', 'Note to them (optional)', area('r-note', d.admin?.note || ''), 'Goes into the email that opens after you decide.')}</fieldset>`;
  const foot = pending ? `<div class="row"><button class="btn danger" type="button" id="r-decline">Decline</button></div><div class="row"><button class="btn" type="button" data-close2>Later</button><button class="btn primary" type="button" id="r-approve">Approve and add event</button></div>`
    : `<div class="row"><span class="tag ${d.status === 'approved' ? 'ok' : ''}">${esc(d.status === 'approved' ? 'Approved' : 'Declined')} ${esc(new Date(d.admin?.decided_at || d.submitted_at).toLocaleDateString())}</span></div><div class="row"><a class="btn" href="${mail(`Your Language Lab event: ${e.title}`, '')}">Email them</a><button class="btn" type="button" data-close2>Close</button></div>`;
  pane(e.title, `Request from ${d.organizer.organization}`, body, foot);
  $('dlg').querySelector('[data-close2]').onclick = () => $('dlg').close();
  if (!pending) return;
  const decide = async (status, extra = {}) => {
    const nd = { ...d, status, admin: { ...(d.admin || {}), decided_at: new Date().toISOString(), note: val('r-note'), ...extra } };
    await commit({ [r.path]: { text: dump(nd) } }, `${status === 'approved' ? 'Approve' : 'Decline'}: ${e.title}`, REQ_REPO);
    r.data = nd;
  };
  $('r-decline').onclick = ev => { if (!confirm(`Decline “${e.title}”? Your email to ${d.organizer.email} opens next.`)) return;
    saving(ev.target, async () => { await decide('declined'); location.href = mail(`Your Language Lab event request: ${e.title}`, `Hello ${d.organizer.name},\n\nThank you for your request. Unfortunately we can't host "${e.title}" in the Language Lab as requested.${val('r-note') ? '\n\n' + val('r-note') : ''}\n\nUNG Language Lab`); }); };
  $('r-approve').onclick = ev => {
    if (val('r-end') <= val('r-start')) { toast('The event has to end after it starts.'); return; }
    if (clashes({ event: { date: val('r-date'), start: val('r-start'), end: val('r-end') } }).length && !confirm('Another event is in the Lab then. Approve anyway?')) return;
    saving(ev.target, async () => {
      const base = slug(val('r-title')) || 'event', uniq = (kind, b) => { let n = b + '.json', i = 2; while (S.lib[kind][n]) n = `${b}-${i++}.json`; return n; };
      const add = {}, n = { title: val('r-title'), status: val('r-status'), campus: 'gvl', date: val('r-date'), start: val('r-start'), end: val('r-end'), location: ROOM,
        summary: val('r-sum'), details: val('r-det') || e.details || '', languages: e.languages || [], hosts: [d.organizer.organization], partners: e.partners || [],
        title_alt: e.title_alt || '', title_alt_lang: e.title_alt_lang || '', theme: val('r-theme') || undefined, music_pick: [],
        signup: { on: false }, credit: { on: false }, assignment: { on: false }, competition: { on: false } };
      if (r.flyer) { // copy the flyer over from the private repo
        const b64 = r.flyerB64 || (await gh(`/git/blobs/${r.flyer.sha}`, {}, REQ_REPO)).content.replace(/\n/g, '');
        let img = `current/flyers/new-${base}.${r.flyer.path.split('.').pop().toLowerCase()}`, i = 2; while (S.tree[img]) img = img.replace(/(-\d+)?(\.[a-z0-9]+)$/, `-${i++}$2`);
        const fn = uniq('flyers', base); add[img] = { b64 }; const fl = { title: `${n.title} flyer`, image: img.replace('current/', ''), alt: d.flyer.alt };
        add[`current/library/flyers/${fn}`] = { text: dump(fl) }; S.lib.flyers[fn] = fl; n.flyer_pick = fn;
      }
      if (val('r-music')) n.music_pick = [val('r-music')];
      else if (m.kind === 'commons' && $('r-addtrack')?.checked) { // download their checked track from Commons into our music folder
        const res = await fetch(m.mp3); if (!res.ok) throw new Error('Their track could not be downloaded from Commons. Pick one of ours instead.');
        const buf = await res.arrayBuffer(); if (buf.byteLength > 15 * 1048576) throw new Error('Their track is over 15 MB. Pick one of ours instead.');
        const fn = uniq('music', slug(m.title) || 'track'), mp3 = `current/music/${fn.replace(/\.json$/, '')}.mp3`;
        const tr = { title: m.title, artist: m.artist, file: mp3.replace('current/', ''), license: m.license, source: m.source };
        add[mp3] = { b64: bufB64(buf) }; add[`current/library/music/${fn}`] = { text: dump(tr) }; S.lib.music[fn] = tr; n.music_pick = [fn];
      }
      if (d.signup?.needed && d.signup.url) {
        const fn = uniq('forms', `${base}-sign-up`), fo = { title: `${n.title} sign-up`, url: d.signup.url, label: 'Sign up' };
        add[`current/library/forms/${fn}`] = { text: dump(fo) }; S.lib.forms[fn] = fo;
        n.signup = { on: true, form: fn, deadline: d.signup.deadline || '', deadline_time: d.signup.deadline_time || '' };
      }
      if (!n.theme) delete n.theme;
      const doc = structuredClone(S.events); doc.events.push(n);
      const files = { ...eventFiles(doc), ...add };
      await commit(files, `Approve request: ${n.title} (${d.organizer.organization})`);
      S.events = doc;
      const t = await gh(`/git/trees/${S.head}?recursive=1`); S.tree = Object.fromEntries(t.tree.filter(x => x.type === 'blob').map(x => [x.path, x.sha]));
      const doc2 = structuredClone(S.events), f2 = eventFiles(doc2); if (Object.keys(f2).length > 1) await commit(f2, 'Tidy: flyer named after its event code');
      const key = S.events.events.find(x => x.id === n.id)?.key || '';
      await decide('approved', { event_id: n.id, event_key: key });
      setTimeout(() => { location.href = mail(`Approved: ${n.title} in the Language Lab`, `Hello ${d.organizer.name},\n\nGood news: "${n.title}" is approved for ${new Date(n.date + 'T12:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}, ${fmtTime(n.start)}–${fmtTime(n.end)}, in ${ROOM}.${val('r-note') ? '\n\n' + val('r-note') : ''}\n\nIt will show on the Lab's events page: ${SITE}\n\nUNG Language Lab`); }, 400);
    });
  };
}

/* ---------- clicks ---------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-ev],[data-new-ev],[data-item],[data-new-item],[data-req]'); if (!t) return;
  if (t.dataset.req) reviewRequest(t.dataset.req);
  else if (t.dataset.ev) editEvent(t.dataset.ev);
  else if ('newEv' in t.dataset) editEvent(null);
  else if (t.dataset.item) { const [k, n] = t.dataset.item.split('|'); editItem(k, n); }
  else if (t.dataset.newItem) editItem(t.dataset.newItem, null);
});
const h = location.hash.slice(1); if (VIEWS.some(v => v[0] === h)) S.view = h;
load();
</script>
</body>
</html>
