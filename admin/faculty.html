<!DOCTYPE html>
<html lang="en" data-area="faculty">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Language Lab · For faculty</title>
<!-- For faculty (2026-11-23, Daniel): a read-only quick reference for professors: each course's labs, due dates, how
     labs are graded, the Lab policy, and proposals in progress. Faculty sign in with the faculty passcode (signin.js);
     they never see the coordinators' areas and can't change anything. Everything here is already public on the
     site (labs/registry.json, instructions/manifest.json, labs/shared/*.json, labs/courses/<code>/course.json); the
     shared Semester plan is not read. No data is stored in this page (CLAUDE.md rule 11). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
/* Same tokens as console.html (design-system skill, student theme). Dark mode re-maps them. */
:root {
  --navy: #1A3A6B; --navy-dark: #132C52; --gold: #B08D3F; --offwhite: #F7F7F5; --white: #FFFFFF; --ink: #1F2937; --muted: #5A6472;
  --bg: var(--offwhite); --surface: var(--white); --text: var(--ink); --sub: var(--muted); --line: #DCDDD8;
  --accent: var(--navy); --accent-ink: var(--white); --rail: var(--white); --chip: #EEF0F3;
  --ok: #1E6B45; --ok-bg: #E3F1E8; --warn: #8A4B08; --warn-bg: #FBEEDB; --bad: #A12A2A; --bad-bg: #F9E3E3; --shadow: 0 1px 2px rgba(20,30,50,.06), 0 8px 24px rgba(20,30,50,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-mode="light"]) {
  --bg: #0E1F3A; --surface: var(--navy-dark); --text: var(--offwhite); --sub: #C9CFD8; --line: #2B4670;
  --accent: var(--offwhite); --accent-ink: var(--navy-dark); --rail: #102443; --chip: #1C3864;
  --ok: #8FD9AE; --ok-bg: #173F33; --warn: #F2C47E; --warn-bg: #4A3415; --bad: #F4A3A3; --bad-bg: #4A1E26; --shadow: none; color-scheme: dark; } }
:root[data-mode="dark"] {
  --bg: #0E1F3A; --surface: var(--navy-dark); --text: var(--offwhite); --sub: #C9CFD8; --line: #2B4670;
  --accent: var(--offwhite); --accent-ink: var(--navy-dark); --rail: #102443; --chip: #1C3864;
  --ok: #8FD9AE; --ok-bg: #173F33; --warn: #F2C47E; --warn-bg: #4A3415; --bad: #F4A3A3; --bad-bg: #4A1E26; --shadow: none; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 400 16px/1.5 "DM Sans", sans-serif; }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
h1[tabindex="-1"]:focus { outline: none; }
.skip { position: absolute; left: 12px; top: -48px; background: var(--surface); padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; z-index: 20; }
.skip:focus { top: 12px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.shell { display: grid; grid-template-columns: 264px 1fr; min-height: 100vh; }
.rail { background: var(--rail); border-right: 1px solid var(--line); padding: 22px 14px; display: flex; flex-direction: column; gap: 20px; position: sticky; top: 0; height: 100vh; overflow: auto; }
.brand { padding: 0 8px; }
.brand small { display: block; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--sub); }
.brand b { font: 700 23px/1.2 "Source Serif 4", serif; }
.areas { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 4px; margin: 0 2px; border-radius: 12px; background: var(--chip); }
.areas a { text-align: center; padding: 7px 5px; border-radius: 9px; font-weight: 600; font-size: 13px; text-decoration: none; color: var(--text); }
.areas a:hover { background: var(--surface); }
.areas a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.areas a:last-child:nth-child(odd) { grid-column: 1 / -1; }
#nav h2 { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--sub); margin: 0 8px 6px; }
#nav ul { list-style: none; margin: 0 0 14px; padding: 0; }
#nav button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px; border: 0; background: none; border-radius: 8px; font-weight: 500; cursor: pointer; text-align: left; }
#nav button:hover { background: var(--chip); }
#nav button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
#nav .st { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--sub); }
#nav button[aria-current="page"] .st { color: inherit; }
.rail-foot { margin-top: auto; display: grid; gap: 8px; padding: 0 8px; }
.conn { font-size: 14px; color: var(--sub); display: flex; gap: 8px; align-items: center; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); flex: none; }
.dot.on { background: var(--ok); }

main { padding: 28px 36px 64px; min-width: 0; }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--sub); margin: 0 0 4px; }
h1 { font: 700 30px/1.2 "Source Serif 4", serif; margin: 0 0 6px; }
h2 { font: 700 21px/1.3 "Source Serif 4", serif; margin: 26px 0 10px; }
h3, h2.h3 { font: 700 17px/1.35 "DM Sans", sans-serif; margin: 0 0 6px; }
.lede { color: var(--sub); max-width: 72ch; margin: 0 0 18px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; text-decoration: none; min-height: 40px; }
.btn:hover { border-color: var(--sub); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.sm { padding: 5px 10px; font-size: 14px; min-height: 34px; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; box-shadow: var(--shadow); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; padding: 0; list-style: none; }
.chips li { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--chip); }
.chips .ok { background: var(--ok-bg); color: var(--ok); } .chips .warn { background: var(--warn-bg); color: var(--warn); }
.sw { display: inline-flex; gap: 3px; vertical-align: middle; } .sw i { width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(0,0,0,.15); display: inline-block; }
.note { border-left: 4px solid var(--gold); background: var(--chip); border-radius: 8px; padding: 10px 14px; margin: 0 0 14px; max-width: 80ch; }
.alert { border-left: 4px solid var(--warn); background: var(--warn-bg); color: var(--text); border-radius: 8px; padding: 10px 14px; margin: 0 0 10px; }
.course { display: grid; gap: 4px; text-align: left; cursor: pointer; font: inherit; color: inherit; width: 100%; }
.course:hover { border-color: var(--sub); }
.course b { font-size: 18px; }
.course span { color: var(--sub); font-size: 14px; }
.steps { counter-reset: s; list-style: none; padding: 0; margin: 0 0 8px; display: grid; gap: 8px; max-width: 80ch; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
.steps li::before { content: counter(s); display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 14px; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 14px 0 18px; flex-wrap: wrap; }
.tabs button { border: 0; background: none; padding: 10px 14px; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; color: var(--sub); }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--gold); }
.ctl { display: flex; flex-wrap: wrap; gap: 14px; align-items: end; margin: 0 0 14px; }
.ctl label { display: grid; gap: 4px; font-size: 14px; font-weight: 600; }
.ctl select { min-height: 40px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 200px; }
.d2l { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 16px; align-items: start; }
.toc { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.toc header { background: #2c3e50; color: #fff; padding: 10px 14px; font-weight: 700; font-size: 14px; }
.toc header small { display: block; font-weight: 400; opacity: .85; }
.toc ul { list-style: none; margin: 0; padding: 6px; }
.toc li { margin: 0; }
.toc button { width: 100%; text-align: left; display: grid; grid-template-columns: 26px 1fr; gap: 8px; padding: 8px; border: 0; background: none; border-radius: 8px; cursor: pointer; }
.toc button:hover { background: var(--chip); }
.toc button[aria-current="true"] { background: var(--chip); box-shadow: inset 3px 0 0 var(--gold); }
.toc .ic { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff; }
.toc .t { font-weight: 600; } .toc .s { display: block; font-size: 13px; color: var(--sub); }
.toc .grp { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--sub); padding: 10px 8px 4px; }
.pv { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.pv .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.pv .bar .where { font-size: 14px; color: var(--sub); margin-right: auto; min-width: 0; overflow-wrap: anywhere; }
.pv iframe { width: 100%; height: 900px; border: 0; display: block; background: #fff; }
.theme { display: grid; gap: 10px; }
.theme .band { height: 62px; border-radius: 10px; display: flex; align-items: center; gap: 12px; padding: 0 14px; color: #fff; font: 700 18px "Source Serif 4", serif; }
.theme .band em { font-style: normal; }
.theme .flag { display: grid; gap: 3px; } .theme .flag i { display: block; width: 26px; height: 4px; border-radius: 2px; }
.theme[aria-current="true"] { outline: 3px solid var(--gold); outline-offset: 2px; }
table.t { border-collapse: collapse; width: 100%; font-size: 15px; }
table.t th, table.t td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t th { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--sub); }
.tw { overflow-x: auto; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 30; max-width: 90vw; }
.loading, .empty { color: var(--sub); }
.form { display: grid; gap: 14px; max-width: 900px; }
.fld { display: grid; gap: 4px; }
.fld > label, .grp > legend { font-weight: 600; }
.fld input[type=text], .fld input[type=number], .fld textarea, .fld select, .items input, .items textarea { width: 100%; min-height: 40px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font: inherit; }
.fld textarea, .items textarea { resize: vertical; line-height: 1.45; }
.fld [readonly], .fld [disabled] { background: var(--chip); color: var(--sub); }
.fld.chk { grid-template-columns: auto 1fr; align-items: center; column-gap: 8px; } .fld.chk .hint { grid-column: 2; }
.hint { margin: 0; font-size: 14px; color: var(--sub); }
.err { margin: 0; font-size: 14px; font-weight: 600; color: var(--bad); }
.grp { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 0; display: grid; gap: 12px; min-width: 0; }
.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.items > li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.items.objs > li { display: block; }
.items details { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.items summary { cursor: pointer; padding: 10px 12px; font-weight: 600; }
.objbody { padding: 4px 12px 12px; display: grid; gap: 12px; }
.tools { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.savebar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--bg); padding: 10px 0; margin: 0 0 6px; border-bottom: 1px solid var(--line); }
.savebar #edState, .savebar #peState { margin-right: auto; font-weight: 600; }
pre.code { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--chip); padding: 10px 12px; border-radius: 8px; font-size: 14px; margin: 0; }
@media (max-width: 1100px) { .d2l { grid-template-columns: 1fr; } .pv iframe { height: 720px; } }
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; padding: 14px 16px; gap: 12px; }
  #nav { display: flex; gap: 6px; overflow-x: auto; } #nav h2 { display: none; } #nav ul { display: contents; }
  #nav button { white-space: nowrap; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; width: auto; }
  .rail-foot { grid-template-columns: 1fr 1fr; } .rail-foot .conn { grid-column: 1 / -1; }
  main { padding: 20px 16px 48px; }
  h1 { font-size: 25px; }
}
</style>
<style>
.areas[hidden] { display: none; }
.cols > * { min-width: 0; }
.labs-t td:first-child { white-space: nowrap; font-weight: 700; }
.due { white-space: nowrap; }
.muted { color: var(--sub); }
.rub td, .rub th { font-size: 14px; }
.rub td.pts { white-space: nowrap; font-weight: 700; }
.pol { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.pol li { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.pol b { display: block; }
.cols { display: grid; gap: 16px; }
</style>
<script src="signin.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="shell">
  <header class="rail">
    <div class="brand"><small>Language Lab</small><b>For faculty</b></div>
    <nav class="areas" aria-label="Console areas" data-coord-only hidden><a href="console.html">Events</a><a href="semester.html">Semester plan</a><a href="student-view.html">Student view</a><a href="tutorials/index.html">Tutorials</a><a href="faculty.html" aria-current="page">Faculty view</a></nav>
    <nav aria-label="Courses" id="nav"></nav>
    <div class="rail-foot">
      <button class="btn sm" type="button" id="modeBtn">Dark mode</button>
    </div>
  </header>
  <main id="main" tabindex="-1"><p class="loading">Loading the courses…</p></main>
</div>
<script>
'use strict';
const OWNER = 'junnynoh-tech', REPO = 'language-lab-events', BRANCH = 'main';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const md = s => esc(s).replace(/\*([^*]+)\*/g, '<i>$1</i>');   // *word* = target-language italics, as on the student pages
const S = { view: 'overview', v: {} };
function setMode(m) { document.documentElement.dataset.mode = m; $('modeBtn').textContent = m === 'dark' ? 'Light mode' : 'Dark mode'; try { localStorage.setItem('labConsoleMode', m); } catch (e) {} }
(() => { let m = null; try { m = localStorage.getItem('labConsoleMode'); } catch (e) {} setMode(m || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')); })();
$('modeBtn').onclick = () => setMode(document.documentElement.dataset.mode === 'dark' ? 'light' : 'dark');
async function getJSON(path) {
  for (const u of [`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${path}`, '../' + path]) { try { const r = await fetch(u, { cache: 'no-store' }); if (r.ok) return await r.json(); } catch (e) {} }
  return null;
}
const fmtDate = d => new Date(d + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
const STATUS = { approved: ['Live', 'ok'], proposal: ['Proposal in progress', 'warn'], planned: ['Planned', ''] };

async function load() {
  const [reg, man, dd, pol] = await Promise.all(['labs/registry.json', 'instructions/manifest.json', 'labs/shared/lab-due-dates.json', 'labs/shared/policy.json'].map(getJSON));
  if (!reg) { $('main').innerHTML = '<p class="alert" role="alert">The course list couldn’t be read. Reload in a minute.</p>'; return; }
  Object.assign(S, { reg, man: man || { courses: {} }, dd: dd || { classes: [] }, pol: pol || {} , course: {} });
  nav(); show(location.hash.slice(1) || 'overview', false);
}
function nav() {
  const L = S.reg.languages.map(l => `<h2>${esc(l.name)}</h2><ul>${l.courses.filter(c => S.reg.courses[c]).map(c => { const r = S.reg.courses[c];
    return `<li><button type="button" data-go="${c}"><span>${esc(r.course)}</span><span class="st">${r.status === 'approved' ? 'Live' : r.status === 'proposal' ? 'Proposal' : 'Planned'}</span></button></li>`; }).join('')}</ul>`).join('');
  $('nav').innerHTML = `<ul><li><button type="button" data-go="overview">Start here</button></li><li><button type="button" data-go="proposals">Proposals</button></li></ul>${L}`;
  $('nav').querySelectorAll('[data-go]').forEach(b => b.onclick = () => show(b.dataset.go));
}
async function show(v, focus = true) {
  if (!['overview', 'proposals'].includes(v) && !S.reg.courses[v]) v = 'overview';
  S.view = v; history.replaceState(null, '', '#' + v);
  $('nav').querySelectorAll('[data-go]').forEach(b => b.dataset.go === v ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  if (S.reg.courses[v] && S.reg.courses[v].status === 'approved' && !S.course[v]) { $('main').innerHTML = '<p class="loading">Loading…</p>'; S.course[v] = await getJSON(`labs/courses/${v}/course.json`) || {}; }
  $('main').innerHTML = v === 'overview' ? overview() : v === 'proposals' ? proposals() : course(v);
  $('main').querySelectorAll('[data-go]').forEach(b => b.onclick = () => show(b.dataset.go));
  const sv = $('selV'); if (sv) sv.onchange = () => { S.v[v] = sv.value; show(v, false); $('selV').focus(); };
  if (focus) { const h = $('main').querySelector('h1'); if (h) { h.tabIndex = -1; h.focus(); } }
}
const head = (eyebrow, title, lede) => `<p class="eyebrow">${esc(eyebrow)}</p><h1>${esc(title)}</h1>${lede ? `<p class="lede">${lede}</p>` : ''}`;

function overview() {
  const cards = S.reg.languages.map(l => `<h2>${esc(l.name)}</h2><div class="grid">${l.courses.filter(c => S.reg.courses[c]).map(c => { const r = S.reg.courses[c];
    return `<button type="button" class="card course" data-go="${c}"><b>${esc(r.course)} · ${esc(r.name)}</b><ul class="chips"><li class="${(STATUS[r.status] || ['', ''])[1]}">${esc((STATUS[r.status] || [r.status])[0])}</li></ul>`
      + `<span>${r.due_day ? `Labs due ${esc(r.due_day)}s, ${esc(r.due_time)}` : ''}</span></button>`; }).join('')}</div>`).join('');
  return head('Language Lab', 'Labs in your courses', 'A quick reference for professors: what each lab asks of students, when labs are due, how they are graded, and the Lab policy. Pick your course. Nothing here can be changed; for a change, contact the Language Lab coordinator.')
    + `<div class="note">${S.dd.semester_label ? `Due dates: <b>${esc(S.dd.semester_label)}</b>.` : ''} ${S.dd.classes?.length ? '' : 'This semester’s exact dates aren’t posted yet; each course shows its due day and time, and students see the dates in D2L.'}</div>` + cards;
}
function proposals() {
  const rows = Object.entries(S.reg.courses).filter(([, r]) => r.status === 'proposal');
  return head('Language Lab', 'Proposals', 'Lab plans waiting for faculty review. Each one shows every page students would see. Send comments to the Language Lab coordinator.')
    + (rows.length ? `<div class="grid">${rows.map(([c, r]) => `<div class="card"><h2 class="h3">${esc(r.course)} · ${esc(r.name)}</h2><ul class="chips"><li class="warn">Proposal in progress</li></ul>${r.note ? `<p>${esc(r.note)}</p>` : ''}`
      + (r.proposal ? `<a class="btn pri" href="../${esc(r.proposal)}" target="_blank" rel="noopener">Open the proposal (new tab)</a>` : '<p class="muted">The proposal link isn’t ready yet.</p>') + '</div>').join('')}</div>` : '<p class="empty">No proposals in progress.</p>')
    + `<p class="lede" style="margin-top:18px">Approved courses are under their own names on the left.</p>`;
}
function course(code) {
  const r = S.reg.courses[code], st = STATUS[r.status] || [r.status, ''];
  const top = head(S.reg.languages.find(l => l.courses.includes(code))?.name || 'Course', `${r.course} · ${r.name}`, '')
    + `<ul class="chips"><li class="${st[1]}">${esc(st[0])}</li>${r.due_day ? `<li>Labs due ${esc(r.due_day)}s, ${esc(r.due_time)}</li>` : ''}</ul>`;
  if (r.status !== 'approved') return top + `<div class="card"><h2 class="h3">${r.status === 'proposal' ? 'Still a proposal' : 'Not planned yet'}</h2><p>${r.status === 'proposal' ? 'The labs for this course are being reviewed by its faculty. The proposal shows every page students would see.' : 'This course has no Language Lab labs yet.'}</p>`
    + (r.proposal ? `<a class="btn pri" href="../${esc(r.proposal)}" target="_blank" rel="noopener">Open the proposal (new tab)</a>` : '') + '</div>';
  const m = S.man.courses[code], C = S.course[code] || {}; if (!m) return top + '<p class="empty">This course’s pages are being built. Check back in a few minutes.</p>';
  const vk = S.v[code] && m.variants.some(v => v.key === S.v[code]) ? S.v[code] : m.variants[0].key, v = m.variants.find(x => x.key === vk);
  const cv = (C.variants || []).find(x => x.key === vk) || {}, cls = (S.dd.classes || []).find(c => c.key === cv.due_key);
  const dateOf = n => { const l = cls?.labs?.find(x => String(x.label).replace(/\D/g, '') === String(n)); return l ? fmtDate(l.date) : ''; };
  const pol = { ...S.pol, ...(C.policy_overrides || {}) }, rub = pol.rubric, l0 = pol.lab0 || {};
  const camp = m.campuses[0]?.code, slug = m.slug, folder = m.files.find(f => f === `${camp}/${code}-lab-folder-${vk}.html` || f === `${camp}/d2l/${code}-lab-folder-${vk}.html`);
  const labs = `<div class="tw" tabindex="0" role="region" aria-label="Labs table, scrolls sideways"><table class="t labs-t"><caption class="sr">${esc(r.course)} labs for ${esc(v.label)} sections</caption><thead><tr><th scope="col">Lab</th><th scope="col">Topic</th><th scope="col">Students record</th><th scope="col">Due</th></tr></thead><tbody>`
    + `<tr><td>Lab 0</td><td>${md(l0.title || 'Setup check')}</td><td>${esc(l0.mode || '')}${l0.length ? ` · ${esc(l0.length)}` : ''}</td><td class="due">First week</td></tr>`
    + v.labs.map(L => { const f = m.files.find(x => x === `${camp}/${code}-lab-${L.n}-${slug}-${vk}.html`);
      return `<tr><td>Lab ${L.n}</td><td>${f ? `<a href="../instructions/${code}/${esc(f)}" target="_blank" rel="noopener">${md(L.title)}</a>` : md(L.title)}</td><td>${esc(L.mode)}</td><td class="due">${dateOf(L.n) || `<span class="muted">${esc(r.due_day || '')}s, ${esc(r.due_time || '')} (date in D2L)</span>`}</td></tr>`; }).join('')
    + `</tbody></table></div>`;
  const rubric = rub?.rows ? `<div class="tw" tabindex="0" role="region" aria-label="Rubric table, scrolls sideways"><table class="t rub"><caption class="sr">${esc(rub.name || 'Rubric')}</caption><thead><tr><th scope="col">Criterion</th>${(rub.levels || []).map(x => `<th scope="col">${esc(x)}</th>`).join('')}</tr></thead><tbody>`
    + rub.rows.map(row => `<tr><th scope="row">${esc(row.name)}</th>${(row.points || []).map(p => `<td class="pts">${esc(p)}</td>`).join('')}</tr>`).join('') + `</tbody></table></div><p class="hint">${esc(rub.name || 'Rubric')}: ${esc(rub.total ?? '')} points per lab. Students see each level described in their lab pages.</p>` : '';
  const P = [['Missing face or audio', pol.incomplete_rule], ['Excused absences', pol.excused], ['Accommodations', pol.accommodations], ['Bongo or D2L down', pol.system_wide], ['Technology', pol.responsibility]].filter(x => x[1]);
  return top + `<div class="ctl"><label>Section type<select id="selV">${m.variants.map(x => `<option value="${esc(x.key)}"${x.key === vk ? ' selected' : ''}>${esc(x.label)}</option>`).join('')}</select></label>`
    + `<p class="lede" style="margin:0">${esc(v.sub || v.label)}.${cls?.labs?.length ? ` Dates for ${esc(S.dd.semester_label)}.` : ' Exact dates aren’t posted for this semester yet.'}</p></div>`
    + `<div class="cols"><section class="card" aria-labelledby="h-labs"><h2 id="h-labs" class="h3">Labs at a glance</h2>${labs}`
    + (folder ? `<p style="margin:12px 0 0"><a class="btn sm" href="../instructions/${code}/${esc(folder)}" target="_blank" rel="noopener">See the LAB folder as students do (new tab)</a></p>` : '') + `</section>`
    + `<section class="card" aria-labelledby="h-grade"><h2 id="h-grade" class="h3">How labs are graded</h2>${rubric || '<p class="muted">The rubric is in each Bongo assignment.</p>'}</section></div>`
    + `<h2>Lab policy</h2><ul class="pol">${P.map(([t, x]) => `<li><b>${esc(t)}</b>${md(x)}</li>`).join('')}</ul>`
    + `<p class="note" style="margin-top:16px">Questions or a change for your course? Contact the Language Lab coordinator.</p>`;
}
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== S.view && S.reg) show(h); });
load();
</script>
</body>
</html>
