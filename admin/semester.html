<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lab Console · Semester plan</title>
<!-- Coordinators' semester planning console (2026-11-13). Built by labs/semester-console/build.py from page.html,
     semester.css, semester.js and the events console's stylesheet (one look for both consoles).
     Holds no data (CLAUDE.md rule 11): the plan lives in this browser (IndexedDB) and in a plan file the coordinators
     open and save in a shared OneDrive/Teams folder. Outputs are files for D2L, uploaded by hand. Never GitHub. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
/* Canonical tokens (design-system skill, student theme), same as admin/index.html. Dark mode re-maps them. */
:root {
  --navy: #1A3A6B; --navy-dark: #132C52; --gold: #B08D3F; --offwhite: #F7F7F5; --white: #FFFFFF; --ink: #1F2937; --muted: #5A6472;
  --bg: var(--offwhite); --surface: var(--white); --text: var(--ink); --sub: var(--muted); --line: #DCDDD8;
  --accent: var(--navy); --accent-ink: var(--white); --rail: var(--white); --chip: #EEF0F3;
  --ok: #1E6B45; --ok-bg: #E3F1E8; --warn: #8A4B08; --warn-bg: #FBEEDB; --bad: #A12A2A; --bad-bg: #F9E3E3; --shadow: 0 1px 2px rgba(20,30,50,.06), 0 8px 24px rgba(20,30,50,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-mode="light"]) {
  --bg: #0E1F3A; --surface: var(--navy-dark); --text: var(--offwhite); --sub: #C9CFD8; --line: #2B4670;
  --accent: var(--offwhite); --accent-ink: var(--navy-dark); --rail: #102443; --chip: #1C3864;
  --ok: #8FD9AE; --ok-bg: #173F33; --warn: #F2C47E; --warn-bg: #4A3415; --bad: #F4A3A3; --bad-bg: #4A1E26; --shadow: none; color-scheme: dark; } }
:root[data-mode="dark"] {
  --bg: #0E1F3A; --surface: var(--navy-dark); --text: var(--offwhite); --sub: #C9CFD8; --line: #2B4670;
  --accent: var(--offwhite); --accent-ink: var(--navy-dark); --rail: #102443; --chip: #1C3864;
  --ok: #8FD9AE; --ok-bg: #173F33; --warn: #F2C47E; --warn-bg: #4A3415; --bad: #F4A3A3; --bad-bg: #4A1E26; --shadow: none; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 400 16px/1.5 "DM Sans", sans-serif; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
h1[tabindex="-1"]:focus { outline: none; }
.skip { position: absolute; left: 12px; top: -48px; background: var(--surface); padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; z-index: 20; }
.skip:focus { top: 12px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.shell { display: grid; grid-template-columns: 264px 1fr; min-height: 100vh; }
.rail { background: var(--rail); border-right: 1px solid var(--line); padding: 22px 14px; display: flex; flex-direction: column; gap: 20px; position: sticky; top: 0; height: 100vh; overflow: auto; }
.brand { padding: 0 8px; }
.brand small { display: block; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--sub); }
.brand b { font: 700 23px/1.2 "Source Serif 4", serif; }
nav h2 { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--sub); margin: 0 8px 6px; }
nav ul { list-style: none; margin: 0 0 14px; padding: 0; }
nav button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px; border: 0; background: none; border-radius: 8px; font-weight: 500; cursor: pointer; text-align: left; }
nav button:hover { background: var(--chip); }
nav button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
nav .n { margin-left: auto; font-size: 13px; color: var(--sub); }
nav button[aria-current="page"] .n { color: inherit; opacity: .8; }
.rail-foot { margin-top: auto; display: grid; gap: 8px; padding: 0 8px; }
.conn { font-size: 14px; color: var(--sub); display: flex; gap: 8px; align-items: center; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); flex: none; }
.dot.on { background: var(--ok); }

main { padding: 28px clamp(16px, 3.5vw, 48px) 64px; min-width: 0; }
.head { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; margin-bottom: 20px; }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--sub); margin: 0 0 4px; }
h1 { font: 700 clamp(26px, 3vw, 34px)/1.15 "Source Serif 4", serif; margin: 0; }
.lede { color: var(--sub); margin: 6px 0 0; max-width: 64ch; }
h2.sec { font: 700 20px/1.3 "Source Serif 4", serif; margin: 28px 0 12px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 9px 16px; border-radius: 10px; font-weight: 600; text-decoration: none; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.btn:hover { background: var(--chip); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.12); background: var(--accent); }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.sm { min-height: 34px; padding: 5px 12px; font-size: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
.stat b { display: block; font: 700 32px/1 "Source Serif 4", serif; margin-bottom: 6px; }
.stat span { color: var(--sub); font-size: 15px; }

.issues { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.issues li { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--chip); color: var(--text); white-space: nowrap; }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.bad { background: var(--bad-bg); color: var(--bad); }
/* music finder (free tracks on Wikimedia Commons, same checks as the request form) */
.finder { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 0 0 14px; background: var(--bg); }
.finder > b { display: block; margin-bottom: 6px; }
.tracks { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; max-height: 260px; overflow: auto; }
.tracks li { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.tracks small { display: block; color: var(--sub); }
.mnote { margin: 8px 0 0; padding: 8px 10px; border-radius: 8px; background: var(--chip); }
.mnote.ok { background: var(--ok-bg); color: var(--ok); } .mnote.bad { background: var(--bad-bg); color: var(--bad); }
.mnote:empty { display: none; }
.banner { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 14px 16px; border-radius: 12px; margin: 0 0 18px; border: 1px solid var(--line); }
.banner span { flex: 1 1 260px; }
.banner.new { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.banner.warn { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.banner .btn { color: var(--text); }
.banner .btn.primary { color: var(--accent-ink); }
.empty { color: var(--sub); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 18px; }

/* events */
.evlist { display: grid; gap: 12px; }
.ev { display: grid; grid-template-columns: 76px 92px 1fr auto; gap: 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px 12px 12px; box-shadow: var(--shadow); text-align: left; width: 100%; cursor: pointer; }
.ev:hover { border-color: var(--sub); }
.ev.past { opacity: .62; }
.date { text-align: center; border-radius: 10px; background: var(--chip); padding: 8px 4px; }
.date small { display: block; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--sub); }
.date b { display: block; font: 700 28px/1 "Source Serif 4", serif; }
.thumb { width: 92px; height: 92px; border-radius: 8px; background: var(--chip) center/cover no-repeat; display: grid; place-items: center; color: var(--sub); font-size: 12px; text-align: center; overflow: hidden; }
.ev h3 { font: 600 18px/1.3 "Source Serif 4", serif; margin: 0 0 4px; }
.ev .meta { color: var(--sub); font-size: 14px; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.code { font: 600 13px ui-monospace, Menlo, Consolas, monospace; background: var(--chip); padding: 2px 7px; border-radius: 6px; }

/* library */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.item .pic { aspect-ratio: 4 / 5; background: var(--chip) center/contain no-repeat; border-bottom: 1px solid var(--line); }
.item .body { padding: 14px 16px; display: grid; gap: 6px; flex: 1; align-content: start; }
.item h3 { font: 600 17px/1.3 "Source Serif 4", serif; margin: 0; }
.item p { margin: 0; color: var(--sub); font-size: 14px; overflow-wrap: anywhere;  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.item .foot { padding: 10px 16px 14px; display: flex; gap: 8px; flex-wrap: wrap; }

/* editor panel */
dialog { border: 0; padding: 0; margin: 0 0 0 auto; height: 100vh; max-height: 100vh; width: min(640px, 100vw); background: var(--bg); color: var(--text); box-shadow: -12px 0 40px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(10,20,40,.45); }
.pane { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }
.pane header { padding: 18px 22px; border-bottom: 1px solid var(--line); background: var(--surface); display: flex; gap: 12px; align-items: start; justify-content: space-between; }
.pane header h2 { font: 700 22px/1.25 "Source Serif 4", serif; margin: 0; }
.pane .scroll { overflow: auto; padding: 18px 22px 28px; }
.pane footer { padding: 14px 22px; border-top: 1px solid var(--line); background: var(--surface); display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
.x { border: 0; background: none; font-size: 22px; line-height: 1; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
.x:hover { background: var(--chip); }
fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 16px; margin: 0 0 14px; background: var(--surface); }
legend { font-weight: 700; padding: 0 6px; }
.f { display: grid; gap: 4px; margin-bottom: 12px; }
.f:last-child { margin-bottom: 0; }
.f label { font-weight: 600; font-size: 15px; }
.f .hint { color: var(--sub); font-size: 13px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.three { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 12px; }
input[type=text], input[type=url], input[type=date], input[type=password], select, textarea { width: 100%; min-height: 42px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); }
textarea { min-height: 84px; resize: vertical; }
input[readonly] { background: var(--chip); }
.switch { display: flex; align-items: center; gap: 12px; font-weight: 600; cursor: pointer; margin-bottom: 12px; }
.switch input { appearance: none; width: 46px; height: 26px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; flex: none; margin: 0; transition: background .15s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--white); transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.switch input:checked { background: var(--ok); }
.switch input:checked::after { transform: translateX(20px); }
.off .dep select, .off .dep input { border-style: dashed; }
.preview { display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: center; margin-bottom: 14px; }
.preview .thumb { width: 120px; height: 150px; background-size: contain; }
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 16px; text-align: center; color: var(--sub); }
.drop.over { border-color: var(--gold); background: var(--chip); }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 10px; font-weight: 600; z-index: 30; max-width: calc(100vw - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.toast[hidden] { display: none; }
.loading { color: var(--sub); padding: 40px 0; }
.howto { counter-reset: s; list-style: none; padding: 0; display: grid; gap: 10px; max-width: 70ch; }
.howto li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.howto li::before { content: counter(s); display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--gold); font-weight: 600; font-size: 14px; }
code { font: 500 14px ui-monospace, Menlo, Consolas, monospace; background: var(--chip); border-radius: 4px; padding: 1px 6px; }

/* one Lab console, two areas (Events | Semester plan): same rail on both pages */
.areas { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; margin: 0 8px; border-radius: 12px; background: var(--chip); }
.areas a { text-align: center; padding: 8px 6px; border-radius: 9px; font-weight: 600; font-size: 15px; text-decoration: none; color: var(--text); }
.areas a:hover { background: var(--surface); }
.areas a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
@media (max-width: 860px) { .areas { grid-column: 1 / -1; margin: 0; } }

@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .rail { position: sticky; top: 0; z-index: 5; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 10px 16px 8px; gap: 8px; display: grid; grid-template-columns: 1fr auto; align-items: center; }
  .brand b { font-size: 19px; }
  .rail-foot { margin: 0; grid-column: 2; grid-row: 1; }
  .rail-foot .conn, .rail-foot #modeBtn { display: none; }
  nav { grid-column: 1 / -1; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 4px; }
  nav h2 { display: none; } nav ul { display: contents; }
  nav button { white-space: nowrap; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 15px; width: auto; }
  .ev { grid-template-columns: 64px 1fr; } .ev .thumb { display: none; } .ev > :last-child { grid-column: 1 / -1; }
  .two, .three { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) { .view { animation: in .18s ease-out; } @keyframes in { from { opacity: 0; transform: translateY(4px); } } }

/* ---------- semester console: additions to the events console stylesheet ---------- */
.semsel { padding: 0 8px; display: grid; gap: 4px; }
.semsel label { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--sub); }
.semsel select { font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); margin-bottom: 16px; }
.card > h2 { font: 700 19px/1.3 "Source Serif 4", serif; margin: 0 0 4px; }
.card > .lede { margin: 0 0 12px; }
.step { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--gold); font: 600 14px "DM Sans", sans-serif; margin-right: 8px; vertical-align: 2px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin: 0 0 12px; }
.toolbar .f { margin: 0; min-width: 150px; }
.toolbar .grow { flex: 1 1 220px; }
.muted { color: var(--sub); }
.small { font-size: 14px; }
.nowrap { white-space: nowrap; }

/* tables */
.tw { overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table.t { border-collapse: collapse; width: 100%; font-size: 15px; }
table.t caption { text-align: left; padding: 10px 14px; font-weight: 600; color: var(--sub); caption-side: top; }
table.t th, table.t td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.t thead th { position: sticky; top: 0; background: var(--chip); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--sub); z-index: 1; }
table.t tbody tr:last-child td { border-bottom: 0; }
table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.t tr.flag td { background: var(--bad-bg); }
table.t tfoot td { font-weight: 700; background: var(--chip); }
table.t select, table.t input { min-height: 36px; padding: 4px 8px; }
.lang { display: inline-block; font: 700 12px/1 "DM Sans", sans-serif; letter-spacing: .04em; color: #fff; padding: 4px 7px; border-radius: 6px; margin-right: 6px; vertical-align: 1px; }

/* segmented choice (room 4201A / 4207) */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: var(--bg); padding: 7px 11px; font-weight: 600; cursor: pointer; min-height: 36px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* semester cards */
.semcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-bottom: 18px; }
.semcard { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); cursor: pointer; display: grid; gap: 6px; }
.semcard:hover { border-color: var(--sub); }
.semcard[aria-current="true"] { border: 2px solid var(--accent); padding: 13px 15px; }
.semcard h3 { font: 700 19px/1.2 "Source Serif 4", serif; margin: 0; }

/* month preview */
.months { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.month { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.month h3 { font: 600 16px "Source Serif 4", serif; margin: 0 0 6px; }
.mgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; font-size: 13px; text-align: center; }
.mgrid .dh { color: var(--sub); font-weight: 600; font-size: 11px; }
.mgrid .d { padding: 4px 0; border-radius: 6px; }
.mgrid .d.in { background: var(--chip); }
.mgrid .d.holiday { background: var(--bad-bg); color: var(--bad); font-weight: 700; }
.mgrid .d.break { background: var(--warn-bg); color: var(--warn); font-weight: 700; }
.mgrid .d.finals { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.mgrid .d.first { outline: 2px solid var(--gold); outline-offset: -2px; font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 14px; color: var(--sub); margin: 10px 0 0; }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 6px; }

/* weekly room grid */
.wk { display: grid; grid-template-columns: 56px repeat(5, 1fr); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.wk .hd { background: var(--chip); padding: 6px; text-align: center; font-weight: 600; font-size: 13px; color: var(--sub); }
.wk .col { position: relative; border-left: 1px solid var(--line); }
.wk .hr { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); }
.wk .tl { position: absolute; right: 6px; font-size: 11px; color: var(--sub); transform: translateY(-50%); }
.wk .blk { position: absolute; border-radius: 6px; padding: 3px 6px; color: #fff; font-size: 12px; line-height: 1.25; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.wk .blk b { display: block; }
.wk .blk.clash { outline: 3px solid var(--bad); outline-offset: -1px; }

/* lab calendar */
.classpick { display: grid; gap: 8px; }
.classpick .lrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.classpick .lname { width: 150px; font-weight: 700; }
.chipbox { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px 6px 8px; cursor: pointer; background: var(--bg); font-weight: 600; }
.chipbox input { width: 18px; height: 18px; margin: 0; accent-color: var(--navy); }
.chipbox:has(input:checked) { background: var(--chip); border-color: var(--sub); }
.tray { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; color: #fff; font-weight: 600; font-size: 13px; padding: 5px 10px; border-radius: 999px; cursor: grab; user-select: none; border: 0; }
.pill.ws { }
.pill .x { background: none; border: 0; color: inherit; cursor: pointer; padding: 0 2px; font-size: 14px; line-height: 1; }
.lab { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 14px; }

<script>
'use strict';
/* =====================================================================================================================
   Semester console. One plan per lab, many semesters inside it. Field names match the Lab Hub Generator's STATE
   (semesters, activeSemesterId, labCalendars, course rows, roomAssignments, finalsOverrides), so the generator can load
   the same plan file (its "Load semester plan" button) for shifts, grading and class visits.
   Logic carried over from la-hub-generator.html (Banner parsing, finals table, room conflicts, lab weeks, due dates),
   with the generator's known problems fixed: holidays are computed for each year (no "2026 dates with the year
   swapped"), Fall dates come from UNG's perpetual calendar, one active semester, no duplicate helpers.
===================================================================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const DAY_FULL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const WD = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
const TYPE_LABEL = { fall: 'Fall', spring: 'Spring', summer: 'Summer' };
const SESSIONS = [['maymester', 'Maymester'], ['first', '1st session'], ['second', '2nd session'], ['full', 'Full session'], ['ecore', 'eCore']];
const SESSION_LABEL = Object.fromEntries(SESSIONS);
const REGULAR = 'regular';
/* languages: the lab's (lab calendar) and every language subject (courses). Colors are the generator's data colors. */
const LAB_LANGS = [['SPAN', 'Spanish', '#b85a0f'], ['FREN', 'French', '#0e7aaa'], ['ITAL', 'Italian', '#6b28a0'], ['PORT', 'Portuguese', '#3a7a22'], ['GRMN', 'German', '#8a6600']];
const LAB_LEVELS = ['1001', '1002'];
const LANG = { ARAB: ['Arabic', '#3d4ec4'], CHIN: ['Chinese', '#8a3f7e'], FREN: ['French', '#0e7aaa'], GRMN: ['German', '#8a6600'], ITAL: ['Italian', '#6b28a0'],
  JAPN: ['Japanese', '#a01010'], KREN: ['Korean', '#8a008a'], PORT: ['Portuguese', '#3a7a22'], RUSS: ['Russian', '#445e80'], SPAN: ['Spanish', '#b85a0f'], MLAN: ['Modern languages', '#52606d'] };
const LANG_ORDER = ['ARAB', 'CHIN', 'FREN', 'GRMN', 'ITAL', 'JAPN', 'KREN', 'PORT', 'RUSS', 'SPAN'];
const langColor = s => (LANG[String(s || '').toUpperCase()] || ['', '#52606d'])[1];
const isLang = s => !!LANG[String(s || '').toUpperCase()];
const LOCATIONS = ['Gainesville Campus', 'Dahlonega Campus', 'Oconee Campus', 'Cumming Campus', 'Blue Ridge Campus'];
const PIVOTS = [['DAH', 'Dahlonega'], ['GVL', 'Gainesville'], ['OCN', 'Oconee']];
const ROOMS = [['4201A', '4201A (larger)'], ['4207', '4207 (smaller)']];
const DUE_TIMES = ['8:00 AM', '9:00 AM', '10:00 AM', '11:00 AM', '12:00 PM', '1:00 PM', '2:00 PM', '3:00 PM', '4:00 PM', '5:00 PM', '6:00 PM', '8:00 PM', '11:59 PM'];
const LAB_BLUE = '#0e7aaa', WORKSHOP_GREEN = '#2a7a3a';

/* UNG Fall Semester Perpetual Calendar (knowledge/ung_fall_perpetual_calendar.md, UNG Academic Affairs).
   [classes start, Labor Day, Fall Break start, Fall Break end, classes end (Full & 2nd), finals start, finals end] */
const UNG_FALL_COLS = {
  A: ['08-12', '09-02', '11-25', '11-29', '11-22', '12-03', '12-06'], B: ['08-11', '09-01', '11-24', '11-28', '11-21', '12-02', '12-05'],
  C: ['08-10', '09-07', '11-23', '11-27', '11-20', '12-01', '12-04'], D: ['08-16', '09-06', '11-22', '11-26', '12-03', '12-07', '12-10'],
  E: ['08-14', '09-04', '11-20', '11-25', '12-01', '12-05', '12-08'], F: ['08-12', '09-03', '11-19', '11-23', '11-30', '12-04', '12-07'] };
const UNG_FALL_YEARS = { 2024: 'A', 2030: 'A', 2025: 'B', 2031: 'B', 2026: 'C', 2027: 'D', 2032: 'D', 2028: 'E', 2029: 'F' };
function ungFall(year) {
  const c = UNG_FALL_COLS[UNG_FALL_YEARS[year]]; if (!c) return null;
  const d = i => `${year}-${c[i]}`;
  return { start: d(0), end: d(4), finalsStart: d(5), finalsEnd: d(6), holidays: [{ date: d(1), name: 'Labor Day' }], breaks: [{ name: 'Fall Break', start: d(2), end: d(3) }] };
}

/* UNG final exam schedule (Fall/Spring), ung.edu/academic-affairs/calendars/final-exam-schedules.php:
   pattern -> [class start, exam day, exam start, exam end]. Summer finals are the last class meeting (not this table). */
const FINALS_TABLE = {
  M: [['16:00', 'Wed', '17:30', '19:30'], ['19:00', 'Tue', '19:50', '21:50']],
  W: [['16:00', 'Tue', '15:00', '17:00'], ['19:00', 'Tue', '19:50', '21:50']],
  MW: [['16:00', 'Wed', '17:30', '19:30'], ['17:30', 'Thu', '17:30', '19:30'], ['19:00', 'Wed', '19:50', '21:50'], ['20:30', 'Wed', '19:50', '21:50']],
  MWF: [['08:00', 'Fri', '08:00', '10:00'], ['09:00', 'Wed', '08:00', '10:00'], ['10:00', 'Fri', '10:20', '12:20'], ['11:00', 'Wed', '10:20', '12:20'], ['12:00', 'Thu', '10:20', '12:20'], ['13:00', 'Fri', '12:40', '14:40'], ['14:00', 'Wed', '12:40', '14:40'], ['15:00', 'Wed', '15:00', '17:00']],
  T: [['19:00', 'Tue', '17:30', '19:30']],
  R: [['19:00', 'Thu', '19:50', '21:50']],
  TR: [['08:00', 'Tue', '08:00', '10:00'], ['09:30', 'Thu', '08:00', '10:00'], ['11:00', 'Tue', '10:20', '12:20'], ['12:30', 'Thu', '12:40', '14:40'], ['14:00', 'Tue', '12:40', '14:40'], ['15:30', 'Thu', '15:00', '17:00'], ['17:30', 'Thu', '17:30', '19:30'], ['19:00', 'Tue', '17:30', '19:30'], ['20:30', 'Thu', '19:50', '21:50']],
  MTWRF: [['07:00', 'Fri', '12:40', '14:40'], ['12:00', 'Fri', '08:00', '10:00']],
};

/* ---------- dates & times ---------- */
const pd = s => new Date(s + 'T00:00:00');
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fmtMD = s => s ? pd(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
const fmtWMD = s => s ? pd(s).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : '';
const fmtLong = s => s ? pd(s).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }) : '';
const dayName = s => DAY_FULL[pd(s).getDay()];
const toHHMM = t => { t = String(t || '').trim(); return /^\d{3,4}$/.test(t) ? t.padStart(4, '0').replace(/^(\d{2})(\d{2})$/, '$1:$2') : t; };   // Banner gives "800"/"0800": every reader goes through this
const mins = t => { const m = toHHMM(t).match(/^(\d{1,2}):(\d{2})$/); return m ? +m[1] * 60 + +m[2] : -1; };
const fmt12 = t => { const v = mins(t); if (v < 0) return t || ''; const h = Math.floor(v / 60), m = v % 60; return `${h % 12 || 12}${m ? ':' + String(m).padStart(2, '0') : ''}${h >= 12 ? ' pm' : ' am'}`; };
const addMins = (t, n) => { const v = mins(t) + n; return `${String(Math.floor(v / 60) % 24).padStart(2, '0')}:${String(v % 60).padStart(2, '0')}`; };
const parseDays = d => [...String(d || '').toUpperCase().replace(/\s+/g, '')].map(c => ({ M: 'Mon', T: 'Tue', W: 'Wed', R: 'Thu', F: 'Fri' })[c]).filter(Boolean);
const normDays = d => String(d || '').trim().replace(/\s+/g, '');
function normDate(s) {
  s = String(s || '').trim(); if (!s) return '';
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const mo = { jan: '01', feb: '02', mar: '03', apr: '04', may: '05', jun: '06', jul: '07', aug: '08', sep: '09', oct: '10', nov: '11', dec: '12' };
  let m = s.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{2,4})$/); if (m) return `${m[3].length === 2 ? '20' + m[3] : m[3]}-${mo[m[2].toLowerCase()]}-${m[1].padStart(2, '0')}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) return `${m[3]}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`;
  return s;
}
function nthWeekday(y, m, wd, n) { // n = 1.. from the start, -1 = last
  if (n > 0) { const f = new Date(y, m, 1); return new Date(y, m, 1 + ((wd - f.getDay() + 7) % 7) + 7 * (n - 1)); }
  const l = new Date(y, m + 1, 0); return new Date(y, m, l.getDate() - ((l.getDay() - wd + 7) % 7));
}
/* the US holidays that fall inside each kind of term, worked out for that year */
function standardHolidays(type, y) {
  if (type === 'spring') return [{ date: iso(nthWeekday(y, 0, 1, 3)), name: 'Martin Luther King Jr. Day' }];
  if (type === 'summer') return [{ date: iso(nthWeekday(y, 4, 1, -1)), name: 'Memorial Day' }, { date: `${y}-06-19`, name: 'Juneteenth' }, { date: `${y}-07-04`, name: 'Independence Day' }];
  const th = nthWeekday(y, 10, 4, 4);
  return [{ date: iso(nthWeekday(y, 8, 1, 1)), name: 'Labor Day' }, { date: iso(th), name: 'Thanksgiving' }, { date: iso(addDays(th, 1)), name: 'Day after Thanksgiving' }];
}

/* ---------- the plan ---------- */
const KIND = 'ung-language-lab-semester-plan';
const blankPlan = () => ({ kind: KIND, version: 1, savedAt: '', semesters: [], activeSemesterId: null, courseLists: {}, rooms: {}, labCalendars: {} });
let P = blankPlan();
const F = { handle: null, name: '', lastModified: 0, dirty: false, supported: 'showOpenFilePicker' in window };
let VIEW = 'overview';
const sem = () => P.semesters.find(s => s.id === P.activeSemesterId) || null;
const semById = id => P.semesters.find(s => s.id === id) || null;
const semLabel = s => s ? `${TYPE_LABEL[s.type] || s.type} ${s.year}` : '';
const semOrder = s => s.year * 10 + ({ spring: 1, summer: 2, fall: 3 })[s.type];
const sortedSems = () => [...P.semesters].sort((a, b) => semOrder(b) - semOrder(a));
const courses = (id = P.activeSemesterId) => P.courseLists[id]?.rows || [];
const roomsOf = (id = P.activeSemesterId) => (P.rooms[id] ||= { assign: {}, finalsOverrides: {} });

/* ---------- browser storage (IndexedDB): the working copy and the plan file's handle ---------- */
const DB = (() => {
  let db = null;
  const open = () => db ? Promise.resolve(db) : new Promise((res, rej) => { const r = indexedDB.open('labSemesterConsole', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(db = r.result); r.onerror = () => rej(r.error); });
  const tx = (mode, fn) => open().then(d => new Promise((res, rej) => { const t = d.transaction('kv', mode), q = fn(t.objectStore('kv')); t.oncomplete = () => res(q?.result); t.onerror = () => rej(t.error); }));
  return { get: k => tx('readonly', s => s.get(k)).catch(() => null), set: (k, v) => tx('readwrite', s => s.put(v, k)).catch(() => null), del: k => tx('readwrite', s => s.delete(k)).catch(() => null) };
})();
let saveTimer = null;
function changed(rerender = true) {
  F.dirty = true; fileUI();
  clearTimeout(saveTimer); saveTimer = setTimeout(() => { DB.set('plan', P); storeMeta(); }, 300);
  if (rerender) show(VIEW, false);
}

/* ---------- the plan file (shared folder) ---------- */
const PICK = { types: [{ description: 'Semester plan', accept: { 'application/json': ['.json'] } }], excludeAcceptAllOption: false };
function checkPlan(o) {
  if (!o || typeof o !== 'object') throw new Error('That file is not a semester plan.');
  if (o.kind !== KIND) throw new Error('That file is not a semester plan. To bring in academic-calendar.json, room-schedule.json or lab-due-dates.json, use Import on this page.');
  return { ...blankPlan(), ...o };
}
async function openPlanFile() {
  if (F.dirty && P.semesters.length && !confirm('Your changes are not saved to the plan file. Open another file anyway? Your changes stay in this browser until you open it.')) return;
  try {
    const [h] = await showOpenFilePicker(PICK); const f = await h.getFile();
    P = checkPlan(JSON.parse(await f.text())); F.handle = h; F.name = f.name; F.lastModified = f.lastModified; F.dirty = false;
    await DB.set('plan', P); await DB.set('handle', h); storeMeta(); render(); toast(`Opened ${f.name}`);
  } catch (e) { if (e.name !== 'AbortError') toast(e.message, 6000); }
}
async function savePlan(as = false) {
  P.savedAt = new Date().toISOString();
  const text = JSON.stringify(P, null, 2);
  if (!F.supported) { download(planName(), text, 'application/json'); F.dirty = false; F.name ||= planName(); storeMeta(); fileUI(); toast('Downloaded. Put it in the shared folder so the others get it.'); return; }
  try {
    if (!F.handle || as) { F.handle = await showSaveFilePicker({ ...PICK, suggestedName: F.name || planName() }); await DB.set('handle', F.handle); }
    if ((await F.handle.queryPermission?.({ mode: 'readwrite' })) !== 'granted' && (await F.handle.requestPermission?.({ mode: 'readwrite' })) !== 'granted') throw new Error('Saving needs permission to change the file.');
    const cur = await F.handle.getFile();
    if (!as && F.lastModified && cur.lastModified > F.lastModified + 1000) { // someone else saved it after this page opened it
      const when = new Date(cur.lastModified).toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit' });
      if (!confirm(`Someone saved ${cur.name} at ${when}, after you opened it. Saving now replaces their changes.\n\nOK: save mine anyway. Cancel: keep theirs (then use "Open the plan file" to load their version).`)) return;
    }
    const w = await F.handle.createWritable(); await w.write(text); await w.close();
    const f = await F.handle.getFile(); F.name = f.name; F.lastModified = f.lastModified; F.dirty = false;
    await DB.set('plan', P); storeMeta(); fileUI(); toast(`Saved to ${f.name}`);
  } catch (e) { if (e.name !== 'AbortError') toast(e.message, 6000); }
}
const storeMeta = () => DB.set('fileMeta', { name: F.name, lastModified: F.lastModified, dirty: F.dirty });
const planName = () => `semester-plan${sem() ? '-' + sem().id : ''}.json`;
function fileUI() {
  const el = $('fileState'), dot = el.querySelector('.dot'), t = el.querySelector('span:last-child');
  dot.classList.toggle('on', !!F.name && !F.dirty);
  t.textContent = !F.name ? (P.semesters.length ? 'Not in a plan file yet' : 'No plan file yet') : F.dirty ? `Changes not saved to ${F.name}` : `Saved in ${F.name}`;
  document.title = (F.dirty ? '• ' : '') + 'Lab Console · Semester plan';
}
function download(name, text, type = 'application/json') {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const readFile = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsText(f); });

/* ---------- semesters & weeks ---------- */
function makeSemester(type, year) {
  const id = `${type}-${year}`;
  const s = { id, type, year, label: `${TYPE_LABEL[type]} ${year}`, start: '', end: '', finalsStart: '', finalsEnd: '', holidays: standardHolidays(type, year), breaks: [], sessions: type === 'summer' ? {} : null };
  if (type === 'fall') applyUngFall(s);
  return s;
}
function applyUngFall(s) {
  const u = ungFall(s.year); if (!u) return false;
  Object.assign(s, { start: u.start, end: u.end, finalsStart: u.finalsStart, finalsEnd: u.finalsEnd });
  s.holidays = mergeBy([...(s.holidays || []).filter(h => h.name !== 'Labor Day'), ...u.holidays], 'date');
  if (!(s.breaks || []).some(b => /fall break/i.test(b.name))) s.breaks = [...(s.breaks || []), ...u.breaks];
  return true;
}
const mergeBy = (list, k) => [...new Map(list.map(x => [x[k], x])).values()].sort((a, b) => String(a[k]).localeCompare(String(b[k])));
/* what a date is in this semester: holiday, break, finals (Fall/Spring window or a Summer session's) or nothing */
function blocked(s, d) {
  if (!s || !d) return null;
  const h = (s.holidays || []).find(x => x.date === d); if (h) return { kind: 'holiday', name: h.name };
  if (s.type !== 'summer' && s.finalsStart && s.finalsEnd && d >= s.finalsStart && d <= s.finalsEnd) return { kind: 'finals', name: 'Finals' };
  const b = (s.breaks || []).find(x => d >= x.start && d <= x.end); if (b) return { kind: 'break', name: b.name || 'Break' };
  for (const [k, x] of Object.entries(s.sessions || {})) if (x.finalsStart && x.finalsEnd && d >= x.finalsStart && d <= x.finalsEnd) return { kind: 'finals', name: `Finals (${SESSION_LABEL[k] || k})` };
  return null;
}
function termSpan(s, sessionsOnly) {
  if (s.type !== 'summer') return [s.start, s.end];
  const ss = Object.entries(s.sessions || {}).filter(([k, x]) => x.start && x.end && (!sessionsOnly || sessionsOnly.includes(k))).map(([, x]) => x);
  return ss.length ? [ss.reduce((a, b) => a.start < b.start ? a : b).start, ss.reduce((a, b) => a.end > b.end ? a : b).end] : ['', ''];
}
/* Monday-aligned weeks from the first to the last day of classes (same numbering as the generator, so plans match) */
function weeksOf(s) {
  const lc = s.type === 'summer' ? labCal(s) : null;
  const [a, b] = termSpan(s, lc ? activeSessions(s) : null); if (!a || !b) return [];
  let cur = pd(a); cur = addDays(cur, cur.getDay() === 0 ? -6 : 1 - cur.getDay());
  const out = [], end = pd(b);
  for (let i = 1; cur <= end; i++, cur = addDays(cur, 7)) out.push({ idx: i, start: iso(cur), end: iso(addDays(cur, 6)), days: [0, 1, 2, 3, 4, 5, 6].map(n => iso(addDays(cur, n))) });
  return out;
}

/* ---------- courses: Banner COM1430 (schedule) + COM775 (term dates, building, full instructor name), merged by CRN ---------- */
function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  text = text.replace(/\r\n?/g, '\n');

const rank = o => o?.kind === KIND ? 0 : Array.isArray(o?.semesters) ? 1 : 2;

  }
  if (Array.isArray(o?.semesters)) { // academic-calendar.json
    let a = 0, u = 0; o.semesters.forEach(s => { const i = P.semesters.findIndex(x => x.id === s.id); const t = { holidays: [], breaks: [], sessions: s.type === 'summer' ? {} : null, ...s, label: semLabel(s) }; if (i < 0) { P.semesters.push(t); a++; } else { P.semesters[i] = { ...P.semesters[i], ...t }; u++; } });
    if (o.activeSemesterId && semById(o.activeSemesterId)) P.activeSemesterId = o.activeSemesterId; else P.activeSemesterId ||= sortedSems()[0]?.id;

  }
  if (Array.isArray(o?.courses) && Array.isArray(o?.rooms)) { // room-schedule.json: rooms by CRN (and the classes, if no course list yet)
    const s = sem(); if (!s) throw new Error('Import academic-calendar.json first.');
    const list = P.courseLists[s.id] ||= { rows: [], importedAt: '', files: {}, ptrm: {} };
    if (!list.rows.length) list.rows = o.courses.map(c => ({ _id: c.CRN, CRN: c.CRN, SUBJ: c.SUBJ, CRSE: c.CRSE, SEC: c.SEC, CMP: '', CRED: '', TITLE: '', DAYS: c.DAYS, TIME_FROM: c.TIME_FROM, TIME_TO: c.TIME_TO, INSTRUCTOR: c.INSTRUCTOR, BUILDING: 'Nesbitt', ROOM: '4201', BLDGRM_RAW: '', LOCATION: 'Gainesville Campus', PART_OF_TERM: '', START: c.START, END: c.END, MAXENR: c.MAXENR }));

      const code = String(c.subject || '').toUpperCase(), lv = String(c.level || ''), se = c.session || REGULAR;
      if (!LAB_LANGS.some(l => l[0] === code) || !LAB_LEVELS.includes(lv)) { miss.push(c.class_label || code + lv); return; }
      const k = classKey(code, lv, se); lc.classesOffered[k] = true; if (s.type === 'summer') lc.sessionToggles[se] = true;
      if (c.due_day) lc.dueDayTimes[k] = { day: c.due_day, time: c.due_time || '11:59 PM' };
      (c.labs || []).forEach(l => {
        const w = weeks.find(x => x.days.includes(l.date)); if (!w) { out++; return; }
        const m = String(l.label || 'lab').match(/^(.*?)\s*(\d+)$/), id = ((m ? m[1] : l.label) || 'lab').trim().toLowerCase().replace(/\s+/g, '') + (m ? m[2] : '');
        if (!lc.labTypes.some(t => t.id === id)) lc.labTypes.push({ id, label: l.label || id, color: /workshop/i.test(l.label || '') ? WORKSHOP_GREEN : LAB_BLUE });
        const pk = `${w.idx}_${k}`; (lc.placements[pk] ||= []); if (!lc.placements[pk].includes(id)) { lc.placements[pk].push(id); placed++; }
      });
    });
    lc.labTypes.sort((a, b) => (/workshop/i.test(a.label) - /workshop/i.test(b.label)) || a.label.localeCompare(b.label, undefined, { numeric: true }));
    return `${semLabel(s)}: ${o.classes.length - miss.length} classes, ${placed} due dates${out ? `, ${out} outside the term's weeks` : ''}${miss.length ? `; not a lab class: ${miss.join(', ')}` : ''}.`;
  }
  throw new Error('Not a file this console knows (plan file, academic-calendar.json, room-schedule.json or lab-due-dates.json).');
}

/* ---------- start ---------- */
(async () => {
  let m = null; try { m = localStorage.getItem('labSemesterMode'); } catch (e) {}
  setMode(m || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  const saved = await DB.get('plan'); if (saved?.kind === KIND) P = { ...blankPlan(), ...saved };
  const h = await DB.get('handle');
  const meta = await DB.get('fileMeta');
  if (h) { F.handle = h; F.name = h.name; }
  if (meta) { F.name = meta.name || F.name; F.lastModified = meta.lastModified || 0; F.dirty = !!meta.dirty; } else F.dirty = !!saved?.semesters?.length;
  const want = location.hash.slice(1); if (SECTIONS.some(s => s[0] === want)) VIEW = want;
  if (!P.activeSemesterId && P.semesters.length) P.activeSemesterId = sortedSems()[0].id;
  render();
})();
