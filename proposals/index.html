<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Language Lab proposals</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#002147;--navy-2:#0b2f5c;--blue:#005fa3;--sky:#9cc9ee;--red:#c8102e;--gold:#b8952a;--gold-dk:#7a5d14;--gold-lt:#fdf6e3;
--ink:#0d1525;--muted:#4a5f75;--cream:#f7f9fc;--white:#fff;--line:#d5e0ee;--line-2:#9fb3cc;--green:#1a5c1a;--green-lt:#eef8ee;--red-lt:#fff0f2;}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'DM Sans',Arial,sans-serif;font-size:17px;line-height:1.6;color:var(--ink);background:var(--cream);}
a{color:var(--blue);} a:hover{color:var(--navy);}
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
.skip{position:absolute;left:-9999px;top:0;background:var(--gold-dk);color:#fff;padding:10px 16px;font-weight:700;z-index:100;}
.skip:focus{left:0;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}
header.top{background:var(--navy);color:#fff;padding:20px 28px;display:flex;align-items:center;gap:18px;}
.flag{display:flex;flex-direction:column;gap:3px;flex-shrink:0;position:relative;}.flag i{display:block;width:34px;height:5px;border-radius:2px;background:#c8102e;transition:background .9s ease;}.flag i:nth-child(2){background:#b8952a;}
.flag .flagtip{position:absolute;left:44px;top:-4px;background:rgba(0,0,0,.8);color:#fff;font:700 13px 'DM Sans',Arial,sans-serif;padding:3px 8px;border-radius:4px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10;}
.flag:hover .flagtip{opacity:1;}
.top h1 .c{transition:color .9s ease;}
.top h1{font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:1.65rem;line-height:1.15;margin:0;}
.top h1 .c{color:var(--sky);}
.top p{margin:2px 0 0;font-size:.95rem;color:#d6e2f0;}
.top .num{margin-left:auto;font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:3rem;line-height:1;color:var(--sky);}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;max-width:1060px;margin:0 auto;padding:22px 24px 60px;align-items:start;}
.side{position:sticky;top:12px;}
.tabs{display:flex;flex-direction:column;gap:6px;}
.tab{display:block;width:100%;text-align:left;font:inherit;font-size:.98rem;font-weight:600;color:var(--ink);background:var(--white);border:1.5px solid var(--line);border-left:5px solid transparent;border-radius:8px;padding:9px 12px;cursor:pointer;min-height:44px;}
.tab small{display:block;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.tab:hover{border-left-color:var(--gold);}
.tab[aria-selected="true"]{background:var(--navy);border-color:var(--navy);border-left-color:var(--gold);color:#fff;}
.tab[aria-selected="true"] small{color:#e8d080;}
.tab.lab{background:var(--gold-lt);border-color:var(--gold);border-left-color:var(--gold);}
.tab.lab[aria-selected="true"]{background:var(--gold-dk);border-color:var(--gold-dk);border-left-color:var(--navy);color:#fff;}
.tab.lab[aria-selected="true"] small{color:#fff3cf;}
.panel[hidden]{display:none;}
.panel:focus{outline:none;}
main{min-width:0;}
h2{font-family:'Fraunces',Georgia,serif;font-size:1.5rem;color:var(--navy);margin:0 0 10px;line-height:1.25;}
h3{font-size:1.05rem;color:var(--navy);margin:22px 0 6px;}
p{margin:0 0 10px;}
ul,ol{margin:0 0 10px;padding-left:22px;} li{margin:3px 0;}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;padding:0;list-style:none;}
.facts li{margin:0;background:var(--white);border:1.5px solid var(--line-2);border-radius:999px;padding:5px 14px;font-size:.95rem;}
.facts li b{color:var(--navy);}
.facts li.due{border-color:var(--red);background:var(--red-lt);}
.box{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin:0 0 14px;}
.box h3:first-child{margin-top:0;}
.box h3:first-child+h3{margin-top:6px;}
.note{border-left:4px solid var(--gold);background:var(--white);border-radius:0 8px 8px 0;padding:10px 14px;margin:0 0 14px;}
.qlist{list-style:none;padding:0;margin:0;counter-reset:q;}
.qlist li{counter-increment:q;position:relative;padding:9px 0 9px 42px;border-bottom:1px solid var(--line);margin:0;}
.qlist li:last-child{border-bottom:none;}
.qlist li::before{content:counter(q);position:absolute;left:0;top:10px;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:.9rem;display:flex;align-items:center;justify-content:center;}
.qlist .q{display:block;font-size:1.1rem;font-weight:600;color:var(--navy);}
.qlist .q i{font-style:normal;}
.qlist .g{display:block;color:var(--muted);font-size:.95rem;}
.qlist .t{display:block;font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:1.15rem;color:var(--navy);margin:0 0 4px;}
.qsub{list-style:none;padding:0;margin:0;}
.qsub li{counter-increment:none;padding:5px 0 5px 0;border:none;}
.qsub li::before{content:none;}
.qlist .qsub .q{font-size:1.05rem;}
.steps{counter-reset:s;list-style:none;padding:0;}
.steps li{counter-increment:s;padding-left:34px;position:relative;margin:6px 0;}
.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;border:2px solid var(--navy);color:var(--navy);font-weight:700;font-size:.85rem;display:flex;align-items:center;justify-content:center;}
.slide-ex{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 0;}
.slide-ex div{border-radius:8px;padding:10px 12px;font-size:.95rem;}
.slide-ex .ok{background:var(--green-lt);border:1.5px solid var(--green);}
.slide-ex .no{background:var(--red-lt);border:1.5px solid var(--red);}
.slide-ex b{display:block;font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;}
.slide-ex .ok b{color:var(--green);} .slide-ex .no b{color:#9b0c23;}
.slide-ex .t{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:1.1rem;color:var(--navy);display:block;}
.check{list-style:none;padding:0;} .check li{display:flex;gap:10px;align-items:flex-start;}
.check input{width:24px;height:24px;margin-top:4px;accent-color:var(--navy);flex-shrink:0;}
.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;}
.subtab{font:inherit;font-size:.95rem;font-weight:600;padding:6px 14px;min-height:44px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--white);color:var(--navy);cursor:pointer;}
.subtab[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:#fff;}
table{border-collapse:collapse;width:100%;margin:0 0 8px;background:var(--white);font-size:.98rem;}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
th{font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--cream);}
td:first-child{font-weight:600;color:var(--navy);width:48%;}
.say{border:1px solid var(--line-2);background:var(--white);color:var(--navy);border-radius:6px;min-width:36px;min-height:36px;cursor:pointer;margin-left:6px;font-size:.95rem;}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:0 0 6px;}
.imgs figure{margin:0;background:var(--white);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.imgs img{width:100%;height:110px;object-fit:cover;display:block;}
.imgs figcaption{padding:6px 9px;font-size:.92rem;} .imgs figcaption b{display:block;color:var(--navy);}
.credit{font-size:.85rem;color:var(--muted);}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.camp{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:.95rem;}
.camp h3{margin:0 0 4px;}
.camp a{display:inline-block;padding:3px 0;min-height:24px;}
.labrow{display:grid;grid-template-columns:52px 1fr;gap:12px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 10px;}
.labrow .n{font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:2rem;color:var(--blue);line-height:1;}
.labrow h3{margin:0 0 2px;}
.labstate{margin:0;font-size:.875rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
.labstate:empty{display:none;}
.labrow.past{background:var(--cream);border-style:dashed;}
.labrow.past .n,.labrow.past h3,.labrow.past p,.labrow.past .meta b{color:var(--muted);}
.labrow.current{border:2px solid var(--gold);box-shadow:0 6px 20px rgba(122,93,20,.18);transform:scale(1.015);background:var(--gold-lt);}
.labrow.current .labstate{display:inline-block;background:var(--gold-dk);color:#fff;border-radius:999px;padding:1px 10px;margin-bottom:4px;}
.box.honesty{border-left:5px solid var(--red);}
.labrow .meta{font-size:.92rem;color:var(--muted);margin:0 0 4px;}
.labrow .meta b{color:var(--red);}
.btn{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;font-weight:700;padding:10px 18px;border-radius:8px;min-height:44px;}
.btn:hover{background:var(--navy-2);color:#fff;}
.btn.gold{background:var(--gold-dk);} .btn.gold:hover{background:#5f480f;}
.labpanel{background:var(--gold-lt);border:1.5px solid var(--gold);border-radius:12px;padding:18px 20px;}
.cards{display:flex;flex-wrap:wrap;gap:10px;list-style:none;padding:0;margin:0 0 6px;}
.cards li{margin:0;}
.wcard{font:inherit;min-width:150px;min-height:64px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--navy);background:var(--white);cursor:pointer;text-align:center;}
.wcard .w{display:block;font-weight:700;font-size:1.1rem;color:var(--navy);}
.wcard .m{display:block;font-size:.95rem;color:var(--muted);}
.wcard .m[hidden]{display:none;}
.wcard[aria-expanded="true"]{background:var(--sky);border-color:var(--sky);}
.wcard[aria-expanded="true"] .m{color:var(--ink);}
.linkbtn{font:inherit;font-weight:700;color:var(--navy);background:var(--white);border:1.5px solid var(--navy);border-radius:999px;padding:6px 16px;min-height:44px;cursor:pointer;}
.hero{margin:0 0 14px;}
.hero img{display:block;width:100%;height:180px;object-fit:cover;border-radius:12px;}
.hero figcaption{font-size:.85rem;color:var(--muted);margin-top:4px;}
.hero figcaption a{color:var(--muted);display:inline-block;min-height:24px;padding:2px 0;}
.video{position:relative;width:100%;max-width:720px;aspect-ratio:16/9;background:#0b1a2e;border-radius:12px;overflow:hidden;margin:0 0 14px;}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
details.box summary{cursor:pointer;min-height:32px;color:var(--navy);}
details.box[open] summary{margin-bottom:6px;}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 16px;}
.btn.ghost{background:var(--white);color:var(--navy);border:1.5px solid var(--navy);}
.btn.ghost:hover{background:var(--cream);color:var(--navy);}
footer.foot{max-width:1060px;margin:0 auto;padding:0 24px 30px;font-size:.88rem;color:var(--muted);}
.single{max-width:760px;margin:0 auto;padding:22px 24px 60px;}
@media (max-width:820px){
 .layout{grid-template-columns:minmax(0,1fr);gap:14px;padding:14px 16px 50px;}
 .side{position:static;} .tabs{flex-direction:row;flex-wrap:wrap;} .tab{width:auto;flex:1 1 40%;border-left-width:1.5px;}
 header.top{padding:16px;} .top .num{font-size:2.3rem;} .slide-ex{grid-template-columns:1fr;}
 .single{padding:14px 16px 50px;}
}
@page{size:letter;margin:.65in;}
@media print{
 .side,.skip,.no-print,.accent-tab,.say{display:none!important;}
 body{background:#fff;} header.top{background:#fff;color:#000;border-bottom:2px solid #000;}
 .top h1 .c,.top .num,.top p{color:#000;}
 .layout{grid-template-columns:1fr;} .panel[hidden]{display:block!important;}
 .box,.labrow,.camp{break-inside:avoid;}
}

.os-switch{display:inline-flex;border:1.5px solid var(--navy);border-radius:999px;overflow:hidden;margin:0 0 14px;}
.os-switch button{font:inherit;font-weight:700;padding:8px 22px;min-height:44px;border:none;background:var(--white);color:var(--navy);cursor:pointer;}
.os-switch button[aria-pressed="true"]{background:var(--navy);color:#fff;}
.kb{display:flex;flex-direction:column;gap:4px;background:#e9eef5;border:1px solid var(--line-2);border-radius:12px;padding:10px;margin:8px 0 6px;max-width:760px;overflow-x:auto;}
.kb-row{display:flex;gap:4px;}
.key{flex:1 0 40px;min-width:42px;height:54px;border-radius:6px;background:#fff;border:1px solid #b9c6d6;box-shadow:0 1px 0 #9fb3cc;position:relative;font-size:15px;line-height:1;color:var(--ink);}
.key .o{position:absolute;left:7px;bottom:7px;font-weight:700;font-size:17px;}
.key .s{position:absolute;left:7px;top:5px;font-size:14px;color:var(--muted);}
.key .us{position:absolute;right:5px;bottom:6px;font-size:14px;color:#5b6b7f;}
.key.w15{flex-basis:62px;} .key.w2{flex-basis:80px;} .key.w25{flex-basis:96px;} .key.sp{flex:6 0 200px;}
.key.mod .o{font-size:14px;font-weight:600;color:var(--muted);}
.key.moved{background:var(--gold-lt);border-color:var(--gold);}
.key.blank{background:#f3f5f8;}
.key.hl{background:var(--navy);border-color:var(--navy);}
.key.hl .o,.key.hl .s,.key.hl .us{color:#fff;}
.kb-legend{font-size:.92rem;color:var(--muted);margin:0 0 10px;}
.kb-legend span{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin:0 4px 0 10px;}
kbd{font:600 .9em 'DM Sans',Arial,sans-serif;background:var(--white);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;white-space:nowrap;}
.practice{background:var(--white);border:1.5px solid var(--navy);border-radius:12px;padding:14px 18px;margin:10px 0;}
.practice .target{font-family:'Fraunces',Georgia,serif;font-size:1.5rem;font-weight:700;color:var(--navy);margin:2px 0 8px;}
.practice input{width:100%;max-width:520px;font:inherit;font-size:1.15rem;padding:9px 12px;border:1.5px solid var(--line-2);border-radius:8px;min-height:48px;}
.practice input:focus-visible{outline:3px solid var(--gold);outline-offset:1px;}
.practice .fb{min-height:52px;margin:8px 0;font-weight:600;}
.practice .fb.ok{color:var(--green);} .practice .fb.hint{color:var(--navy);}
.practice .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.practice .count{color:var(--muted);font-size:.92rem;}
@media print{.practice,.os-switch{display:none!important;}}

.lead{font-size:1.05rem;color:var(--soft,#1e3a5f);margin:0 0 16px;}
.muted{color:var(--muted);}
code{font-size:.9em;background:#eef2f7;padding:1px 5px;border-radius:4px;}
.tscroll{overflow-x:auto;margin:0 0 10px;}
table.order th[scope=row]{color:var(--navy);text-transform:none;letter-spacing:0;font-size:.95rem;background:var(--white);}
table.order{min-width:820px;} table.order td{font-weight:400;color:var(--ink);width:auto;}
.seg button:disabled{opacity:.35;cursor:not-allowed;}
.flow{list-style:none;padding:0;margin:0 0 26px;display:grid;grid-template-columns:repeat(4,1fr);gap:22px;counter-reset:f;}
.flow li{margin:0;position:relative;}
.flow li+li::before{content:"";position:absolute;left:-19px;top:50%;width:16px;height:16px;border-top:3px solid var(--gold);border-right:3px solid var(--gold);transform:translateY(-50%) rotate(45deg);}
.flowcard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;height:100%;text-align:left;font:inherit;background:var(--white);border:1.5px solid var(--line);border-top:5px solid var(--navy);border-radius:12px;padding:14px 14px 16px;cursor:pointer;box-shadow:0 4px 18px rgba(0,33,71,.08);}
.flowcard:hover{border-color:var(--navy);}
.fnum{font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:1.6rem;color:var(--blue);line-height:1;}
.ficon svg{width:30px;height:30px;color:var(--navy);}
.floc{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.ftitle{font-weight:700;font-size:1.08rem;color:var(--navy);}
.fdesc{font-size:.92rem;color:var(--ink);}
@media(max-width:900px){.flow{grid-template-columns:1fr;}.flow li+li::before{left:50%;top:-14px;transform:translateX(-50%) rotate(135deg);}}
/* D2L look */
.d2l{margin:0;border:1px solid #cdd5dc;border-radius:10px;overflow:hidden;background:#f9fbff;font-family:Lato,'DM Sans',Arial,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.08);}
.d2l figcaption{background:#fff;border-top:1px solid #e3e9f1;padding:10px 16px;font-size:.92rem;color:#494c4e;}
.d2l-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#fff;border-bottom:1px solid #e3e9f1;padding:10px 16px;}
.d2l-logo{font-weight:900;color:#fff;background:#006fbf;border-radius:6px;padding:2px 8px;font-size:.85rem;}
.d2l-course{font-weight:700;color:#202122;}
.d2l-nav{display:flex;gap:16px;margin-left:auto;font-size:.92rem;color:#494c4e;}
.d2l-nav .on{color:#006fbf;font-weight:700;border-bottom:3px solid #006fbf;padding-bottom:2px;}
.d2l-body{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:420px;}
.d2l-toc{background:#fff;border-right:1px solid #e3e9f1;padding:14px 0;}
.d2l-h{font-weight:700;color:#202122;padding:0 16px;margin:0 0 8px;}
.d2l-toc ul{list-style:none;margin:0;padding:0;}
.d2l-toc li{padding:8px 16px;font-size:.95rem;color:#202122;margin:0;display:flex;align-items:center;gap:6px;}
.d2l-toc li.mut{color:#6e7376;}
.d2l-toc li.on{background:#e8f2fb;border-left:4px solid #006fbf;font-weight:700;color:#004489;}
.d2l-toc svg{width:18px;height:18px;}
.d2l-toc .cnt{margin-left:auto;font-size:.8rem;background:#fff;border:1px solid #cdd5dc;border-radius:10px;padding:0 7px;color:#494c4e;font-weight:600;}
.d2l-main{padding:16px 20px;min-width:0;}
.d2l-crumb{font-size:.88rem;color:#494c4e;margin:0 0 4px;}
.d2l-title{font-size:1.5rem;color:#202122;margin:0 0 10px;font-weight:400;}
.d2l-desc{display:block;width:100%;text-align:left;font:inherit;background:#fff;border:1px dashed #9ca8b4;border-radius:8px;padding:12px 14px;margin:0 0 14px;cursor:pointer;}
.d2l-desc:hover{border-color:#006fbf;}
.dlabel{display:block;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#494c4e;margin-bottom:6px;}
.dtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;}
.dtabs span{background:var(--navy);color:#fff;border-radius:6px;padding:3px 10px;font-size:.88rem;font-weight:600;}
.dtabs span.g{background:var(--gold-dk);}
.dnote{display:block;font-size:.9rem;color:#494c4e;}
.d2l-topics{list-style:none;margin:0;padding:0;border-top:1px solid #e3e9f1;}
.d2l-topics li{margin:0;border-bottom:1px solid #e3e9f1;}
.d2l-topic{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;background:#fff;border:0;padding:10px 12px;cursor:pointer;min-height:52px;}
.d2l-topic:hover{background:#f1f6fb;}
.ti{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ti svg{width:20px;height:20px;}
.ti.quiz{background:#e6f0fa;color:#004489;} .ti.bongo{background:#fdf1dc;color:#7a4a00;}
.tt{display:flex;flex-direction:column;min-width:0;}
.tn{color:#006fbf;font-weight:700;}
.tm{font-size:.86rem;color:#494c4e;}
.lk{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;color:#494c4e;}
.lk svg{width:14px;height:14px;}
@media(max-width:760px){.d2l-body{grid-template-columns:1fr;}.d2l-toc{border-right:0;border-bottom:1px solid #e3e9f1;}.d2l-toc li.mut{display:none;}.d2l-nav{display:none;}}
/* comparison */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 10px;}
.cmp>div{border-radius:12px;padding:14px 18px;}
.cmp h3{margin-top:0;}
.was{background:var(--red-lt);border:1.5px solid #e6a3ae;}
