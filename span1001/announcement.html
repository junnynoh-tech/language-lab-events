<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Language Lab Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Class event page template (labs/class-pages). Built by build.py or the Event Generator's Class version card:
     the PAGE_DATA block below is filled with one class config + the themes it uses. Three modes from one file:
     page (flip cards) · embed (?embed=1, or shown inside a frame) · announce (D2L file framed in a News item: header + embed + self-sizing). -->
<style>
:root{
  --navy:#1A3A6B; --navy-dark:#132C52; --gold:#B08D3F; --offwhite:#F7F7F5; --white:#FFFFFF; --ink:#1F2937; --muted:#5A6472;
  --bg:var(--offwhite); --surface:var(--white); --line:rgba(31,41,55,.14); --line-strong:rgba(31,41,55,.28); --focus:var(--navy);
  --accent:var(--gold); --accent-bg:var(--navy); --accent-t:var(--navy); --deco-op:.16; --gold-t:#7A5F24;
}
@media (prefers-color-scheme:dark){ :root:not([data-mode="light"]){ --bg:#0F1115; --surface:#181B22; --ink:#F1F3F6; --muted:#B8C0CE;
  --line:rgba(241,243,246,.14); --line-strong:rgba(241,243,246,.32); --navy:#9DB8EC; --gold:#D9B968; --focus:#D9B968; --deco-op:.30; --gold-t:#D9B968; } }
:root[data-mode="dark"]{ --bg:#0F1115; --surface:#181B22; --ink:#F1F3F6; --muted:#B8C0CE; --line:rgba(241,243,246,.14); --line-strong:rgba(241,243,246,.32);
  --navy:#9DB8EC; --gold:#D9B968; --focus:#D9B968; --deco-op:.30; --gold-t:#D9B968; }

*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font:18px/1.55 'DM Sans',sans-serif; transition:background-color .3s ease;}
.skip{position:absolute; left:-999px; top:0; z-index:20; background:var(--navy); color:var(--white); padding:10px 16px; border-radius:0 0 8px 0;}
.skip:focus{left:0;}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap;}
:focus-visible{outline:3px solid var(--focus); outline-offset:3px;}

/* themed background: one layer per theme, the selected event's theme shows */
.deco{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
.deco svg{position:absolute; inset:0; width:100%; height:100%; opacity:0; transition:opacity .5s ease;}
.deco svg.on{opacity:var(--deco-op);}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes fall{0%{transform:translateY(-6%) rotate(0)}100%{transform:translateY(106%) rotate(200deg)}}
@keyframes rise{0%{transform:translateY(8%);opacity:0}20%{opacity:1}100%{transform:translateY(-30%);opacity:0}}
.deco .tw{animation:tw 3.2s ease-in-out infinite;} .deco .fall{animation:fall 14s linear infinite;} .deco .rise{animation:rise 9s ease-in-out infinite;}
@keyframes sway{from{transform:translateX(-16px) rotate(-30deg)}to{transform:translateX(16px) rotate(30deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.deco .sway{animation:sway 4.5s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:center;}
.deco .spin{animation:spin 80s linear infinite;}
.deco svg.on.season{opacity:calc(var(--deco-op) * 1.5);}
@media (prefers-reduced-motion:reduce){ .deco .tw,.deco .fall,.deco .rise,.deco .sway,.deco .spin{animation:none;} .card-inner{transition:none!important;} body{transition:none;} }

.wrap{position:relative; z-index:1; max-width:1160px; margin:0 auto; padding:24px 20px 56px;}
.toolbar{display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; margin-bottom:16px;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:0 20px; border-radius:999px;
  border:1.5px solid var(--line-strong); background:var(--surface); color:var(--ink); font:600 16px/1 'DM Sans',sans-serif; text-decoration:none; cursor:pointer;
  transition:background-color .15s ease, border-color .15s ease;}
.btn:hover{border-color:var(--navy);}
.btn.solid{background:var(--card-accent,var(--accent-bg)); border-color:var(--card-accent,var(--accent-bg)); color:#fff;}
.btn.solid:hover{filter:brightness(1.1);}

header.top{display:grid; grid-template-columns:1fr auto; gap:16px 32px; align-items:end; margin:8px 0 28px;}
.kicker{font:700 14px/1.2 'DM Sans',sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-t); margin:0 0 10px;}
h1{font:700 clamp(32px,4.6vw,54px)/1.06 'Source Serif 4',Georgia,serif; color:var(--navy); margin:0; letter-spacing:-.01em; max-width:16ch;}
h1 em{font-style:italic; font-weight:400; color:var(--accent-t); transition:color .3s ease;}
.lead{font-size:20px; color:var(--muted); margin:14px 0 0; max-width:52ch;}
.total{border:1.5px solid var(--line-strong); background:var(--surface); border-radius:16px; padding:16px 20px; max-width:340px;}
.total .n{font:700 48px/1 'Source Serif 4',Georgia,serif; color:var(--accent-t); transition:color .3s ease;}
.total .n small{font:600 18px 'DM Sans',sans-serif; color:var(--muted); margin-left:6px;}
.total p{margin:8px 0 0; font-size:16px; color:var(--muted);}

/* the lineup: one grid; build fills columns (card · join · card …); stacks under 900px */
.lineup{display:grid; column-gap:16px; row-gap:10px; align-items:start;}
.join{align-self:center; display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--muted); font:700 13px 'DM Sans',sans-serif; letter-spacing:.08em; text-transform:uppercase;}
.join b{display:grid; place-items:center; width:48px; height:48px; border-radius:50%; border:1.5px solid var(--line-strong); background:var(--surface);
  font:700 22px/1 'Source Serif 4',Georgia,serif; color:var(--ink); letter-spacing:0; text-transform:none;}
.group-label{display:flex; justify-content:space-between; gap:12px; font:700 14px 'DM Sans',sans-serif; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0; border-bottom:1.5px solid var(--line-strong); padding-bottom:6px;}

.card{perspective:1600px; min-width:0;}
.card-inner{position:relative; display:grid; transform-style:preserve-3d; transition:transform .6s cubic-bezier(.2,.7,.2,1);}
.card.flipped .card-inner{transform:rotateY(180deg);}
.face{grid-area:1 / 1; position:relative; min-height:100%; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:18px; overflow:hidden; border:1.5px solid var(--line); background:var(--surface);}
.front{display:flex; flex-direction:column; justify-content:center; padding:0 0 70px; cursor:pointer; text-align:left; font:inherit; color:inherit; width:100%; background:#141014; border:0;}
.front img{width:100%; height:auto; display:block;}
.front .ph{aspect-ratio:4/5; display:grid; place-items:center; padding:24px; color:#fff; background:var(--card-accent); font:700 32px/1.1 'Source Serif 4',Georgia,serif; text-align:center;}
.flip-hint{position:absolute; left:12px; right:12px; bottom:12px; display:flex; justify-content:space-between; align-items:center; gap:8px;
  background:rgba(15,17,21,.86); color:#fff; border-radius:12px; padding:12px 14px; font:600 16px 'DM Sans',sans-serif;}
.flip-hint span:last-child{font-weight:500; white-space:nowrap;}
.flip-hint span:first-child{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.front:hover .flip-hint{background:rgba(15,17,21,.95);}
.back{transform:rotateY(180deg); display:flex; flex-direction:column; padding:22px 22px 20px; border-color:var(--card-accent,var(--line));}
.tag{display:inline-flex; align-self:flex-start; font:700 13px 'DM Sans',sans-serif; letter-spacing:.12em; text-transform:uppercase; color:#fff; background:var(--card-accent); border-radius:999px; padding:6px 12px;}
.det h2{font:700 26px/1.15 'Source Serif 4',Georgia,serif; margin:12px 0 4px; color:var(--ink);}
.det .when{color:var(--muted); font-size:16px; margin:0 0 12px;}
.det ol{margin:0 0 12px; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:10px; font-size:16.5px; line-height:1.5;}
.det ol li{counter-increment:s; display:grid; grid-template-columns:30px 1fr; gap:8px;}
.det ol li::before{content:counter(s); display:grid; place-items:center; width:28px; height:28px; border-radius:50%; background:var(--card-accent); color:#fff; font:700 15px 'DM Sans',sans-serif;}
.det .earn{margin-top:auto; display:flex; justify-content:space-between; align-items:center; gap:10px; border-top:1px solid var(--line); padding-top:12px; font-size:16px;}
.det .earn strong{font:700 24px 'Source Serif 4',Georgia,serif; color:var(--card-accent-t);}
.det .actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
/* a wide card back (the open card in fit mode) puts "Earns" and the buttons in a right-hand column */
.back{container-type:inline-size;}
@container (min-width:420px){
  .back .det{display:grid; grid-template-columns:1fr auto; column-gap:20px; align-items:start;}
  .back .det > *{grid-column:1;} .back .det .tag{justify-self:start;}
  .back .det .earn{grid-column:2; grid-row:1 / span 3; border:0; padding:0; margin:0; flex-direction:column; align-items:flex-end;}
  .back .det .actions{grid-column:2; grid-row:4 / span 2; flex-direction:column; align-items:stretch; align-self:end; margin:0;}
  .back .det .actions .btn{min-height:44px;}
}

.adds{margin:34px 0 0; display:grid; grid-auto-flow:column; grid-auto-columns:1fr; border:1.5px solid var(--line); border-radius:18px; background:var(--surface); overflow:hidden;}
.adds > div{padding:18px 20px; border-right:1px solid var(--line);} .adds > div:last-child{border-right:0;}
.adds .d{font:700 13px 'DM Sans',sans-serif; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);}
.adds .t{font:700 24px/1.2 'Source Serif 4',Georgia,serif; margin:4px 0 2px;}
.adds p{margin:0; font-size:16px; color:var(--muted);}
.fine{margin:18px 0 0; font-size:16px; color:var(--muted); display:flex; flex-wrap:wrap; gap:6px 18px;}
.fine a{color:var(--navy); font-weight:600;}
.panel,.pick-hint{display:none;}

@media (max-width:900px){ header.top{grid-template-columns:1fr;}
  .lineup{display:flex; flex-direction:column; align-items:stretch; max-width:460px; margin:0 auto;} .join{flex-direction:row; margin:4px 0;} .group-label.g2{margin-top:18px;} }
@media (max-width:640px){ .adds{grid-auto-flow:row;} .adds > div{border-right:0; border-bottom:1px solid var(--line);} .adds > div:last-child{border-bottom:0;} }

/* ---------- fit: the full page on a laptop or desktop fills exactly one screen (cards sized by JS from the space left) ---------- */
html.fit body{height:100vh; overflow:auto;}
html.fit .wrap{height:100vh; min-height:600px; display:flex; flex-direction:column; padding:12px 24px 12px; max-width:1260px;}
html.fit .toolbar{margin:0 0 4px;} html.fit .toolbar .btn{min-height:40px; font-size:15px; padding:0 16px;}
html.fit header.top{margin:0 0 12px; gap:12px 28px;}
html.fit .kicker{margin:0 0 6px;} html.fit h1{font-size:clamp(28px,3.3vw,44px); max-width:none;} html.fit .lead{font-size:18px; margin:6px 0 0;}
html.fit .total{padding:10px 16px; max-width:420px;} html.fit .total .n{font-size:36px;} html.fit .total p{font-size:15px; margin-top:2px; line-height:1.45;}
html.fit main{flex:1; min-height:0; display:flex; flex-direction:column;}
html.fit .lineup{flex:1; min-height:0; justify-content:center; align-content:start; transition:grid-template-columns .45s cubic-bezier(.2,.7,.2,1);}
@media (prefers-reduced-motion:reduce){ html.fit .lineup{transition:none;} }
html.fit .card-inner{height:var(--cardh);} html.fit .face{min-height:0; height:100%;}
html.fit .back{overflow:auto; padding:16px 18px 14px;} html.fit .det h2{font-size:22px; margin:8px 0 2px;} html.fit .det ol{font-size:15.5px; gap:6px; line-height:1.4;} html.fit .det .when{font-size:15px; margin:0 0 8px;} html.fit .det ol li::before{width:24px; height:24px; font-size:13px;} html.fit .det ol li{grid-template-columns:26px 1fr;}
html.fit .adds{margin:12px 0 0;} html.fit .adds > div{padding:10px 16px;} html.fit .adds .t{font-size:20px;} html.fit .adds p{font-size:15px;}
html.fit .fine{margin:8px 0 0; font-size:15px;}
@media (max-height:820px){ html.fit .adds{display:none;} }   /* short laptop screens: the cards get the room (the dates are on every card) */

/* ---------- embed / announce: flyers in a row at every width; the chosen event's details in one panel underneath ---------- */
html.embed .toolbar, html.embed .fine, html.embed .adds, html.embed header.top{display:none;}
html.embed .wrap{padding:12px 12px 16px;}
html.embed .lineup{display:grid!important; max-width:none; margin:0;}
html.embed .pick-hint[hidden]{display:none;} html.embed .group-label.g2{margin-top:0;}
html.announce .wrap{max-width:860px;}   /* framed from GitHub the height is fixed: cap the width so the flyers (and the height) stop growing */
html.embed .card, html.embed .card-inner{display:contents;}
html.embed .back{display:none!important;}
html.embed .front{grid-column:var(--col); grid-row:2; transform:none!important; padding:0; border-radius:14px; outline:3px solid transparent; outline-offset:2px; transition:outline-color .2s ease;}
html.embed .card.flipped .front{outline-color:var(--card-accent);}
html.embed .flip-hint{left:8px; right:8px; bottom:8px; padding:9px 10px; font-size:15px;}
html.embed .join b{width:38px; height:38px; font-size:18px;} html.embed .join span{font-size:11px;}
html.embed .panel{display:block; margin-top:12px; border:1.5px solid var(--card-accent,var(--line)); border-radius:16px; background:var(--surface); padding:18px 20px;}
html.embed .panel[hidden]{display:none;}
html.embed .panel .det{display:grid; grid-template-columns:1fr auto; column-gap:24px; align-items:start;}
html.embed .panel .det > *{grid-column:1;} html.embed .panel .earn{grid-column:2; grid-row:1 / span 3; border:0; padding:0; flex-direction:column; align-items:flex-end; margin:0;}
html.embed .panel .actions{grid-column:2; grid-row:4 / span 2; justify-content:flex-end; align-self:end;}
html.embed .panel .tag{justify-self:start;}
html.embed .pick-hint{display:block; margin-top:12px; padding:16px; border:1.5px dashed var(--line-strong); border-radius:14px; color:var(--muted); text-align:center; font-size:17px;}
@media (max-width:640px){
  html.embed .join{display:none;} html.embed .lineup{column-gap:8px!important;}
  html.embed .group-label{font-size:12px; letter-spacing:.06em;} html.embed .group-label span:last-child{display:none;}
  html.embed .flip-hint{display:none;}
  html.embed .panel .det{grid-template-columns:1fr;} html.embed .panel .earn,html.embed .panel .actions{grid-column:1; grid-row:auto; align-items:flex-start; justify-content:flex-start;}
}
/* announce: the D2L file's own header */
.ann{display:none;}
html.announce .ann{display:block; background:#1A3A6B; color:#fff; border-radius:14px; padding:22px 24px 20px; margin:0 0 12px;}
.ann .k{margin:0 0 6px; font:700 13px/1.2 'DM Sans',sans-serif; letter-spacing:.16em; text-transform:uppercase; color:#E8D3A0;}
.ann h2{margin:0; color:#fff; font:700 clamp(24px,3.6vw,32px)/1.15 'Source Serif 4',Georgia,serif;}
.ann h2 em{font-weight:400; font-style:italic; color:#E8D3A0;}
.ann p{margin:8px 0 0; color:#DCE4F2; font-size:17px;} .ann strong{color:#fff;}
.ann .row{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
.ann .row a{display:inline-flex; align-items:center; min-height:44px; padding:0 16px; border-radius:999px; border:1.5px solid rgba(255,255,255,.6); color:#fff; text-decoration:none; font:600 15px 'DM Sans',sans-serif;}
.ann .row a:hover{background:rgba(255,255,255,.12);} .ann .row a:focus-visible{outline:3px solid #E8D3A0; outline-offset:2px;}

@page{size:letter; margin:.6in;}
@media print{
  .deco,.toolbar,.skip,.flip-hint,.actions,.panel,.pick-hint,.ann{display:none!important;}
  :root,:root[data-mode="dark"]{--bg:#fff; --surface:#fff; --ink:#111; --muted:#444; --line:#bbb; --line-strong:#888; --navy:#1A3A6B;}
  body{background:#fff; font-size:10.5pt;} .wrap{max-width:none; padding:0;}
  h1{font-size:22pt; max-width:none;} .lead{font-size:11pt;} header.top{margin:0 0 12pt;}
  .lineup{display:block!important;} .join,.group-label{display:none!important;}
  .card{display:block!important; perspective:none; break-inside:avoid; margin:0 0 8pt;} .card-inner{display:grid!important; transform:none!important; grid-template-columns:1.1in 1fr; gap:12pt;}
  .face{grid-area:auto; min-height:0; transform:none!important; backface-visibility:visible; border:0; border-radius:0; display:block!important;}
  .front{padding:0; background:none;} .front img{width:1.1in;} .front .ph{font-size:12pt; padding:6pt;}
  .back{padding:0 0 0 10pt; border-left:2pt solid var(--card-accent)!important;} .det h2{font-size:13pt; margin:4pt 0 2pt;} .det ol{font-size:10pt; gap:2pt;} .det .earn{border:0; padding:2pt 0 0;}
  .adds{border:1px solid #bbb; margin-top:10pt;} .adds > div{padding:8pt 10pt;} .adds .t{font-size:13pt;}
}
</style>
<style id="theme-css"></style>
</head>
<body>
<a class="skip" href="#main">Skip to the events</a>
<div class="deco" aria-hidden="true" id="deco"></div>
<div class="wrap">
  <div class="toolbar">
    <button type="button" class="btn" onclick="window.print()">🖨 Print / Save as PDF</button>
    <button type="button" class="btn" id="fs-btn">⛶ Full Screen</button>
    <button type="button" class="btn" id="modeBtn">Dark mode</button>
  </div>
  <header class="top" id="top"></header>
  <main id="main">
    <section class="ann" id="ann" aria-labelledby="annTitle"></section>
    <div class="lineup" id="lineup"></div>
    <p class="pick-hint" id="pickHint"></p>
    <section class="panel" id="panel" aria-live="polite" hidden></section>
    <section class="adds" id="adds" aria-label="Dates at a glance"></section>
    <p class="fine" id="fine"></p>
  </main>
</div>

form=\"rotate(270 1060 140)\"/><line x1=\"1060\" y1=\"40\" x2=\"1060\" y2=\"0\" transform=\"rotate(300 1060 140)\"/><line x1=\"1060\" y1=\"40\" x2=\"1060\" y2=\"0\" transform=\"rotate(330 1060 140)\"/><\/g><\/g><circle cx=\"1060\" cy=\"140\" r=\"70\" fill=\"var(--t1)\"/><g fill=\"none\" stroke=\"var(--t2)\" stroke-width=\"3\"><path d=\"M0 700Q150 660 300 700T600 700T900 700T1200 700\"/><path d=\"M0 740Q150 700 300 740T600 740T900 740T1200 740\" opacity=\".6\"/><\/g><g fill=\"var(--t3)\"><path class=\"rise\" style=\"animation-delay:-0.0s\" d=\"M160 620l4 10 10 4-10 4-4 10-4-10-10-4 10-4z\"/><path class=\"rise\" style=\"animation-delay:-1.3s\" d=\"M380 650l4 10 10 4-10 4-4 10-4-10-10-4 10-4z\"/><path class=\"rise\" style=\"animation-delay:-2.6s\" d=\"M620 610l4 10 10 4-10 4-4 10-4-10-10-4 10-4z\"/><path class=\"rise\" style=\"animation-delay:-3.9s\" d=\"M840 640l4 10 10 4-10 4-4 10-4-10-10-4 10-4z\"/><path class=\"rise\" style=\"animation-delay:-5.2s\" d=\"M1000 600l4 10 10 4-10 4-4 10-4-10-10-4 10-4z\"/><\/g>"}}}</script>
<script>
const D = JSON.parse(document.getElementById('page-data').textContent);
const root = document.documentElement, $ = id => document.getElementById(id);
const el = (tag, attrs = {}, kids = []) => { const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (v == null || v === false) continue; if (k === 'text') n.textContent = v; else if (k === 'class') n.className = v; else n.setAttribute(k, v === true ? '' : v); }
  (Array.isArray(kids) ? kids : [kids]).forEach(c => c != null && n.append(c)); return n; };
const em = s => { const f = document.createDocumentFragment(); String(s || '').split(/(\*[^*]+\*)/).forEach(p => f.append(/^\*.+\*$/.test(p) ? el('em', { text: p.slice(1, -1) }) : p)); return f; };   // *text* → <em>

/* modes */
const framed = (() => { try { return window.top !== window; } catch (e) { return true; } })();
if (D.mode === 'announce') root.classList.add('announce', 'embed');
else if (/[?&]embed=1/.test(location.search) || framed) root.classList.add('embed');
document.title = D.page.title || 'Language Lab Events';

/* themes: CSS variables per event + one background layer per theme used */
const T = D.themes || {}, deco = $('deco');
const SEASON = (() => { const S = D.seasons || {}; const name = D.season || (S.months || {})[String(new Date().getMonth() + 1)]; return (S.themes || {})[name] || 'rings'; })();
const used = new Set([SEASON, ...D.events.map(e => e.theme)]);
let css = '';
for (const id of used) { const t = T[id]; if (!t) continue;
  deco.insertAdjacentHTML('beforeend', `<svg data-theme="${id}" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" style="--t1:${t.colors[0]};--t2:${t.colors[1]};--t3:${t.colors[2]}">${t.svg}</svg>`);
  css += `[data-theme-id="${id}"]{--card-accent:${t.accent};--card-accent-t:${t.text};}
@media (prefers-color-scheme:dark){:root:not([data-mode="light"]) [data-theme-id="${id}"]{--card-accent-t:${t.textDark};}}
:root[data-mode="dark"] [data-theme-id="${id}"]{--card-accent-t:${t.textDark};}
body[data-ev-theme="${id}"]{--accent-t:${t.text};--accent-bg:${t.accent};}
@media (prefers-color-scheme:dark){:root:not([data-mode="light"]) body[data-ev-theme="${id}"]{--accent-t:${t.textDark};}}
:root[data-mode="dark"] body[data-ev-theme="${id}"]{--accent-t:${t.textDark};}\n`; }
$('theme-css').textContent = css;
function showTheme(id) { document.body.dataset.evTheme = id || ''; if (!id) delete document.body.dataset.evTheme;
  const want = id || SEASON; deco.querySelectorAll('svg').forEach(s => { s.classList.toggle('on', s.dataset.theme === want); s.classList.toggle('season', !id && s.dataset.theme === want); }); }
showTheme(null);

/* header */
const P = D.page;
$('top').append(...[el('div', {}, [el('p', { class: 'kicker', text: P.kicker }), el('h1', {}, em(P.h1)), el('p', { class: 'lead', text: root.classList.contains('embed') ? (P.leadEmbed || P.lead) : P.lead })]),
  P.total ? el('div', { class: 'total', role: 'note', 'aria-label': 'What it is worth' }, [el('div', { class: 'n' }, [P.total.n, el('small', { text: P.total.unit })]), el('p', { text: P.total.text })]) : null].filter(Boolean));
if (D.mode === 'announce' && D.announce) { const A = D.announce;
  $('ann').append(el('p', { class: 'k', text: A.kicker }), el('h2', { id: 'annTitle' }, em(A.h2)), el('p', { text: A.text }),
    el('div', { class: 'row' }, (A.links || []).map(l => el('a', { href: l.url, target: '_blank', rel: 'noopener', text: l.label })))); }

/* details block, used on a card back and in the embed panel */
function details(e, withFlip) {
  return el('div', { class: 'det', 'data-theme-id': e.theme }, [
    e.tag ? el('span', { class: 'tag', text: e.tag }) : null,
    el('h2', { text: e.title, tabindex: '-1' }), el('p', { class: 'when', text: e.when }),
    el('ol', {}, (e.steps || []).map(s => el('li', { text: s }))),
    e.earn ? el('div', { class: 'earn' }, [el('span', { text: e.earn.label }), el('strong', { text: e.earn.value })]) : null,
    el('div', { class: 'actions' }, [e.action ? el('a', { class: 'btn solid', href: e.action.url, target: '_blank', rel: 'noopener', text: e.action.label }) : null,
      withFlip ? el('button', { type: 'button', class: 'btn flip-back', text: '↻ Flyer' }) : null])]);
}

/* lineup: label row, then card · join · card … ; "+" between groups, "or" inside a pick-one group */
const L = $('lineup'), cols = []; let col = 1;
D.groups.forEach((g, gi) => {
  if (gi > 0) { cols.push('auto'); const j = el('div', { class: 'join', 'aria-hidden': 'true' }, [el('b', { text: '+' }), el('span', { text: 'and' })]); j.style.gridColumn = col; j.style.gridRow = 2; L.append(j); col++; }
  const start = col, evs = g.events.map(id => D.events.find(e => e.id === id));
  const lab = el('p', { class: 'group-label' + (gi ? ' g2' : '') }, [el('span', { text: g.label }), el('span', { text: g.when || '' })]); L.append(lab);
  evs.forEach((e, i) => {
    if (i > 0) { cols.push('auto'); const j = el('div', { class: 'join', 'aria-hidden': 'true' }, [el('b', { text: g.pick === 'one' ? 'or' : '+' }), el('span', { text: g.pick === 'one' ? 'pick one' : 'and' })]); j.style.gridColumn = col; j.style.gridRow = 2; L.append(j); col++; }
    cols.push('minmax(0,1fr)');
    const front = el('button', { type: 'button', class: 'face front', 'aria-expanded': 'false', 'aria-controls': 'b-' + e.id },
      [e.flyer ? el('img', { src: e.flyer.src, alt: e.flyer.alt }) : el('span', { class: 'ph', text: e.title }), el('span', { class: 'flip-hint' }, [el('span', { text: e.short || e.title }), el('span', { text: root.classList.contains('embed') ? 'Details ↓' : 'Flip ↻' })])]);
    const back = el('section', { class: 'face back', id: 'b-' + e.id, 'aria-label': e.title }, details(e, true));
    const card = el('div', { class: 'card', id: 'c-' + e.id, 'data-theme-id': e.theme, 'data-ev': e.id }, el('div', { class: 'card-inner' }, [front, back]));
    card.style.gridColumn = col; card.style.gridRow = 2; card.style.setProperty('--col', col); L.append(card); col++;
  });
  lab.style.gridColumn = `${start} / ${col}`; lab.style.gridRow = 1;
});
L.style.gridTemplateColumns = cols.join(' ');
$('pickHint').textContent = P.pickHint || 'Tap a flyer to see the details.';

/* fit (full page, ≥ 900 × 600): size the cards so the whole page fits one screen */
function fit() {
  const on = !root.classList.contains('embed') && innerWidth >= 900 && innerHeight >= 600;
  root.classList.toggle('fit', on);
  if (!on) { L.style.gridTemplateColumns = cols.join(' '); L.style.removeProperty('--cardh'); document.querySelectorAll('.card-inner').forEach(c => c.style.removeProperty('--cardh')); return; }
  const n = cols.filter(c => c.startsWith('minmax')).length, joins = cols.length - n, labH = 34, band = 70;
  const H = L.getBoundingClientRect().height, W = L.getBoundingClientRect().width;
  const w = Math.max(160, Math.min((W - joins * 64 - (cols.length - 1) * 16) / n, (H - labH - 10 - band) / 1.25));
  /* the open card widens into the spare width, so its details fit without scrolling */
  const open1 = document.querySelector('.card.flipped'), spare = W - (n * w + joins * 64 + (cols.length - 1) * 16);
  const wide = open1 ? Math.min(w * 2.3, w + Math.max(0, spare)) : w; let k = -1;
  L.style.gridTemplateColumns = cols.map(c => { if (!c.startsWith('minmax')) return c; k++; const card = document.querySelectorAll('.lineup > .card')[k]; return (card === open1 ? wide : w) + 'px'; }).join(' ');
  document.querySelectorAll('.card-inner').forEach(c => c.style.setProperty('--cardh', Math.round(w * 1.25 + band) + 'px'));
}
fit(); addEventListener('resize', fit); addEventListener('load', fit);
/* embed/announce: start with the first event open, so a fixed-height frame is never half empty */
if (root.classList.contains('embed')) { const first = document.querySelector('.lineup .card'); if (first) open(first); }

/* dates at a glance + fine print */
(D.timeline || []).forEach(t => $('adds').append(el('div', {}, [el('div', { class: 'd', text: t.d }), el('div', { class: 't' }, em(t.t)), el('p', { text: t.p })])));
if (!(D.timeline || []).length) $('adds').remove();
(P.fine || []).forEach(f => $('fine').append(f.url ? el('a', { href: f.url, target: '_blank', rel: 'noopener', text: f.label }) : el('span', { text: f.label })));

/* behaviour: page = flip cards; embed/announce = one details panel */
const NAME = id => D.events.find(e => e.id === id).title;
function open(card) {
  const emb = root.classList.contains('embed'), e = D.events.find(x => x.id === card.dataset.ev);
  document.querySelectorAll('.card.flipped').forEach(c => { if (c !== card) close(c, true); });
  card.classList.add('flipped'); const front = card.querySelector('.front'), back = card.querySelector('.back');
  front.setAttribute('aria-expanded', 'true'); showTheme(e.theme); $('live').textContent = e.title + ': details shown';
  if (emb) { const p = $('panel'); p.replaceChildren(details(e, false)); p.dataset.themeId = e.theme; p.hidden = false; $('pickHint').hidden = true; }
  else { back.inert = false; front.inert = true; fit(); setTimeout(() => back.querySelector('h2').focus({ preventScroll: true }), 250); }
}
function close(card, quiet) {
  card.classList.remove('flipped'); const front = card.querySelector('.front'), back = card.querySelector('.back');
  front.setAttribute('aria-expanded', 'false'); back.inert = true; front.inert = false; if (!quiet && typeof fit === 'function') fit();
  if (!quiet) { const any = document.querySelector('.card.flipped'); showTheme(any ? any.dataset.themeId : null); setTimeout(() => front.focus({ preventScroll: true }), 250); }
}
document.querySelectorAll('.card').forEach(card => {
  card.querySelector('.back').inert = true;
  card.querySelector('.front').addEventListener('click', () => card.classList.contains('flipped') && root.classList.contains('embed') ? null : open(card));
  card.querySelector('.flip-back').addEventListener('click', () => close(card));
  card.addEventListener('mouseenter', () => { if (!document.querySelector('.card.flipped')) showTheme(card.dataset.themeId); });
  card.addEventListener('mouseleave', () => { if (!document.querySelector('.card.flipped')) showTheme(null); });
  card.addEventListener('focusin', () => { if (!document.querySelector('.card.flipped')) showTheme(card.dataset.themeId); });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !root.classList.contains('embed')) { const c = document.querySelector('.card.flipped'); if (c) close(c); } });
addEventListener('beforeprint', () => document.querySelectorAll('.back').forEach(b => b.inert = false));

/* toolbar */
function setMode(m) { root.dataset.mode = m; $('modeBtn').textContent = m === 'dark' ? 'Light mode' : 'Dark mode'; }
$('modeBtn').onclick = () => setMode(root.dataset.mode === 'dark' ? 'light' : 'dark');
setMode(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
$('fs-btn').onclick = () => { if (document.fullscreenElement) { document.exitFullscreen(); return; }
  if (document.fullscreenEnabled) root.requestFullscreen().catch(() => window.open(location.href, '_blank')); else window.open(location.href, '_blank'); };
document.addEventListener('fullscreenchange', () => { $('fs-btn').textContent = document.fullscreenElement ? '⛶ Exit Full Screen' : '⛶ Full Screen'; });

/* announce: framed from a D2L News item on the same site → size the frame to the content */
(function () { let fe = null; try { fe = window.frameElement; } catch (e) {} if (!fe) return;
  const fit = () => { const h = Math.ceil(document.querySelector('.wrap').getBoundingClientRect().bottom) + 12; fe.style.height = h + 'px'; fe.setAttribute('height', h); };
  addEventListener('load', fit); addEventListener('resize', fit); new ResizeObserver(fit).observe(document.body); document.addEventListener('click', () => setTimeout(fit, 60)); })();
</script>
</body>
