a wrapping grid, never a sideways scroller */\n.rail { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }\n.rail li { min-width: 0; }\n.rail button { width: 100%; height: 100%; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; color: var(--ink); font: inherit; }\n.rail button[aria-current=\"true\"] { border: 2px solid var(--navy); padding: 9px 11px; background: var(--today); }\n.rail .rd { grid-row: span 2; text-align: center; font: 700 1.35rem/1 var(--serif); }\n.rail .rd small { display: block; font: 700 .72rem var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }\n.rail .rt { font-weight: 700; font-size: .92rem; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }\n.rail .rm { font-size: .82rem; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }\n.rail .campus { font-size: .74rem; padding: 1px 7px; }\n\n.empty { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 40px 24px; text-align: center; }\n.empty h2 { margin: 0 0 6px; font: 700 1.4rem var(--serif); }\n.empty p { margin: 0; color: var(--muted); }\nfooter { max-width: 1120px; margin: 0 auto; padding: 0 16px 28px; color: var(--muted); font-size: .85rem; }\n\n@media (max-width: 820px) {\n  .stage { grid-template-columns: 1fr; }\n  .stage > .nav { display: none; }\n  .slide { grid-template-columns: 1fr; min-height: 0; }\n  .flyer { border-right: 0; border-bottom: 1px solid var(--border); }\n  .flyer object { height: 420px; }\n  .info { padding: 20px 18px; }\n  .mobile-nav { display: flex !important; }\n}\n/* wide screens: all slides share one grid cell, so every card is as tall as the tallest and nothing jumps between events */\n@media (min-width: 821px) {\n  #slides { display: grid; }\n  #slides > .slide { grid-area: 1 / 1; }\n  .slide.is-hidden { display: grid; visibility: hidden; }\n}\n.mobile-nav { display: none; justify-content: space-between; align-items: center; gap: 12px; }\n.mobile-nav span { font-size: .9rem; color: var(--muted); }\n@media (prefers-reduced-motion: no-preference) { .slide:not(.is-hidden) { animation: in .22s ease-out; } @keyframes in { from { opacity: .4; } to { opacity: 1; } } }\n\n/* full screen (lab display): slim masthead, one slide sized to the screen, flyer scaled to fit; rail and footer drop out */\n@media (min-width: 821px) {\n  :root.fs body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }\n  /* the top bar keeps its normal look (px, so it doesn't grow with the fitted text below) */\n  :root.fs .mast-in { max-width: none; padding: 8px 20px; align-items: center; }\n  :root.fs .mast h1 { font-size: 28px; }\n  :root.fs .mast p { display: none; }\n  :root.fs .page-toolbar { gap: 8px; }\n  :root.fs .page-toolbar button { min-height: 44px; padding: 0 14px; font-size: 14.4px; }\n  :root.fs .wrap { flex: 1; min-height: 0; width: 100%; max-width: none; padding: 12px 20px; grid-template-rows: auto minmax(0, 1fr); gap: 12px; }\n  :root.fs .filters:empty { display: none; }\n  :root.fs .wrap:has(.filters:empty) { grid-template-rows: minmax(0, 1fr); }\n  :root.fs .rail-wrap, :root.fs footer, :root.fs .sr { display: none !important; }\n  :root.fs #carousel, :root.fs .stage, :root.fs #slides { height: 100%; min-height: 0; }\n  :root.fs .slide { height: 100%; min-height: 0; }\n  :root.fs .flyer { position: relative; min-height: 0; }\n  :root.fs .flyer img, :root.fs .flyer canvas { position: absolute; inset: 14px; width: calc(100% - 28px) !important; height: calc(100% - 28px); max-height: none; object-fit: contain; box-shadow: none; background: transparent; }\n  :root.fs .flyer object { height: 100%; }\n  :root.fs .flyer .ph { position: absolute; top: 14px; bottom: 14px; left: 50%; transform: translateX(-50%); height: auto; width: auto; max-width: calc(100% - 28px); overflow: hidden; }\n  :root.fs .info { overflow-y: auto; }\n}\n\n@page { size: letter; margin: 0.65in; }\n@media print {\n  .no-print, .page-toolbar, .skip { display: none !important; }\n  :root { --bg: #fff; --surface: #fff; --ink: #000; --muted: #333; --today: #fff; }\n  body { background: #fff !important; color: #000 !important; }\n  .mast { background: #fff !important; color: #000 !important; border-bottom: 2px solid #000; }\n  .mast p { color: #333 !important; }\n  .wrap { max-width: 100% !important; margin: 0 !important; padding: 0 !important; }\n  * { box-shadow: none !important; text-shadow: none !important; }\n  .stage { display: block; }\n  #slides { display: block !important; }\n  .slide, .slide.is-hidden { visibility: visible !important; display: grid !important; grid-template-columns: 2.6in 1fr; min-height: 0; margin-bottom: .25in; break-inside: avoid; page-break-inside: avoid; border: 1px solid #999; }\n  .flyer img, .flyer canvas { max-height: 3.4in; }\n  .flyer object { display: none; }\n  details.mp { display: block; } details.mp .body { display: block; }\n  h1, h2, h3 { break-after: avoid; page-break-after: avoid; }\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003ca class=\"skip\" href=\"#main\">Skip to events\u003c/a>\n\u003cheader class=\"mast\">\n  \u003cdiv class=\"mast-in\">\n    \u003cdiv>\n      \u003ch1>Language Lab Events\u003c/h1>\n      \u003cp id=\"sub\">Upcoming events across UNG campuses\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"page-toolbar no-print\">\n      \u003cbutton type=\"button\" id=\"mode-btn\" onclick=\"toggleMode()\">Dark mode\u003c/button>\n      \u003cbutton type=\"button\" onclick=\"printAll()\">🖨 Print / Save as PDF\u003c/button>\n      \u003cbutton type=\"button\" id=\"fs-btn\" onclick=\"toggleFS()\">⛶ Full Screen\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/header>\n\n\u003cmain id=\"main\" class=\"wrap\" tabindex=\"-1\">\n  \u003cdiv class=\"filters no-print\" id=\"filters\" role=\"group\" aria-label=\"Show events for\">\u003c/div>\n  \u003csection aria-roledescription=\"carousel\" aria-label=\"Upcoming events\" id=\"carousel\">\n    \u003cdiv class=\"stage\">\n      \u003cbutton class=\"nav no-print\" id=\"prev\" type=\"button\" aria-label=\"Previous event\">‹\u003c/button>\n      \u003cdiv id=\"slides\">\u003c/div>\n      \u003cbutton class=\"nav no-print\" id=\"next\" type=\"button\" aria-label=\"Next event\">›\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"mobile-nav no-print\">\n      \u003cbutton class=\"nav\" id=\"prev-m\" type=\"button\" aria-label=\"Previous event\">‹\u003c/button>\n      \u003cspan id=\"count-m\">\u003c/span>\n      \u003cbutton class=\"nav\" id=\"next-m\" type=\"button\" aria-label=\"Next event\">›\u003c/button>\n    \u003c/div>\n  \u003c/section>\n  \u003csection class=\"rail-wrap no-print\" aria-labelledby=\"rail-h\" id=\"rail-wrap\">\n    \u003cdiv class=\"rail-head\">\u003ch2 id=\"rail-h\">All upcoming events\u003c/h2>\u003cspan id=\"count\">\u003c/span>\u003c/div>\n    \u003col class=\"rail\" id=\"rail\">\u003c/ol>\n  \u003c/section>\n  \u003cp class=\"sr\" aria-live=\"polite\" id=\"live\">\u003c/p>\n\u003c/main>\n\u003cfooter id=\"foot\">Past events drop off this page automatically.\u003c/footer>\n\n\u003cscript>\n/* Data lives next to the flyers. Relative paths only (Decision 0010); first one that loads wins. */\nconst DATA_PATHS = ['../current/events.json', './events.json', '../../events/current/events.json'];\nconst FLYER_EXTS = ['.pdf', '.jpg', '.jpeg', '.png', '.webp', '.avif', '.gif'];\nconst PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';\nconst params = new URLSearchParams(location.search);\n/* Preview hook: the Event Planner injects window.__LAB_PREVIEW__ = { doc, files, today, open, mode } so this page renders unsaved data. */\nconst PV = window.__LAB_PREVIEW__ || null;\nconst TODAY = PV?.today || params.get('today');\nconst NOW = TODAY ? new Date(TODAY + 'T08:00') : new Date();\n\nlet DATA = null, BASE = '', ALL = [], LIST = [], idx = 0, campusFilter = params.get('campus') || 'all';\nconst $ = id => document.getElementById(id);\nconst esc = s => String(s ?? '').replace(/[&\u003c>\"']/g, c => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\n\n/* ---------- mode + fullscreen (bulletin-board pattern) ---------- */\nfunction setMode(m) { document.documentElement.dataset.mode = m; $('mode-btn').textContent = m === 'dark' ? 'Light mode' : 'Dark mode'; try { localStorage.setItem('labEventsMode', m); } catch (e) {} }\nfunction toggleMode() { setMode(document.documentElement.dataset.mode === 'dark' ? 'light' : 'dark'); }\n(() => { let m = PV?.mode || null; if (!m) { try { m = localStorage.getItem('labEventsMode'); } catch (e) {} } setMode(m || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')); })();\n/* Full screen (2026-10-29). Three places this page runs:\n   - its own tab: the button goes full screen;\n   - a frame the Event Planner made (Preview, or the exported carousel file): the hosting frame goes full screen, so it stays\n     full screen through \"See details\" and \"Back\";\n   - D2L's frame, which can't go full screen: the same page opens in its own tab (if pop-ups are blocked, it fills the frame).\n   A page built in memory is never copied into a new tab: the copy would lose the Planner's data. */\nlet filled = false;\nfunction hostFrame() { try { return window.frameElement; } catch (e) { return null; } }\nfunction fsEl() { const fe = hostFrame(); try { if (fe && fe.ownerDocument.fullscreenElement === fe) return fe; } catch (e) {} return document.fullscreenElement; }\nconst inMemory = () => !/^(https?|file):/.test(location.protocol);\nfunction fillFrame() { filled = true; syncFS(); }\nfunction openFull() {\n  const fe = hostFrame();\n  if (fe && fe.ownerDocument.fullscreenEnabled) { fe.requestFullscreen().catch(fillFrame); return; }\n  if (inMemory() || !window.open(location.href, '_blank')) fillFrame();\n}\nfunction toggleFS() {\n  const el = fsEl(); if (el) { el.ownerDocument.exitFullscreen(); return; }\n  if (filled) { filled = false; syncFS(); return; }\n  const fe = hostFrame();\n  if (fe && fe.ownerDocument.fullscreenEnabled) { openFull(); return; }\n  if (document.fullscreenEnabled) document.documentElement.requestFullscreen().catch(openFull); else openFull();\n}\naddEventListener('DOMContentLoaded', () => { const b = document.getElementById('fs-btn'), fe = hostFrame();\n  if (b && !document.fullscreenEnabled && !(fe && fe.ownerDocument.fullscreenEnabled) && !inMemory()) { b.textContent = '⛶ Full Screen (new tab)'; b.title = 'This frame cannot go full screen, so the page opens in its own tab'; } });\n/* full screen = the Full Screen button, or the browser's own (F11), which doesn't fire fullscreenchange */\nfunction isFS() { return !!fsEl() || filled || matchMedia('(display-mode: fullscreen)').matches\n  || (window === top && innerHeight >= screen.height - 1 && innerWidth >= screen.width - 1); }\nfunction syncFS() { const on = isFS(); document.documentElement.classList.toggle('fs', on);\n  const b = $('fs-btn'); if (b && (fsEl() || filled || b.textContent.includes('Exit'))) b.textContent = fsEl() || filled ? '⛶ Exit Full Screen' : '⛶ Full Screen'; fitFS(); }\n/* full screen: grow the whole page's text (everything is rem-sized) to the largest size at which EVERY event's details still fit\n   on screen, so the cards fill the display and the size doesn't jump between events */\nfunction fitFS() {\n  const r = document.documentElement;\n  r.style.fontSize = '';\n  if (!r.classList.contains('fs') || innerWidth \u003c= 820 || !LIST.length) return;\n  const slides = [...document.querySelectorAll('.slide')];\n  const fits = px => { r.style.fontSize = px + 'px';\n    return slides.every(s => { const i = s.querySelector('.info'); return i.scrollHeight \u003c= i.clientHeight + 1; }); };\n  let lo = 16, hi = 24; // at most 1.5x normal, so buttons and text keep their usual proportions\n  if (!fits(lo)) { r.style.fontSize = ''; return; }\n  while (hi - lo > 0.5) { const m = (lo + hi) / 2; if (fits(m)) lo = m; else hi = m; }\n  fits(Math.floor(lo * 2) / 2);\n}\nlet fitT = null;\naddEventListener('resize', () => { clearTimeout(fitT); fitT = setTimeout(syncFS, 150); });\ndocument.addEventListener('fullscreenchange', () => { requestAnimationFrame(syncFS); });\n(() => { const fe = hostFrame(); if (fe) fe.ownerDocument.addEventListener('fullscreenchange', () => requestAnimationFrame(syncFS)); })();\n/* print: every slide prints, so load every flyer first (hidden slides' flyers are lazy and would print blank) */\nfunction loadAllFlyers() { document.querySelectorAll('.flyer img[loading=\"lazy\"]').forEach(i => i.loading = 'eager'); }\nasync function printAll() {\n  loadAllFlyers();\n  await Promise.race([Promise.all([...document.querySelectorAll('.flyer img')].map(i => i.decode().catch(() => {}))), new Promise(r => setTimeout(r, 4000))]);\n  window.print();\n}\nwindow.addEventListener('beforeprint', loadAllFlyers);\n\n/* ---------- dates ---------- */\nconst at = (d, t) => new Date(`${d}T${t || '00:00'}`);\nconst endOf = e => e.end ? at(e.date, e.end) : at(e.date, '23:59');\nconst fmtTime = t => { if (!t) return ''; const [h, m] = t.split(':').map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${h \u003c 12 ? 'AM' : 'PM'}`; };\nconst fmtDate = d => at(d).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });\n/* deadlines: optional time; a date with no time means the end of that day */\nconst byWhen = (d, t) => at(d).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) + (t ? ', ' + fmtTime(t) : '');\nconst passed = (d, t) => !!d && NOW > at(d, t || '23:59');\nfunction when(e) {\n  const s = at(e.date, e.start), en = endOf(e);\n  if (NOW >= s && NOW \u003c= en) return { txt: 'Happening now', cls: 'now' };\n  const days = Math.round((at(e.date) - at(NOW.toISOString().slice(0, 10))) / 864e5);\n  if (days \u003c= 0) return { txt: 'Today', cls: 'now' };\n  if (days === 1) return { txt: 'Tomorrow', cls: '' };\n  return { txt: `In ${days} days`, cls: '' };\n}\nconst campusName = code => (DATA.campuses || []).find(c => c.code === code)?.name || code;\n\n/* ---------- flyers: exact name first, then the same base with other extensions (bulletin-board fallback idea) ---------- */\nasync function resolveFlyer(name) {\n  if (!name) return null;\n  if (PV) return PV.files[name] || null;\n  const base = name.replace(/\\.[a-z0-9]+$/i, '');\n  const tries = [name, ...FLYER_EXTS.map(x => base + x).filter(n => n !== name)];\n  for (const n of tries) {\n    try { const r = await fetch(BASE + n, { method: 'HEAD', cache: 'no-store' }); if (r.ok) return BASE + n; } catch (e) { return BASE + name; }\n  }\n  return null;\n}\nlet pdfReady = null;\nfunction loadPdfJs() {\n  if (pdfReady) return pdfReady;\n  pdfReady = new Promise((res, rej) => {\n    const s = document.createElement('script'); s.src = PDFJS + 'pdf.min.js';\n    s.onload = () => { try { pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; res(pdfjsLib); } catch (e) { rej(e); } };\n    s.onerror = rej; document.head.appendChild(s);\n  });\n  return pdfReady;\n}\nasync function drawFlyer(e, box) {\n  const url = await resolveFlyer(e.flyer);\n  const alt = e.flyer_alt || `Flyer for ${e.title}`;\n  if (!url) { box.innerHTML = placeholder(e); return; }\n  const open = box.closest('.slide').querySelector('[data-open]');\n  if (open) { open.href = url; open.hidden = false; }\n  const isPdf = PV ? /\\.pdf$/i.test(e.flyer) : /\\.pdf$/i.test(url);\n  if (!isPdf) { box.innerHTML = `\u003cimg src=\"${esc(url)}\" alt=\"${esc(alt)}\" loading=\"lazy\">`; box.querySelector('img').onerror = () => { box.innerHTML = placeholder(e); }; return; }\n  try {\n    const lib = await loadPdfJs();\n    const pdf = await lib.getDocument(url).promise;\n    const page = await pdf.getPage(1);\n    const w = Math.min((box.clientWidth || 556) - 36, 520); // hidden slides measure 0 wide\n    const v1 = page.getViewport({ scale: 1 });\n    const scale = (w / v1.width) * (window.devicePixelRatio || 1);\n    const vp = page.getViewport({ scale });\n    const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height; c.style.width = (vp.width / (window.devicePixelRatio || 1)) + 'px';\n    c.setAttribute('role', 'img'); c.setAttribute('aria-label', alt);\n    await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;\n    box.innerHTML = ''; box.appendChild(c);\n  } catch (err) {\n    box.innerHTML = `\u003cobject data=\"${esc(url)}\" type=\"application/pdf\" aria-label=\"${esc(alt)}\">${placeholder(e)}\u003c/object>`;\n  }\n}\nfunction placeholder(e) {\n  return `\u003cdiv class=\"ph\" role=\"img\" aria-label=\"${esc(e.title)}, ${esc(fmtDate(e.date))}\">\u003cspan class=\"k\">${esc(campusName(e.campus))} · Language Lab\u003c/span>\u003cspan class=\"t\">${esc(e.title)}\u003c/span>\u003cspan>\u003cspan class=\"d\">${esc(at(e.date).toLocaleDateString('en-US', { month: 'long', day: 'numeric' }))} · ${esc(fmtTime(e.start))}\u003c/span>\u003cbr>\u003cspan class=\"note\">Flyer coming soon\u003c/span>\u003c/span>\u003c/div>`;\n}\n\n/* ---------- calendar file ---------- */\nfunction ics(e) {\n  const d = e.date.replace(/-/g, ''), t = x => (x || '00:00').replace(':', '') + '00';\n  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//UNG Language Lab//Events//EN', 'BEGIN:VEVENT',\n    `UID:${e.id}@ung-language-lab`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`,\n    `DTSTART:${d}T${t(e.start)}`, `DTEND:${d}T${t(e.end || e.start)}`,\n    `SUMMARY:${(e.title || '').replace(/[,;]/g, '\\\\$&')}`, `LOCATION:${(e.location || '').replace(/[,;]/g, '\\\\$&')}`,\n    `DESCRIPTION:${(e.summary || '').replace(/[,;]/g, '\\\\$&').replace(/\\n/g, '\\\\n')}`, 'END:VEVENT', 'END:VCALENDAR'];\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(new Blob([lines.join('\\r\\n')], { type: 'text/calendar' }));\n  a.download = `${e.id}.ics`; document.body.appendChild(a); a.click(); a.remove();\n}\n\n/* ---------- render ---------- */\nfunction slideHTML(e, i) {\n  const w = when(e), d = at(e.date);\n  const facts = [\n    ['When', `${esc(fmtDate(e.date))}\u003cbr>${esc(fmtTime(e.start))}${e.end ? ' – ' + esc(fmtTime(e.end)) : ''}`],\n    ['Where', `${esc(e.location || 'Location to be announced')}`],\n    ['Campus', `\u003cspan class=\"campus\" data-c=\"${esc(e.campus)}\">${esc(campusName(e.campus))}\u003c/span>`],\n    e.entry?.url && e.entry.deadline ? ['Enter by', esc(byWhen(e.entry.deadline, e.entry.deadline_time))] : null,\n    e.mini_project?.due ? ['Turn in by', esc(byWhen(e.mini_project.due, e.mini_project.due_time))] : null,\n    e.languages?.length ? ['Languages', esc(e.languages.join(', '))] : null,\n    e.partners?.length ? ['With', esc(e.partners.join(', '))] : null,\n  ].filter(Boolean).map(([k, v]) => `\u003cdt>${k}\u003c/dt>\u003cdd>${v}\u003c/dd>`).join('');\n  const badges = [e.prizes?.length || e.prizes_note ? '\u003cspan class=\"badge\">🏆 Prizes\u003c/span>' : '', e.rubric ? '\u003cspan class=\"badge\">Judged competition\u003c/span>' : ''].join('');\n  const ec = e.extra_credit?.offered ? `\u003cdiv class=\"ec\">\u003cb>✓ Extra credit\u003c/b>\u003cspan>${esc(e.extra_credit.note || '')}\u003c/span>\u003c/div>` : '';\n  const mp = e.mini_project?.title ? `\u003cdetails class=\"mp\">\u003csummary>Mini-project: ${esc(e.mini_project.title)}${e.mini_project.title_es && e.mini_project.title_es !== e.mini_project.title ? ` \u003cspan lang=\"es\" style=\"font-weight:400;margin-left:6px\">(${esc(e.mini_project.title_es)})\u003c/span>` : ''}\u003c/summary>\u003cdiv class=\"body\">\n      ${e.mini_project.steps?.length ? `\u003col>${e.mini_project.steps.map(s => `\u003cli>${esc(s)}\u003c/li>`).join('')}\u003c/ol>` : ''}\n      ${e.mini_project.deliverable ? `\u003cp>\u003cb>Turn in:\u003c/b> ${esc(e.mini_project.deliverable)}\u003c/p>` : ''}\n      ${e.mini_project.submit ? `\u003cp>\u003cb>Submit:\u003c/b> ${esc(e.mini_project.submit)}\u003c/p>` : ''}\n      ${e.mini_project.due ? `\u003cp>\u003cb>Turn in by:\u003c/b> ${esc(byWhen(e.mini_project.due, e.mini_project.due_time))}\u003c/p>` : ''}\u003c/div>\u003c/details>` : '';\n  const hasMore = (e.prizes?.length || e.prizes_note || e.rules?.length || e.rubric || e.activities?.length);\n  const moreLabel = [e.prizes?.length || e.prizes_note ? 'prizes' : '', e.rules?.length || e.rubric ? 'rules' : '', e.rubric ? 'rubric' : ''].filter(Boolean);\n  const more = hasMore ? `\u003ca class=\"btn primary\" href=\"event-details.html?ev=${encodeURIComponent(e.id)}\" data-details=\"${esc(e.id)}\">${moreLabel.length ? 'See ' + esc(moreLabel.join(', ').replace(/, ([^,]*)$/, ' & $1')) : 'See details'} →\u003c/a>` : '';\n  const entry = !e.entry?.url ? '' : passed(e.entry.deadline, e.entry.deadline_time) ? `\u003cspan class=\"btn secondary\" aria-disabled=\"true\" style=\"opacity:.6;cursor:default\">Entries closed\u003c/span>` : `\u003ca class=\"btn secondary\" href=\"${esc(e.entry.url)}\" target=\"_blank\" rel=\"noopener\">${esc(e.entry.label || 'Enter')}\u003c/a>`;\n  const link = e.link?.url ? `\u003ca class=\"btn secondary\" href=\"${esc(e.link.url)}\" target=\"_blank\" rel=\"noopener\">${esc(e.link.label || 'More info')}\u003c/a>` : '';\n  return `\u003carticle class=\"slide${i === idx ? '' : ' is-hidden'}\" id=\"ev-${esc(e.id)}\" role=\"group\" aria-roledescription=\"slide\" aria-label=\"${i + 1} of ${LIST.length}: ${esc(e.title)}\">\n    \u003cdiv class=\"flyer\" data-flyer=\"${i}\">${placeholder(e)}\u003c/div>\n    \u003cdiv class=\"info\">\n      \u003cdiv class=\"toprow\">\n        \u003cdiv class=\"tile\" aria-hidden=\"true\">\u003cdiv class=\"m\">${d.toLocaleDateString('en-US', { month: 'short' })}\u003c/div>\u003cdiv class=\"dd\">${d.getDate()}\u003c/div>\u003cdiv class=\"w\">${d.toLocaleDateString('en-US', { weekday: 'short' })}\u003c/div>\u003c/div>\n        \u003cdiv>\n          \u003cspan class=\"status ${w.cls}\">${i === 0 && w.cls !== 'now' ? 'Next up · ' : ''}${w.txt}\u003c/span>\n          \u003ch2>${esc(e.title)}\u003c/h2>\n          ${e.title_alt ? `\u003cp class=\"alt\" lang=\"${esc(e.title_alt_lang || '')}\">${esc(e.title_alt)}\u003c/p>` : ''}\n          ${badges ? `\u003cdiv class=\"badges\">${badges}\u003c/div>` : ''}\n        \u003c/div>\n      \u003c/div>\n      \u003cdl class=\"facts\">${facts}\u003c/dl>\n      ${e.summary ? `\u003cp class=\"summary\">${esc(e.summary)}\u003c/p>` : ''}\n      ${e.details ? `\u003cp class=\"summary\">${esc(e.details)}\u003c/p>` : ''}\n      ${ec}${mp}\n      \u003cdiv class=\"actions no-print\">\n        ${more}${entry}\n        \u003cbutton class=\"btn ${hasMore ? 'secondary' : 'primary'}\" type=\"button\" data-ics=\"${i}\">Add to my calendar\u003c/button>\n        \u003ca class=\"btn secondary\" data-open hidden target=\"_blank\" rel=\"noopener\">Open flyer\u003c/a>\n        ${link}\n      \u003c/div>\n    \u003c/div>\n  \u003c/article>`;\n}\n\nfunction render() {\n  LIST = ALL.filter(e => campusFilter === 'all' || e.campus === campusFilter);\n  if (idx >= LIST.length) idx = 0;\n  const counts = {}; ALL.forEach(e => counts[e.campus] = (counts[e.campus] || 0) + 1);\n  const codes = Object.keys(counts);\n  $('filters').innerHTML = codes.length > 1 || campusFilter !== 'all'\n    ? `\u003cspan class=\"lbl\">Campus\u003c/span>\u003cbutton class=\"chip\" type=\"button\" data-c=\"all\" aria-pressed=\"${campusFilter === 'all'}\">All campuses \u003cspan class=\"n\">${ALL.length}\u003c/span>\u003c/button>` +\n      codes.map(c => `\u003cbutton class=\"chip\" type=\"button\" data-c=\"${esc(c)}\" aria-pressed=\"${campusFilter === c}\">${esc(campusName(c))} \u003cspan class=\"n\">${counts[c]}\u003c/span>\u003c/button>`).join('')\n    : '';\n  if (!LIST.length) {\n    $('slides').innerHTML = `\u003cdiv class=\"empty\">\u003ch2>No upcoming events right now\u003c/h2>\u003cp>New events are added through the semester. Check back soon, or ask at the Language Lab front desk.\u003c/p>\u003c/div>`;\n    $('rail-wrap').hidden = true; ['prev', 'next', 'prev-m', 'next-m'].forEach(id => $(id).disabled = true); $('count-m').textContent = '';\n    return;\n  }\n  $('rail-wrap').hidden = LIST.length \u003c 2;\n  $('slides').innerHTML = LIST.map(slideHTML).join('');\n  $('rail').innerHTML = LIST.map((e, i) => { const d = at(e.date); return `\u003cli>\u003cbutton type=\"button\" data-go=\"${i}\" aria-current=\"${i === idx}\" aria-label=\"${esc(e.title)}, ${esc(fmtDate(e.date))}, ${esc(campusName(e.campus))}\">\n      \u003cspan class=\"rd\">\u003csmall>${d.toLocaleDateString('en-US', { month: 'short' })}\u003c/small>${d.getDate()}\u003c/span>\n      \u003cspan class=\"rt\">${esc(e.title)}\u003c/span>\n      \u003cspan class=\"rm\">\u003cspan class=\"campus\" data-c=\"${esc(e.campus)}\">${esc(e.campus.toUpperCase())}\u003c/span>${esc(fmtTime(e.start))}\u003c/span>\u003c/button>\u003c/li>`; }).join('');\n  $('count').textContent = `${LIST.length} event${LIST.length === 1 ? '' : 's'}`;\n  document.querySelectorAll('[data-flyer]').forEach(box => drawFlyer(LIST[+box.dataset.flyer], box));\n  syncFS();\n  setTimeout(loadAllFlyers, 1500); // the shown flyer first, then the rest quietly (ready for › and for Ctrl+P)\n  go(idx, false);\n}\n\nfunction go(i, announce = true) {\n  if (!LIST.length) return;\n  idx = Math.max(0, Math.min(LIST.length - 1, i));\n  document.querySelectorAll('.slide').forEach((s, k) => s.classList.toggle('is-hidden', k !== idx));\n  document.querySelectorAll('#rail button').forEach((b, k) => b.setAttribute('aria-current', k === idx));\n  ['prev', 'prev-m'].forEach(id => $(id).disabled = idx === 0);\n  ['next', 'next-m'].forEach(id => $(id).disabled = idx === LIST.length - 1);\n  $('count-m').textContent = `${idx + 1} of ${LIST.length}`;\n  if (announce) { const e = LIST[idx]; $('live').textContent = `Event ${idx + 1} of ${LIST.length}: ${e.title}, ${fmtDate(e.date)}.`; }\n}\n\ndocument.addEventListener('click', ev => {\n  const d = ev.target.closest('[data-details]');\n  if (d && PV) { ev.preventDefault(); PV.open('details', d.dataset.details); return; }\n  const t = ev.target.closest('button'); if (!t) return;\n  if (t.id === 'prev' || t.id === 'prev-m') go(idx - 1);\n  else if (t.id === 'next' || t.id === 'next-m') go(idx + 1);\n  else if (t.dataset.go) { go(+t.dataset.go); if (t.closest('#rail')) { const s = $('carousel'); if (s.getBoundingClientRect().top \u003c 0) s.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); } }\n  else if (t.dataset.ics) ics(LIST[+t.dataset.ics]);\n  else if (t.dataset.c) { campusFilter = t.dataset.c; idx = 0; render(); }\n});\n$('carousel').addEventListener('keydown', ev => {\n  if (ev.target.closest('input, textarea, summary')) return;\n  if (ev.key === 'ArrowLeft') { ev.preventDefault(); go(idx - 1); }\n  if (ev.key === 'ArrowRight') { ev.preventDefault(); go(idx + 1); }\n});\nlet tx = null;\n$('slides').addEventListener('touchstart', ev => { tx = ev.touches[0].clientX; }, { passive: true });\n$('slides').addEventListener('touchend', ev => { if (tx == null) return; const dx = ev.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) go(idx + (dx \u003c 0 ? 1 : -1)); tx = null; });\n\n/* ---------- load ---------- */\n(async () => {\n  if (PV) DATA = PV.doc;\n  else for (const p of DATA_PATHS) {\n    try { const r = await fetch(p, { cache: 'no-store' }); if (r.ok) { DATA = await r.json(); BASE = p.replace(/events\\.json$/, ''); break; } } catch (e) {}\n  }\n  if (!DATA) { $('slides').innerHTML = `\u003cdiv class=\"empty\">\u003ch2>Events could not be loaded\u003c/h2>\u003cp>The events list is missing. Please let the Language Lab know.\u003c/p>\u003c/div>`; $('rail-wrap').hidden = true; return; }\n  ALL = (DATA.events || []).filter(e => e.status !== 'draft' && endOf(e) >= NOW)\n    .sort((a, b) => at(a.date, a.start) - at(b.date, b.start));\n  if (DATA.title) $('sub').textContent = DATA.title;\n  const hash = PV?.ev || location.hash.replace('#ev-', '').replace('#', '');\n  render();\n  if (hash) { const k = LIST.findIndex(e => e.id === hash); if (k >= 0) go(k, false); }\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","details":"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Event Details · Language Lab\u003c/title>\n\u003c!-- Student-facing. Opened from event-carousel.html as event-details.html?ev=\u003cevent id> (or #rules, #judging … to open a section).\n     Reads ../current/events.json, the event's rubric (../current/rubrics/*.json) and prize photos (../current/prizes/\u003ckey>-prize-\u003cn>.jpg|png…).\n     Layout: left menu (like the Event Planner) shows one section at a time; \"View all\" stacks every section.\n     Phones/tablets (≤860px): the menu becomes a slide-out left drawer opened by the ☰ Sections button (like the Pulse app). -->\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap\">\n\u003cstyle>\n[hidden] { display: none !important; } /* .btn's display would otherwise show hidden buttons (\"Open flyer\" with no flyer) */\n:root {\n  --bg: #F7F7F5; --surface: #FFFFFF; --sunk: #EFEFEC;\n  --ink: #1F2937; --muted: #5A6472; --faint: #657081;\n  --navy: #1A3A6B; --gold: #8A6D2E;\n  --border: rgba(31,41,55,0.14); --border-strong: rgba(31,41,55,0.28);\n  --today: rgba(26,58,107,0.07); --focus: #1A3A6B;\n  --band-bg: #1A3A6B; --band-text: #FFFFFF; --band-gold: #D9B968;\n  --gold-bg: #FBF3E3; --gold-tx: #7A5D14;\n  --ok-bg: #DCFCE7; --ok-tx: #166534;\n  --l3-bg: #DCFCE7; --l3-tx: #166534; --l2-bg: #DBEAFE; --l2-tx: #1A3A6B; --l1-bg: #F3F4F6; --l1-tx: #374151;\n  --modal-shadow: 0 16px 48px rgba(0,0,0,0.2); /* theme.json shadows.modalShadow */\n  --scrim: color-mix(in srgb, var(--band-bg) 50%, transparent);\n  --serif: \"Source Serif 4\", Georgia, serif; --sans: \"DM Sans\", \"Segoe UI\", Arial, sans-serif; --mono: \"JetBrains Mono\", Consolas, monospace;\n  color-scheme: light;\n}\n:root[data-mode=\"dark\"] {\n  --bg: #0F1115; --surface: #181B22; --sunk: #13161B;\n  --ink: #F1F3F6; --muted: #B8C0CE; --faint: #7A8496;\n  --navy: #7B9FE0; --gold: #D9B968;\n  --border: rgba(241,243,246,0.14); --border-strong: rgba(241,243,246,0.28);\n  --today: rgba(123,159,224,0.12); --focus: #D9B968;\n  --gold-bg: rgba(217,185,104,0.16); --gold-tx: #E8CC7E;\n  --ok-bg: rgba(74,222,128,0.16); --ok-tx: #86EFAC;\n  --l3-bg: rgba(74,222,128,0.16); --l3-tx: #86EFAC; --l2-bg: rgba(123,159,224,0.16); --l2-tx: #A9C3EE; --l1-bg: rgba(241,243,246,0.08); --l1-tx: #B8C0CE;\n  color-scheme: dark;\n}\n* { box-sizing: border-box; }\nhtml, body { height: 100%; }\nbody { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.55 var(--sans); }\na { color: var(--navy); }\nbutton { font: inherit; color: inherit; }\n:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }\n.skip { position: absolute; left: -9999px; } .skip:focus { left: 8px; top: 8px; z-index: 20; background: var(--band-bg); color: #fff; padding: 10px 16px; font-weight: 700; }\n.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }\n\n/* compact band (mode-invariant band colors) with a papel-picado edge */\n.band { background: var(--band-bg); color: var(--band-text); position: relative; padding-bottom: 12px; }\n.band::after { content: \"\"; position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: var(--bg);\n  -webkit-mask: radial-gradient(circle at 10px 0, transparent 7px, #000 8px) 0 0 / 20px 12px repeat-x; mask: radial-gradient(circle at 10px 0, transparent 7px, #000 8px) 0 0 / 20px 12px repeat-x; }\n.band-in { max-width: 1160px; margin: 0 auto; padding: 12px 16px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 20px; align-items: center; }\n/* back to the carousel: a real button, set apart from the title */\n.back { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px 0 12px; margin-bottom: 12px; border-radius: 9px; border: 1.5px solid rgba(255,255,255,.6); background: rgba(255,255,255,.1); color: var(--band-text); font-weight: 700; font-size: .95rem; text-decoration: none; }\n.back:hover { background: rgba(255,255,255,.2); }\n.back .arr { font-size: 1.15rem; line-height: 1; }\n.menu-back { margin-top: 2px; text-decoration: none; }\n.band h1 { margin: 2px 0 0; font: 700 clamp(1.6rem, 3.6vw, 2.3rem)/1.1 var(--serif); }\n.band .alt { font: italic 400 1.05rem var(--serif); color: var(--band-gold); margin-left: 8px; }\n.band .when { margin: 2px 0 0; font-size: .95rem; opacity: .92; }\n.band .acts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }\n.btn { min-height: 44px; padding: 0 16px; border-radius: 9px; font: 700 .92rem var(--sans); display: inline-flex; align-items: center; gap: 8px; text-decoration: none; cursor: pointer; border: 1px solid transparent; }\n.btn.gold { background: var(--band-gold); color: #1F2937; }\n.btn.ghost { background: transparent; color: var(--band-text); border-color: rgba(255,255,255,.45); }\n.btn.navy { background: var(--navy); color: var(--surface); }\n.page-toolbar { display: flex; gap: 6px; flex-wrap: wrap; }\n.page-toolbar button { min-height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.35); background: transparent; color: var(--band-text); font: 600 .85rem var(--sans); cursor: pointer; }\n.page-toolbar button:hover { background: rgba(255,255,255,.1); }\n.band :focus-visible { outline-color: var(--band-gold); }\n\n/* shell: left menu + one panel */\n.shell { max-width: 1160px; margin: 0 auto; padding: 18px 16px 40px; display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 24px; align-items: start; }\n.menu { position: sticky; top: 12px; display: grid; gap: 6px; }\n.tab { display: grid; grid-template-columns: 30px 1fr; align-items: center; gap: 8px; width: 100%; text-align: left; background: var(--surface); border: 1.5px solid var(--border); border-left: 5px solid transparent; border-radius: 9px; padding: 8px 10px; min-height: 48px; cursor: pointer; font-weight: 600; }\n.tab .ic { font: 700 .95rem var(--mono); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); color: var(--muted); }\n.tab small { display: block; font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }\n.tab:hover { border-left-color: var(--band-gold); }\n.tab[aria-selected=\"true\"] { background: var(--band-bg); border-color: var(--band-bg); border-left-color: var(--band-gold); color: #fff; }\n.tab[aria-selected=\"true\"] .ic { background: var(--band-gold); color: #1F2937; }\n.tab[aria-selected=\"true\"] small { color: #E8D9A8; }\n.viewall { margin-top: 6px; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border-radius: 9px; border: 1.5px dashed var(--border-strong); background: transparent; cursor: pointer; font-weight: 700; color: var(--navy); }\n.viewall[aria-pressed=\"true\"] { background: var(--gold-bg); color: var(--gold-tx); border-style: solid; border-color: var(--gold); }\nmain { min-width: 0; }\n.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px 24px; display: grid; gap: 16px; }\n.panel[hidden] { display: none; }\n.all .panel { margin-bottom: 18px; }\n.panel h2 { margin: 0; font: 700 1.5rem/1.2 var(--serif); }\n.panel h2 .es { font: italic 400 1rem var(--serif); color: var(--muted); margin-left: 8px; }\n.lede { margin: 0; color: var(--muted); max-width: 64ch; }\n.next { display: flex; justify-content: flex-end; }\n.next button { background: none; border: 0; color: var(--navy); font-weight: 700; cursor: pointer; min-height: 40px; }\n.all .next { display: none; }\n.mbar, .dhead, .scrim { display: none; }\n\n/* start */\n.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 0; }\n.fact { background: var(--sunk); border-radius: 10px; padding: 10px 12px; }\n.fact dt { font: 700 .74rem var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }\n.fact dd { margin: 2px 0 0; font-weight: 600; }\n.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; counter-reset: s; }\n.steps li { counter-increment: s; border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; align-content: start; }\n.steps li::before { content: counter(s); width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--band-bg); color: #fff; font: 700 .95rem var(--mono); margin-bottom: 4px; }\n.steps b { font: 700 1.05rem var(--serif); }\n.steps span { font-size: .93rem; color: var(--muted); }\n\n/* prizes */\n.podium { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }\n.prize { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }\n.prize[data-rank=\"1\"] { border: 2px solid var(--gold); }\n.prize .img { aspect-ratio: 4/3; background: var(--sunk); display: grid; place-items: center; overflow: hidden; }\n.prize .img img { width: 100%; height: 100%; object-fit: cover; }\n.mystery { display: grid; place-items: center; gap: 4px; text-align: center; color: var(--muted); font-size: .9rem; }\n.mystery .q { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font: 700 1.8rem var(--serif); background: var(--gold-bg); color: var(--gold-tx); border: 2px dashed currentColor; }\n.prize .b { padding: 10px 12px; display: grid; gap: 2px; }\n.place { font-weight: 700; }\n.prize .name { font: 700 1.05rem var(--serif); }\n.prize .tba { color: var(--muted); font-size: .9rem; }\n.note { background: var(--gold-bg); color: var(--gold-tx); border-radius: 10px; padding: 8px 12px; font-weight: 600; margin: 0; }\n\n/* rules */\n.rules { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }\n.rules li { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px 12px 48px; position: relative; }\n.rules li::before { content: \"✓\"; position: absolute; left: 14px; top: 12px; width: 24px; height: 24px; border-radius: 50%; background: var(--ok-bg); color: var(--ok-tx); display: grid; place-items: center; font-weight: 700; font-size: .85rem; }\n\n/* rubric grid */\n.gridwrap { overflow-x: auto; }\ntable.grid { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 620px; font-size: .95rem; }\ntable.grid caption { text-align: left; font-weight: 700; padding-bottom: 8px; }\ntable.grid th, table.grid td { padding: 10px 12px; vertical-align: top; text-align: left; border-bottom: 1px solid var(--border); }\ntable.grid thead th { font-size: .9rem; border-bottom: 2px solid var(--border-strong); }\ntable.grid thead th .pts { display: block; font: 500 .78rem var(--mono); }\ntable.grid thead th.l3 { background: var(--l3-bg); color: var(--l3-tx); border-radius: 10px 0 0 0; }\ntable.grid thead th.l2 { background: var(--l2-bg); color: var(--l2-tx); }\ntable.grid thead th.l1 { background: var(--l1-bg); color: var(--l1-tx); border-radius: 0 10px 0 0; }\ntable.grid tbody th { width: 28%; }\ntable.grid tbody th b { display: block; font: 700 1.1rem var(--serif); }\ntable.grid tbody th .es { font: italic .9rem var(--serif); color: var(--muted); }\ntable.grid tbody th small { display: block; font-weight: 400; color: var(--muted); font-size: .85rem; margin-top: 2px; }\ntable.grid td.l3 { background: color-mix(in srgb, var(--l3-bg) 45%, transparent); }\n.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }\n.how div { background: var(--sunk); border-radius: 10px; padding: 10px 12px; font-size: .93rem; }\n.how b { display: block; }\n\n/* ideas: elements grid with checklist */\n.elements { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }\n.el { position: relative; }\n.el input { position: absolute; opacity: 0; width: 1px; height: 1px; }\n.el label { display: grid; grid-template-columns: 28px 1fr; gap: 2px 10px; border: 1px solid var(--border); border-radius: 12px; padding: 12px; cursor: pointer; height: 100%; background: var(--surface); }\n.el .box { grid-row: span 4; width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--border-strong); display: grid; place-items: center; font-weight: 700; color: transparent; }\n.el input:checked + label { border-color: var(--ok-tx); background: var(--ok-bg); }\n.el input:checked + label .box { background: var(--ok-tx); border-color: var(--ok-tx); color: var(--surface); }\n.el input:focus-visible + label { outline: 3px solid var(--focus); outline-offset: 2px; }\n.el .en { font: 700 1.05rem var(--serif); }\n.el .es { font: italic .9rem var(--serif); color: var(--muted); }\n.el .m { font-size: .9rem; }\n.el .mk { font-size: .85rem; color: var(--gold-tx); font-weight: 600; }\n.progress { font-weight: 700; color: var(--ok-tx); }\n.bylines { margin: 0; display: flex; flex-wrap: wrap; gap: 8px; }\n.bylines span { background: var(--gold-bg); color: var(--gold-tx); border-radius: 999px; padding: 4px 12px; font-size: .93rem; }\n.links { margin: 0; padding-left: 1.2rem; display: grid; gap: 6px; }\n.empty { padding: 32px; text-align: center; }\n\n@media (max-width: 860px) {\n  .band-in { grid-template-columns: 1fr; } .band .acts { justify-content: flex-start; }\n  .shell { grid-template-columns: 1fr; gap: 12px; padding-top: 6px; }\n  /* sticky bar: ☰ Sections + where you are */\n  .mbar { display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0; border-bottom: 1px solid var(--border); }\n  .hamb { display: inline-flex; align-items: center; gap: 10px; flex: 0 0 auto; min-height: 44px; padding: 0 16px 0 12px; border-radius: 9px; border: 1.5px solid var(--border-strong); background: var(--surface); font-weight: 700; cursor: pointer; }\n  .hamb svg { width: 22px; height: 22px; }\n  .mcur { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-weight: 600; font-size: .92rem; }\n  .mcur b { color: var(--ink); }\n  /* the menu becomes a left drawer */\n  .menu { position: fixed; inset: 0 auto 0 0; z-index: 30; width: min(320px, 86vw); background: var(--bg); padding: 10px 12px 24px; overflow-y: auto; align-content: start; border-right: 1px solid var(--border); box-shadow: var(--modal-shadow); transform: translateX(-104%); visibility: hidden; }\n  .drawer-open .menu { transform: none; visibility: visible; }\n  .dhead { display: flex; align-items: center; justify-content: space-between; padding: 2px 2px 8px 4px; margin-bottom: 4px; border-bottom: 1px solid var(--border); }\n  .dhead b { font: 700 1.1rem var(--serif); }\n  .dclose { width: 44px; height: 44px; border-radius: 9px; border: 0; background: transparent; font-size: 1.25rem; cursor: pointer; }\n  .dclose:hover { background: var(--sunk); }\n  .scrim { display: block; position: fixed; inset: 0; z-index: 25; background: var(--scrim); opacity: 0; visibility: hidden; }\n  .drawer-open .scrim { opacity: 1; visibility: visible; }\n  body.drawer-open { overflow: hidden; }\n  .panel { padding: 18px 16px; }\n}\n@media (max-width: 860px) and (prefers-reduced-motion: no-preference) {\n  .menu { transition: transform .22s ease-out, visibility 0s linear .22s; }\n  .scrim { transition: opacity .22s ease-out, visibility 0s linear .22s; }\n  .drawer-open .menu, .drawer-open .scrim { transition-delay: 0s; }\n}\n@media (prefers-reduced-motion: no-preference) { .panel:not([hidden]) { animation: in .2s ease-out; } @keyframes in { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } } }\n@page { size: letter; margin: 0.6in; }\n@media print {\n  .no-print, .page-toolbar, .menu, .mbar, .scrim, .skip, .back, .next, .band .acts { display: none !important; }\n  body { background: #fff !important; color: #000 !important; }\n  .band { background: #fff !important; color: #000 !important; border-bottom: 2px solid #000; } .band::after { display: none; } .band .alt { color: #333 !important; }\n  .shell { display: block; max-width: 100%; padding: 0; }\n  .panel, .panel[hidden] { display: grid !important; border: 0; padding: 0 0 16px; break-inside: avoid; }\n  * { box-shadow: none !important; }\n  table.grid { min-width: 0; } .el, .rules li, .prize { break-inside: avoid; }\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003ca class=\"skip\" href=\"#main\">Skip to details\u003c/a>\n\u003cheader class=\"band\">\n  \u003cdiv class=\"band-in\" id=\"band\">\u003cdiv>\u003ca class=\"back\" id=\"back\" href=\"event-carousel.html\">\u003cspan class=\"arr\" aria-hidden=\"true\">←\u003c/span>All events\u003c/a>\u003ch1>Loading…\u003c/h1>\u003c/div>\u003c/div>\n\u003c/header>\n\u003cdiv class=\"shell\" id=\"shell\">\n  \u003cdiv class=\"mbar no-print\">\u003cbutton class=\"hamb\" type=\"button\" id=\"menuBtn\" aria-expanded=\"false\" aria-controls=\"menu\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\">\u003cpath d=\"M4 6h16M4 12h16M4 18h16\"/>\u003c/svg>Sections\u003c/button>\u003cspan class=\"mcur\" id=\"mcur\">\u003c/span>\u003c/div>\n  \u003cnav class=\"menu no-print\" id=\"menu\" aria-label=\"Sections\">\u003cdiv class=\"dhead\">\u003cb>Sections\u003c/b>\u003cbutton class=\"dclose\" type=\"button\" id=\"menuClose\" aria-label=\"Close sections menu\">✕\u003c/button>\u003c/div>\u003cdiv role=\"tablist\" aria-orientation=\"vertical\" id=\"tabs\" style=\"display:contents\">\u003c/div>\u003cbutton class=\"viewall\" type=\"button\" id=\"viewAll\" aria-pressed=\"false\">View all\u003c/button>\u003ca class=\"viewall menu-back\" id=\"menuBack\" href=\"event-carousel.html\">← All events\u003c/a>\u003c/nav>\n  \u003cdiv class=\"scrim no-print\" id=\"scrim\">\u003c/div>\n  \u003cmain id=\"main\" tabindex=\"-1\">\u003c/main>\n\u003c/div>\n\u003cp class=\"sr\" aria-live=\"polite\" id=\"live\">\u003c/p>\n\n\u003cscript>\nconst DATA_PATHS = ['../current/events.json', './events.json'];\nconst IMG_EXTS = ['.jpg', '.jpeg', '.png', '.webp', '.avif', '.gif'];\nconst params = new URLSearchParams(location.search);\n/* Preview hook: the Event Planner injects window.__LAB_PREVIEW__ = { doc, rubrics, files, ev, open, mode } so this page renders unsaved data. */\nconst PV = window.__LAB_PREVIEW__ || null;\nconst $ = id => document.getElementById(id);\nconst esc = s => String(s ?? '').replace(/[&\u003c>\"']/g, c => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\nconst at = (d, t) => new Date(`${d}T${t || '00:00'}`);\nconst fmtTime = t => { if (!t) return ''; const [h, m] = t.split(':').map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${h \u003c 12 ? 'AM' : 'PM'}`; };\nconst fmtDate = d => at(d).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });\nconst ordinal = n => n + ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10 * (Math.floor(n / 10) % 10 !== 1)] || 'th');\nconst fileURL = (base, f) => PV ? (PV.files[f] || '') : base + f;\nconst cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : '';\n/* deadlines: optional time; a date with no time means the end of that day. The planner preview can pretend it's another day. */\nconst NOW = PV?.today ? new Date(PV.today + 'T08:00') : (params.get('today') ? new Date(params.get('today') + 'T08:00') : new Date());\nconst byWhen = (d, t) => at(d).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }) + (t ? ', ' + fmtTime(t) : '');\nconst passed = (d, t) => !!d && NOW > at(d, t || '23:59');\n\nfunction setMode(m) { document.documentElement.dataset.mode = m; const b = $('mode-btn'); if (b) b.textContent = m === 'dark' ? 'Light mode' : 'Dark mode'; try { if (!PV) localStorage.setItem('labEventsMode', m); } catch (e) {} }\nfunction toggleMode() { setMode(document.documentElement.dataset.mode === 'dark' ? 'light' : 'dark'); }\nfunction initMode() { let m = PV?.mode || null; if (!m) { try { m = localStorage.getItem('labEventsMode'); } catch (e) {} } setMode(m || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')); }\n/* Full screen (2026-10-29). Three places this page runs:\n   - its own tab: the button goes full screen;\n   - a frame the Event Planner made (Preview, or the exported carousel file): the hosting frame goes full screen, so it stays\n     full screen through \"See details\" and \"Back\";\n   - D2L's frame, which can't go full screen: the same page opens in its own tab (if pop-ups are blocked, it fills the frame).\n   A page built in memory is never copied into a new tab: the copy would lose the Planner's data. */\nlet filled = false;\nfunction hostFrame() { try { return window.frameElement; } catch (e) { return null; } }\nfunction fsEl() { const fe = hostFrame(); try { if (fe && fe.ownerDocument.fullscreenElement === fe) return fe; } catch (e) {} return document.fullscreenElement; }\nconst inMemory = () => !/^(https?|file):/.test(location.protocol);\nfunction fillFrame() { filled = true; syncFS(); } /* details already fills its frame; only the button label changes */\nfunction openFull() {\n  const fe = hostFrame();\n  if (fe && fe.ownerDocument.fullscreenEnabled) { fe.requestFullscreen().catch(fillFrame); return; }\n  if (inMemory() || !window.open(location.href, '_blank')) fillFrame();\n}\nfunction toggleFS() {\n  const el = fsEl(); if (el) { el.ownerDocument.exitFullscreen(); return; }\n  if (filled) { filled = false; syncFS(); return; }\n  const fe = hostFrame();\n  if (fe && fe.ownerDocument.fullscreenEnabled) { openFull(); return; }\n  if (document.fullscreenEnabled) document.documentElement.requestFullscreen().catch(openFull); else openFull();\n}\naddEventListener('DOMContentLoaded', () => { const b = document.getElementById('fs-btn'), fe = hostFrame();\n  if (b && !document.fullscreenEnabled && !(fe && fe.ownerDocument.fullscreenEnabled) && !inMemory()) { b.textContent = '⛶ Full Screen (new tab)'; b.title = 'This frame cannot go full screen, so the page opens in its own tab'; } });\nfunction syncFS() { const b = $('fs-btn'); if (b && (fsEl() || filled || b.textContent.includes('Exit'))) b.textContent = fsEl() || filled ? '⛶ Exit Full Screen' : '⛶ Full Screen'; }\ndocument.addEventListener('fullscreenchange', syncFS);\n(() => { const fe = hostFrame(); if (fe) fe.ownerDocument.addEventListener('fullscreenchange', syncFS); })();\ninitMode();\n\nconst mystery = place => `\u003cdiv class=\"mystery\">\u003cspan class=\"q\" aria-hidden=\"true\">?\u003c/span>\u003cspan>${esc(place)} prize\u003cbr>coming soon\u003c/span>\u003c/div>`;\nfunction imgFallback(img) {\n  if (PV) { img.closest('.img').innerHTML = mystery(img.dataset.place); return; }\n  const tried = (img.dataset.tried || '').split('|').filter(Boolean), next = IMG_EXTS.find(x => !tried.includes(x));\n  if (!next) { img.closest('.img').innerHTML = mystery(img.dataset.place); return; }\n  img.dataset.tried = [...tried, next].join('|'); img.src = img.dataset.base + next;\n}\nfunction ics(e) {\n  const d = e.date.replace(/-/g, ''), t = x => (x || '00:00').replace(':', '') + '00';\n  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//UNG Language Lab//Events//EN', 'BEGIN:VEVENT', `UID:${e.id}@ung-language-lab`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`,\n    `DTSTART:${d}T${t(e.start)}`, `DTEND:${d}T${t(e.end || e.start)}`, `SUMMARY:${(e.title || '').replace(/[,;]/g, '\\\\$&')}`, `LOCATION:${(e.location || '').replace(/[,;]/g, '\\\\$&')}`, 'END:VEVENT', 'END:VCALENDAR'];\n  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([L.join('\\r\\n')], { type: 'text/calendar' })); a.download = `${e.id}.ics`; document.body.appendChild(a); a.click(); a.remove();\n}\n\nlet SECTIONS = [], current = '', viewAll = false;\nfunction render(e, R, base) {\n  document.title = `${R?.title || e.title} · Language Lab`;\n  const closed = passed(e.entry?.deadline, e.entry?.deadline_time);\n  const entry = !e.entry?.url ? '' : closed ? `\u003cspan class=\"btn ghost\" aria-disabled=\"true\" style=\"opacity:.7;cursor:default\">Entries closed\u003c/span>` : `\u003ca class=\"btn gold\" href=\"${esc(e.entry.url)}\" target=\"_blank\" rel=\"noopener\">${esc(e.entry.label || 'Enter')}\u003c/a>`;\n  const byLine = [e.entry?.url && e.entry.deadline && `\u003cspan>\u003cb>${closed ? 'Entries closed' : 'Enter by'}\u003c/b> ${esc(byWhen(e.entry.deadline, e.entry.deadline_time))}\u003c/span>`,\n    e.mini_project?.due && `\u003cspan>\u003cb>Turn in by\u003c/b> ${esc(byWhen(e.mini_project.due, e.mini_project.due_time))}\u003c/span>`].filter(Boolean).join('');\n  $('band').innerHTML = `\u003cdiv>\u003ca class=\"back\" id=\"back\" href=\"event-carousel.html#ev-${encodeURIComponent(e.id)}\">\u003cspan class=\"arr\" aria-hidden=\"true\">←\u003c/span>All events\u003c/a>\n      \u003ch1>${esc(R?.title || e.title)}${(R?.title_alt || e.title_alt) ? `\u003cspan class=\"alt\" lang=\"${esc(R?.title_alt_lang || e.title_alt_lang || 'es')}\">${esc(R?.title_alt || e.title_alt)}\u003c/span>` : ''}\u003c/h1>\n      \u003cp class=\"when\">${esc(fmtDate(e.date))} · ${esc(fmtTime(e.start))}${e.end ? '–' + esc(fmtTime(e.end)) : ''} · ${esc(e.location || '')}\u003c/p>\u003c/div>\n    \u003cdiv class=\"acts\">${entry}\u003cbutton class=\"btn ghost\" type=\"button\" id=\"icsBtn\">Add to calendar\u003c/button>\n      \u003cdiv class=\"page-toolbar no-print\">\u003cbutton type=\"button\" id=\"mode-btn\" onclick=\"toggleMode()\">Dark mode\u003c/button>\u003cbutton type=\"button\" onclick=\"window.print()\">🖨 Print\u003c/button>\u003cbutton type=\"button\" id=\"fs-btn\" onclick=\"toggleFS()\">⛶ Full Screen\u003c/button>\u003c/div>\u003c/div>`;\n  initMode();\n  $('icsBtn').onclick = () => ics(e);\n  $('menuBack').href = $('back').href;\n  if (PV) $('back').onclick = $('menuBack').onclick = ev => { ev.preventDefault(); PV.open('carousel', e.id); };\n\n  const S = [];\n  /* 1. start: facts + steps */\n  const facts = R?.facts?.length ? R.facts : [{ label: 'When', value: `${fmtDate(e.date)}, ${fmtTime(e.start)}` }, { label: 'Where', value: e.location }];\n  const steps = e.mini_project?.steps?.length ? e.mini_project.steps : (e.activities || []).map(a => a.text).filter(Boolean);\n  const stepTitles = ['Pick someone', 'Make it', 'Explain it', 'Bring it'];\n  const allSteps = [...steps, ...(e.mini_project?.deliverable ? [e.mini_project.deliverable] : [])];\n  S.push({ id: 'start', label: 'Start here', sub: 'The quick version', html: `\u003ch2>Start here\u003c/h2>\u003cp class=\"lede\">${esc(R?.summary || e.summary || '')}\u003c/p>\n    \u003cdl class=\"facts\">${facts.map(f => `\u003cdiv class=\"fact\">\u003cdt>${esc(f.label)}\u003c/dt>\u003cdd>${esc(f.value)}\u003c/dd>\u003c/div>`).join('')}\u003c/dl>\n    ${allSteps.length ? `\u003col class=\"steps\">${allSteps.map((s, i) => `\u003cli>\u003cb>${stepTitles[i] || 'Step ' + (i + 1)}\u003c/b>\u003cspan>${esc(s)}\u003c/span>\u003c/li>`).join('')}\u003c/ol>` : ''}\n    ${byLine ? `\u003cp class=\"bylines\">${byLine}\u003c/p>` : ''}\n    ${entry && !closed ? `\u003cdiv>${entry.replace('btn gold', 'btn navy')}\u003c/div>` : ''}` });\n  /* 2. prizes */\n  if (e.prizes?.length || e.prizes_note) {\n    const cards = (e.prizes || []).map((p, i) => {\n      const place = p.place || ordinal(i + 1) + ' place', file = p.image || `prizes/${e.key}-prize-${i + 1}.jpg`, src = fileURL(base, file);\n      const img = (PV && !src) ? mystery(place) : `\u003cimg src=\"${esc(src)}\" alt=\"${esc(p.alt || p.name || place + ' prize')}\" data-base=\"${esc(base + file.replace(/\\.[a-z0-9]+$/i, ''))}\" data-place=\"${esc(place)}\" data-tried=\"${esc((file.match(/\\.[a-z0-9]+$/i) || ['.jpg'])[0])}\" onerror=\"imgFallback(this)\">`;\n      return `\u003carticle class=\"prize\" data-rank=\"${i + 1}\">\u003cdiv class=\"img\">${img}\u003c/div>\u003cdiv class=\"b\">\u003cspan class=\"place\">${esc(place)}\u003c/span>${p.name ? `\u003cspan class=\"name\">${esc(p.name)}\u003c/span>` : `\u003cspan class=\"tba\">To be announced\u003c/span>`}\u003c/div>\u003c/article>`;\n    }).join('');\n    S.push({ id: 'prizes', label: 'Prizes', sub: (e.prizes || []).length ? `${e.prizes.length} to win` : 'Coming soon', html: `\u003ch2>Prizes \u003cspan class=\"es\" lang=\"es\">Premios\u003c/span>\u003c/h2>${e.prizes_note ? `\u003cp class=\"note\">${esc(e.prizes_note)}\u003c/p>` : ''}\u003cdiv class=\"podium\">${cards}\u003c/div>` });\n  }\n  /* 3. rules */\n  const rules = [...(R?.requirements || []).map(r => r.text), ...(e.rules || [])];\n  if (rules.length) S.push({ id: 'rules', label: 'Rules', sub: `${rules.length} quick ones`, html: `\u003ch2>Rules \u003cspan class=\"es\" lang=\"es\">Reglas\u003c/span>\u003c/h2>\u003cul class=\"rules\">${rules.map(r => `\u003cli>${esc(r)}\u003c/li>`).join('')}\u003c/ul>${R?.disqualifiers?.length ? `\u003cp class=\"lede\">Entries can be removed for: ${R.disqualifiers.map(esc).join(' ')}\u003c/p>` : ''}` });\n  /* 4. judging grid */\n  if (R?.criteria?.length) {\n    const lv = [...(R.scale?.levels || [{ value: 3, label: '3' }, { value: 2, label: '2' }, { value: 1, label: '1' }])].sort((a, b) => b.value - a.value);\n    const top = lv[0].value;\n    const cls = v => 'l' + Math.min(3, Math.max(1, Math.round(v / top * 3)));\n    const total = R.total_points || R.criteria.reduce((s, c) => s + c.points, 0);\n    const ptsFor = (c, l) => { const p = Math.round(l.value / top * c.points * 10) / 10; return `${p} point${p === 1 ? '' : 's'}`; };\n    const samePts = R.criteria.every(c => c.points === top);\n    const grid = `\u003cdiv class=\"gridwrap\">\u003ctable class=\"grid\">\u003ccaption>What judges look for: ${R.criteria.length} areas, ${total} points\u003c/caption>\n      \u003cthead>\u003ctr>\u003cth scope=\"col\">Area\u003c/th>${lv.map(l => `\u003cth scope=\"col\" class=\"${cls(l.value)}\">${esc(l.label)}${l.label_alt ? ` \u003cspan lang=\"es\">· ${esc(l.label_alt)}\u003c/span>` : ''}${samePts ? `\u003cspan class=\"pts\">${ptsFor(R.criteria[0], l)}\u003c/span>` : ''}\u003c/th>`).join('')}\u003c/tr>\u003c/thead>\n      \u003ctbody>${R.criteria.map(c => `\u003ctr>\u003cth scope=\"row\">\u003cb>${esc(c.name)}\u003c/b>${c.name_alt ? `\u003cspan class=\"es\" lang=\"es\">${esc(c.name_alt)}\u003c/span>` : ''}\u003csmall>${esc(c.question || '')}${samePts ? '' : ` · ${c.points} pts`}\u003c/small>\u003c/th>${lv.map(l => `\u003ctd class=\"${cls(l.value)}\">${esc(c.levels?.[l.value] || '')}\u003c/td>`).join('')}\u003c/tr>`).join('')}\u003c/tbody>\u003c/table>\u003c/div>`;\n    S.push({ id: 'judging', label: 'How it’s judged', sub: `${R.criteria.length} areas · ${total} pts`, html: `\u003ch2>How it’s judged \u003cspan class=\"es\" lang=\"es\">Rúbrica\u003c/span>\u003c/h2>${grid}\n      \u003cdiv class=\"how\">${R.judging ? `\u003cdiv>\u003cb>${R.judging.judges || ''} judges${R.judging.blind ? ', names hidden' : ''}\u003c/b>${esc(R.judging.how)}\u003c/div>` : ''}${R.tiebreakers?.length ? `\u003cdiv>\u003cb>If there’s a tie\u003c/b>${R.tiebreakers.map(esc).join(' ')}\u003c/div>` : ''}\u003c/div>` });\n  }\n  /* 5. ideas checklist */\n  if (R?.essential_elements?.length) {\n    const key = `labEventChecklist:${R.id}`; let saved = []; try { saved = JSON.parse(localStorage.getItem(key)) || []; } catch (x) {}\n    S.push({ id: 'ideas', label: 'Ideas to include', sub: 'Pick 3 or more', html: `\u003ch2>Ideas to include \u003cspan class=\"es\" lang=\"es\">Los elementos\u003c/span>\u003c/h2>\u003cp class=\"lede\">Pick at least three. Your own version is perfect. Tick them to plan; your list stays on this device. \u003cspan class=\"progress\" id=\"prog\" aria-live=\"polite\">\u003c/span>\u003c/p>\n      \u003cdiv class=\"elements\">${R.essential_elements.map((x, i) => `\u003cdiv class=\"el\">\u003cinput type=\"checkbox\" id=\"el${i}\" data-i=\"${i}\" ${saved.includes(i) ? 'checked' : ''}>\u003clabel for=\"el${i}\">\u003cspan class=\"box\" aria-hidden=\"true\">✓\u003c/span>\u003cspan class=\"en\">${esc(cap(x.en) || x.es)}\u003c/span>\u003cspan class=\"es\" lang=\"es\">${esc(x.es)}\u003c/span>\u003cspan class=\"m\">${esc(x.meaning)}\u003c/span>${x.make ? `\u003cspan class=\"mk\">Make it: ${esc(x.make)}\u003c/span>` : '\u003cspan>\u003c/span>'}\u003c/label>\u003c/div>`).join('')}\u003c/div>`,\n      after: () => { const upd = () => { const on = [...document.querySelectorAll('.el input:checked')].map(i => +i.dataset.i); try { localStorage.setItem(key, JSON.stringify(on)); } catch (x) {} $('prog').textContent = on.length ? `${on.length} picked` : ''; }; document.querySelectorAll('.el input').forEach(i => i.addEventListener('change', upd)); upd(); } });\n  }\n  /* 6. learn more */\n  if (R?.learn_more?.length) S.push({ id: 'learn', label: 'Learn more', sub: 'About the tradition', html: `\u003ch2>Learn more\u003c/h2>\u003cp class=\"lede\">Curious about the tradition? Start here.\u003c/p>\u003cul class=\"links\">${R.learn_more.map(l => `\u003cli>\u003ca href=\"${esc(l.url)}\" target=\"_blank\" rel=\"noopener\">${esc(l.label)}\u003c/a>\u003c/li>`).join('')}\u003c/ul>` });\n\n  SECTIONS = S;\n  $('main').innerHTML = S.map((s, i) => `\u003csection class=\"panel\" id=\"${s.id}\" role=\"tabpanel\" aria-labelledby=\"tab-${s.id}\" tabindex=\"-1\">${s.html}${i \u003c S.length - 1 ? `\u003cdiv class=\"next no-print\">\u003cbutton type=\"button\" data-go=\"${S[i + 1].id}\">Next: ${esc(S[i + 1].label)} →\u003c/button>\u003c/div>` : ''}\u003c/section>`).join('');\n  $('tabs').innerHTML = S.map((s, i) => `\u003cbutton class=\"tab\" type=\"button\" role=\"tab\" id=\"tab-${s.id}\" aria-controls=\"${s.id}\" data-go=\"${s.id}\">\u003cspan class=\"ic\" aria-hidden=\"true\">${i + 1}\u003c/span>\u003cspan>${esc(s.label)}\u003csmall>${esc(s.sub || '')}\u003c/small>\u003c/span>\u003c/button>`).join('');\n  S.forEach(s => s.after && s.after());\n  const h = location.hash.slice(1);\n  show(S.some(s => s.id === h) ? h : 'start', false);\n}\nfunction show(id, focus = true) {\n  current = id;\n  document.querySelectorAll('.tab').forEach(t => { t.setAttribute('aria-selected', t.dataset.go === id && !viewAll); t.tabIndex = t.dataset.go === id ? 0 : -1; });\n  document.querySelectorAll('.panel').forEach(p => p.hidden = !viewAll && p.id !== id);\n  if (focus && !viewAll) { $(id).focus({ preventScroll: true }); $('live').textContent = SECTIONS.find(s => s.id === id)?.label || ''; if (window.scrollY > 200) window.scrollTo({ top: 0 }); }\n  if (focus && viewAll) $(id).scrollIntoView({ block: 'start' });\n  const n = SECTIONS.findIndex(s => s.id === id);\n  $('mcur').innerHTML = viewAll ? '\u003cb>All sections\u003c/b>' : `${n + 1} of ${SECTIONS.length} · \u003cb>${esc(SECTIONS[n]?.label || '')}\u003c/b>`;\n  if (!PV) { try { history.replaceState(null, '', '#' + id); } catch (e) {} }\n}\n/* phone/tablet drawer: opened by ☰, closed by ✕, the scrim, Esc or picking a section; focus stays inside while open */\nconst narrow = matchMedia('(max-width: 860px)');\nconst drawerOpen = () => document.body.classList.contains('drawer-open');\nfunction setDrawer(open, refocus = true) {\n  open = open && narrow.matches;\n  document.body.classList.toggle('drawer-open', open);\n  $('menuBtn').setAttribute('aria-expanded', open);\n  if (open) (document.querySelector('.tab[aria-selected=\"true\"]') || $('menuClose')).focus();\n  else if (refocus && narrow.matches) $('menuBtn').focus();\n}\n$('menuBtn').onclick = () => setDrawer(true);\n$('menuClose').onclick = () => setDrawer(false);\n$('scrim').onclick = () => setDrawer(false);\nnarrow.addEventListener('change', () => { if (drawerOpen()) setDrawer(false, false); });\ndocument.addEventListener('keydown', ev => {\n  if (!drawerOpen()) return;\n  if (ev.key === 'Escape') { ev.preventDefault(); setDrawer(false); return; }\n  if (ev.key === 'Tab') {\n    const f = [...$('menu').querySelectorAll('button, a[href]')].filter(x => x.tabIndex >= 0), first = f[0], last = f[f.length - 1];\n    if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }\n    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }\n  }\n});\ndocument.addEventListener('click', ev => { const b = ev.target.closest('[data-go]'); if (b) { if (drawerOpen()) setDrawer(false, false); show(b.dataset.go); } });\n$('tabs').addEventListener('keydown', ev => {\n  const ids = SECTIONS.map(s => s.id), i = ids.indexOf(current), step = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[ev.key];\n  if (step) { ev.preventDefault(); const n = ids[(i + step + ids.length) % ids.length]; show(n, false); $('tab-' + n).focus(); }\n});\n$('viewAll').onclick = () => { if (drawerOpen()) setDrawer(false, false); viewAll = !viewAll; $('viewAll').setAttribute('aria-pressed', viewAll); $('viewAll').textContent = viewAll ? 'One at a time' : 'View all'; $('shell').classList.toggle('all', viewAll); show(current, false); $('live').textContent = viewAll ? 'Showing every section' : 'Showing one section'; };\n\n(async () => {\n  let D = PV ? PV.doc : null, base = '';\n  if (!D) for (const p of DATA_PATHS) { try { const r = await fetch(p, { cache: 'no-store' }); if (r.ok) { D = await r.json(); base = p.replace(/events\\.json$/, ''); break; } } catch (x) {} }\n  const id = PV?.ev || params.get('ev');\n  const e = D?.events?.find(x => x.id === id || x.key === id);\n  if (!e) { $('band').innerHTML = '\u003cdiv>\u003ca class=\"back\" href=\"event-carousel.html\">\u003cspan class=\"arr\" aria-hidden=\"true\">←\u003c/span>All events\u003c/a>\u003ch1>Event not found\u003c/h1>\u003c/div>'; $('main').innerHTML = `\u003cdiv class=\"panel empty\">\u003cp>This event may have ended. \u003ca href=\"event-carousel.html\">See upcoming events\u003c/a>.\u003c/p>\u003c/div>`; return; }\n  let R = null;\n  if (e.rubric && PV) R = PV.rubrics[e.rubric] || null;\n  else if (e.rubric) { try { const r = await fetch(base + e.rubric, { cache: 'no-store' }); if (r.ok) R = await r.json(); } catch (x) {} }\n  render(e, R, base);\n  syncFS(); // opened while already full screen (the Planner's frame stays full screen between pages)\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"};
